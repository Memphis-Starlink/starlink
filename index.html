  if(spiel.ansicht !== "galaxie") h += `<span>›</span><button data-ansicht="system">${sys.name}</button>`;
  if(spiel.ansicht === "objekt") h += `<span>›</span><span>${spiel.objekte[spiel.auswahl].name}</span>`;
  h += `</div>`;

  h += `<div class="karte">${spiel.ansicht === "galaxie" ? galaxieKarte() : systemKarte(sys)}</div>`;

  if(spiel.ansicht === "objekt")
    h += `<div style="margin-top:12px">${objektTafel(spiel.auswahl, g)}</div>`;
  else if(spiel.ansicht === "galaxie"){
    if(spiel.missionen.length){
      h += `<div class="rubrik"><h2>Unterwegs</h2>
        <span class="zusatz">${spiel.missionen.length} Flüge</span></div>`;
      for(const m of spiel.missionen){
        const sym = FLUG_SYMBOL[m.art] || FLUG_SYMBOL.erkunden;
        const rest = (m.endeAb - Date.now())/1000;
        const ziel = (m.art === "sammeln" || m.art === "besiedeln")
          ? spiel.objekte[m.ziel].name : spiel.systeme[m.nachSys].name;
        const flotte = Object.keys(m.schiffe).filter(t=>m.schiffe[t])
          .map(t=>`${m.schiffe[t]} ${SCHIFFE[t].name}`).join(", ") || "—";
        h += `<div class="posten-zeile">
          <svg width="26" height="26" viewBox="-6 -6 12 12" style="flex:none">
            ${sym.form(0,0,0)}</svg>
          <div class="rumpf">
            <div class="bezeichnung">${sym.name}
              <span class="stufe">${m.phase==="rueck"?"Rückflug":"nach "+ziel}</span></div>
            <div class="erlaeuterung">${flotte}</div></div>
          <div class="zahl" style="color:${sym.farbe}">${zeitText(rest*TEMPO)}</div></div>`;
      }
    }
    h += `<div class="rubrik"><h2>Ablesen</h2><span class="zusatz">Ein System anklicken zum Öffnen</span></div>
      <div class="flaeche"><div class="erlaeuterung">
      Erkundete Systeme zeigen ihren Stern, unerkundete einen grauen Punkt. Ein Ring markiert eigene
      Kolonien, rote Beschriftung Piraten. Gestrichelte Linien sind Flugbahnen unterwegs befindlicher
      Flotten.</div></div>`;
  }
  return h;
}

/* ------------------------------------------------------------
   Symbole für unterwegs befindliche Flotten.
   Jede Missionsart bekommt eine eigene Form, damit man sie auch
   ohne Beschriftung auseinanderhält.
   ------------------------------------------------------------ */
const FLUG_SYMBOL = {
  erkunden:  { farbe:"var(--signal)",     name:"Sonde",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <circle cx="0" cy="0" r="1.5" fill="none" stroke="var(--signal)" stroke-width="0.5"/>
      <path d="M-2.6 0 L2.6 0 M0 -2.6 L0 2.6" stroke="var(--signal)" stroke-width="0.4"/></g>` },
  besiedeln: { farbe:"var(--nahrung)",    name:"Siedlerschiff",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <path d="M3 0 L-2 2 L-1 0 L-2 -2 Z" fill="var(--nahrung)"/></g>` },
  sammeln:   { farbe:"var(--kupfer)",     name:"Frachter",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <rect x="-2.2" y="-1.4" width="4.4" height="2.8" rx="0.5" fill="var(--kupfer)"/>
      <path d="M2.2 0 L3.4 0" stroke="var(--kupfer)" stroke-width="0.6"/></g>` },
  angriff:   { farbe:"var(--alarm)",      name:"Kampfflotte",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <path d="M3.4 0 L-2.4 2.4 L-1 0 L-2.4 -2.4 Z" fill="var(--alarm)"/>
      <path d="M-1 0 L-3.4 0" stroke="var(--alarm)" stroke-width="0.5"/></g>` },
};

// Zeichnet alle laufenden Flüge zwischen den Systemen
function flugbahnen(){
  let out = "";
  const jetzt = Date.now();
  for(const m of spiel.missionen){
    const a = spiel.systeme[m.vonSys], b = spiel.systeme[m.nachSys];
    if(!a || !b || a.id === b.id) continue;
    const sym = FLUG_SYMBOL[m.art] || FLUG_SYMBOL.erkunden;

    // Anteil des zurückgelegten Weges
    const gesamt = m.endeAb - m.startAb;
    let t = gesamt > 0 ? (jetzt - m.startAb) / gesamt : 1;
    t = Math.max(0, Math.min(1, t));
    // Auf dem Rückflug läuft die Bewegung andersherum
    const von = m.phase === "rueck" ? b : a;
    const nach = m.phase === "rueck" ? a : b;

    const x = von.x + (nach.x - von.x) * t;
    const y = von.y + (nach.y - von.y) * t;
    const winkel = Math.atan2(nach.y - von.y, nach.x - von.x) * 180 / Math.PI;

    out += `<line x1="${von.x}" y1="${von.y}" x2="${nach.x}" y2="${nach.y}"
        stroke="${sym.farbe}" stroke-width="0.35" stroke-dasharray="2 2" opacity=".45"/>
      <line x1="${von.x}" y1="${von.y}" x2="${x}" y2="${y}"
        stroke="${sym.farbe}" stroke-width="0.45" opacity=".8"/>
      <circle cx="${x}" cy="${y}" r="3.4" fill="${sym.farbe}" opacity=".14"/>
      ${sym.form(x, y, winkel)}`;
  }
  return out;
}

function galaxieKarte(){
  let linien = "", punkte = "";
  const eigene = new Set();
  for(const id in spiel.kolonien) eigene.add(spiel.objekte[id].systemId);
  for(const s of spiel.systeme)
    if(eigene.has(s.id) && s.id !== 0)
      linien += `<line x1="${s.x}" y1="${s.y}" x2="${spiel.systeme[0].x}" y2="${spiel.systeme[0].y}"
                  stroke="var(--kante)" stroke-width="0.35" stroke-dasharray="1.4 1.6"/>`;
  for(const s of spiel.systeme){
    const anzKol = s.objekte.filter(o => spiel.kolonien[o]).length;
    const offen = spiel.offenesSystem === s.id;
    punkte += `<g class="punkt" data-system="${s.id}">
      ${offen?`<circle cx="${s.x}" cy="${s.y}" r="7" fill="none" stroke="var(--bernstein)" stroke-width="0.4" opacity=".8"/>`:""}
      ${anzKol?`<circle cx="${s.x}" cy="${s.y}" r="5.2" fill="none" stroke="var(--signal)" stroke-width="0.55"/>`:""}
      ${s.erkundet ? (() => {
        const st = STERNE[s.stern] || STERNE.gelber_stern;
        const r = 2.4 + st.groesse*1.6;          // Darstellungsgrösse nach Sterntyp
        return `<image href="${st.bild}" x="${s.x-r}" y="${s.y-r}"
          width="${r*2}" height="${r*2}" preserveAspectRatio="xMidYMid meet"/>`;
      })() : `<circle cx="${s.x}" cy="${s.y}" r="3" fill="#33485f"/>`}
      <text x="${s.x}" y="${s.y+7.8}" text-anchor="middle" font-size="3.1" font-weight="600"
        fill="${s.erkundet?"var(--text)":"var(--schwach)"}">${s.erkundet?s.name:"unbekannt"}</text>
      ${s.erkundet?`<text x="${s.x}" y="${s.y+11.6}" text-anchor="middle" font-size="2.5"
        fill="${s.piraten?"var(--alarm)":"var(--matt)"}">${s.piraten
          ? PIRATEN_ARTEN[s.piraten.art].name+" · "+piratenAnzahl(s)
          : s.objekte.length+" Objekte"+(anzKol?" · "+anzKol+" besiedelt":"")}</text>`:""}
    </g>`;
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    ${linien}${flugbahnen()}${punkte}</svg>`;
}

function systemKarte(sys){
  if(!sys.erkundet){
    const frei = flotteFrei("sonde");
    return `<div style="padding:16px">
      <div class="bezeichnung">${sys.name} — unerkundet</div>
      <div class="erlaeuterung">Eine Sonde deckt auf, welche Objekte hier liegen. ${frei} Sonden bereit.</div>
      <button data-sonde="${sys.id}" ${frei<1?"disabled":""} style="margin-top:11px">
        ${frei<1?"Keine Sonde verfügbar":"Sonde senden"}</button></div>`;
  }
  const sd = STERNE[sys.stern] || STERNE.gelber_stern;
  let kopf = `<div style="padding:12px 14px 2px;display:flex;gap:11px;align-items:center;flex-wrap:wrap">
    <img src="${sd.bild}" width="34" height="34" alt="" style="flex:none">
    <div><div class="bezeichnung">${sys.name} <span class="stufe">${sd.name}</span></div>
      <div class="erlaeuterung">${sd.beschreibung}</div></div></div>`;
  if(sys.piraten){
    const art = PIRATEN_ARTEN[sys.piraten.art];
    const feindStaerke = piratenStaerke(sys);
    const kampftypen = ["jaeger","korvette","kreuzer"];

    // Eigene Kampfkraft und wie gut sie zur gegnerischen Mischung passt
    let eigen = 0, eigenAnzahl = 0;
    for(const t of kampftypen){
      const n = flotteFrei(t); if(!n) continue;
      eigenAnzahl += n;
      let schnitt = 0, ziele = 0;
      for(const ft in sys.piraten.flotte){
        schnitt += (KONTER[t]?.[ft] || 1) * sys.piraten.flotte[ft];
        ziele += sys.piraten.flotte[ft];
      }
      const passung = ziele ? schnitt/ziele : 1;
      eigen += n * ((SCHIFFE[t].angriff||0)*passung + (SCHIFFE[t].panzerung||0)*0.5);
    }

    const feindListe = Object.keys(sys.piraten.flotte)
      .map(t => `${sys.piraten.flotte[t]} ${SCHIFFE[t].name}`).join(" · ");
    const eigenListe = kampftypen.filter(t=>flotteFrei(t)>0)
      .map(t => `${flotteFrei(t)} ${SCHIFFE[t].name}`).join(" · ") || "keine Kampfschiffe";

    const verhaeltnis = eigen / Math.max(1, feindStaerke);
    const lage = verhaeltnis >= 1.4 ? "gut" : verhaeltnis >= 0.9 ? "" : "rot";
    const urteil = eigenAnzahl === 0 ? "Bauen Sie zuerst Kampfschiffe."
      : verhaeltnis < 0.7 ? "Aussichtslos — die Flotte würde aufgerieben."
      : verhaeltnis < 0.9 ? "Unterlegen. Ein Sieg ist unwahrscheinlich."
      : verhaeltnis < 1.4 ? "Ausgeglichen. Der Ausgang ist offen."
      : "Überlegen. Der Sieg sollte gelingen.";

    // Welcher eigene Typ trifft diesen Gegner am besten?
    let bester = null, besterWert = 0;
    for(const t of kampftypen){
      let schnitt = 0, ziele = 0;
      for(const ft in sys.piraten.flotte){
        schnitt += (KONTER[t]?.[ft] || 1) * sys.piraten.flotte[ft];
        ziele += sys.piraten.flotte[ft];
      }
      const w = ziele ? schnitt/ziele : 1;
      if(w > besterWert){ besterWert = w; bester = t; }
    }

    kopf = `<div style="padding:13px 14px 4px">
      <div class="meldung rot" style="margin-top:0">
        <strong>${art.name} in ${sys.name}</strong> · ${piratenAnzahl(sys)} Schiffe
        · Stärke <span class="zahl">${z0(feindStaerke)}</span><br>
        <span style="color:var(--matt)">${art.beschreibung}</span><br>
        <span style="color:var(--matt)">Verband: ${feindListe}</span></div>
      <div class="meldung ${lage}">
        Ihre Flotte: ${eigenListe} · gewichtete Stärke <span class="zahl">${z0(eigen)}</span><br>
        ${urteil}${bester && besterWert > 1.15
          ? ` <span style="color:var(--signal)">${SCHIFFE[bester].name} sind gegen diesen Verband besonders wirksam (×${besterWert.toFixed(2)}).</span>` : ""}
      </div>
      <button data-angriff="${sys.id}" ${eigenAnzahl<=0?"disabled":""} style="margin-top:9px">
        ${eigenAnzahl<=0?"Keine Flotte":"Gesamte Flotte entsenden"}</button></div>`;
  }
  const stern = STERNE[sys.stern] || STERNE.gelber_stern;
  const sr = 7 * stern.groesse;          // Darstellungsradius nach Sterntyp
  let inhalt = `
    <image href="${stern.bild}" x="${50-sr}" y="${50-sr}" width="${sr*2}" height="${sr*2}"
      preserveAspectRatio="xMidYMid meet"/>`;

  const n = sys.objekte.length;
  sys.objekte.forEach((objId, i) => {
    const o = spiel.objekte[objId], def = OBJEKTE[o.typ];
    const bahn = 15 + sr*0.9 + i*(n > 4 ? 8.4 : 10.2);
    // Winkel so verteilen, dass sich benachbarte Objekte nicht überlagern
    const winkel = 0.55 + i*2.399;
    const x = 50 + Math.cos(winkel)*bahn, y = 50 + Math.sin(winkel)*bahn*0.55;
    const kolonie = !!spiel.kolonien[objId];
    const gr = def.art === "planet" ? 4.0 : 3.2;     // Radius der Darstellung
    const bild = BILDER[o.typ];

    // Beschriftung nach unten, ausser das Objekt liegt am unteren Rand
    const untenFrei = y < 66;
    const ty = untenFrei ? y + gr + 3.6 : y - gr - 4.4;

    inhalt += `<ellipse cx="50" cy="50" rx="${bahn}" ry="${bahn*0.55}" fill="none"
                stroke="var(--kante)" stroke-width="0.2" opacity=".55"/>
      <g class="punkt" data-objekt="${objId}">
        ${spiel.auswahl===objId?`<circle cx="${x}" cy="${y}" r="${gr+2.4}" fill="none"
            stroke="var(--bernstein)" stroke-width="0.45"/>`:""}
        ${kolonie?`<circle cx="${x}" cy="${y}" r="${gr+1.3}" fill="none"
            stroke="var(--signal)" stroke-width="0.5"/>`:""}
        ${o.fraktion?`<circle cx="${x}" cy="${y}" r="${gr+1.3}" fill="none"
            stroke="${PARTEIEN[o.fraktion].farbe}" stroke-width="0.5"
            stroke-dasharray="1.6 1.2"/>`:""}`;

    if(bild){
      // Eigenes Bild als Scheibe einsetzen
      inhalt += `<image href="${bild}" x="${x-gr}" y="${y-gr}"
          width="${gr*2}" height="${gr*2}" preserveAspectRatio="xMidYMid meet"/>`;
    }else{
      // Ohne Bild: farbiger Punkt wie bisher
      inhalt += `<circle cx="${x}" cy="${y}" r="${gr*0.8}" fill="${def.farbe}"
          ${def.art==="habitat"?'stroke="var(--text)" stroke-width="0.28" stroke-dasharray="1 0.9"':""}/>`;
    }

    // Schrift mit dunklem Rand, damit sie über allem lesbar bleibt
    const zeile2 = untenFrei ? ty + 3.4 : ty - 3.4;
    inhalt += `<text x="${x}" y="${untenFrei ? ty : zeile2}" text-anchor="middle" font-size="2.9"
        font-weight="600" fill="var(--text)" stroke="#060b13" stroke-width="0.9"
        paint-order="stroke" stroke-linejoin="round">${o.name}</text>
      <text x="${x}" y="${untenFrei ? zeile2 : ty}" text-anchor="middle" font-size="2.4"
        fill="${o.fraktion ? PARTEIEN[o.fraktion].farbe : "var(--matt)"}"
        stroke="#060b13" stroke-width="0.8"
        paint-order="stroke" stroke-linejoin="round">${o.fraktion
          ? PARTEIEN[o.fraktion].kurz : def.name}</text>
      </g>`;
  });

  return kopf + `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inhalt}</svg>`;
}

/* ------------------------------------------------------------
   Seite: Kolonien
   ------------------------------------------------------------ */
function seiteKolonie(g){
  const ids = Object.keys(spiel.kolonien);
  if(!ids.length) return `<div class="flaeche">Noch keine Kolonie. Besiedeln Sie ein Objekt über die Karte.</div>`;
  if(!spiel.kolonien[spiel.auswahl]) spiel.auswahl = +ids[0];

  let h = `<div class="unterreiter" style="margin-top:0">`;
  for(const id of ids){
    const k = spiel.kolonien[id];
    h += `<button data-kolonie="${id}" class="${+spiel.auswahl===+id?"an":""}">
      ${spiel.objekte[id].name}${k.bau?" ·":""}</button>`;
  }
  h += `</div>` + objektTafel(+spiel.auswahl, g, true);
  return h;
}

function objektTafel(objId, g, mitReitern){
  const obj = spiel.objekte[objId], def = OBJEKTE[obj.typ];
  const kolonie = spiel.kolonien[objId];
  const sys = spiel.systeme[obj.systemId];

  // ----- Fremde Welt: Handelsmenü statt Besiedlung -----
  if(!kolonie && obj.fraktion){
    handelPruefen();
    const d = PARTEIEN[obj.fraktion];
    const dip = diploStand(obj.fraktion);
    const hd = spiel.handel[obj.id];
    const rest = hd ? (hd.bisAb - Date.now())/1000 : 0;
    const gesperrt = dip.wert <= -60;

    let felder = "";
    for(const dd in obj.felder)
      felder += `<div class="mess"><div class="k">${DISTRIKTE[dd].name}</div>
                 <div class="v">${obj.felder[dd]}</div></div>`;

    let h2 = `<div class="flaeche" style="border-left:2px solid ${d.farbe}">
      <div class="weltkopf">
        ${scheibe(obj.typ, 88)}
        <div class="weltdaten">
          <div class="gattung" style="color:${d.farbe}">${d.name}</div>
          <div class="name">${obj.name}</div>
          <div class="lage">${def.name} · System ${sys.name}
            · ${(STERNE[sys.stern]||STERNE.gelber_stern).name}</div>
          <div class="lage">Diese Welt ist bewohnt und lässt sich nicht besiedeln.</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;
           gap:10px;margin-top:12px;flex-wrap:wrap">
        <span>Beziehung: <strong style="color:${dip.stufe.farbe}">${dip.stufe.name}</strong></span>
        <span class="zahl" style="color:${dip.stufe.farbe}">${dip.wert > 0 ? "+" : ""}${dip.wert}</span>
      </div>
      <div class="schiene" style="margin-top:6px">
        <i style="width:${(dip.wert - BEZIEHUNG_MIN) / (BEZIEHUNG_MAX - BEZIEHUNG_MIN) * 100}%;
           background:${dip.stufe.farbe}"></i></div>
      <div class="erlaeuterung" style="margin-top:8px">${d.beschreibung}</div>
      ${d.risiko?`<div class="meldung">Etwa ${Math.round(d.risiko*100)} % der Lieferungen
        dieser Partei kommen nicht an. Die Bezahlung ist dann trotzdem weg.</div>`:""}
      <div class="messwerte" style="margin-top:12px">${felder}</div>
    </div>`;

    h2 += `<div class="rubrik"><h2>Handelsangebote</h2>
      <span class="zusatz">${gesperrt ? "gesperrt" : "wechselt in " + zeitText(rest*TEMPO)}</span></div>`;

    if(gesperrt){
      h2 += `<div class="meldung rot">${d.kurz} verweigert jeden Handel.
        Die Beziehung muss sich erst bessern.</div>`;
    }else{
      let offen = 0;
      (hd?.angebote || []).forEach((a, i) => {
        if(a.weg) return;
        offen++;
        const machbar = (spiel.res[a.will] || 0) >= a.preis;
        const gibtName = a.gibt === "forschung" ? "Forschung" : RES_NAMEN[a.gibt];
        h2 += `<div class="posten-zeile">
          <div class="rumpf">
            <div class="bezeichnung" style="color:${d.farbe}">${z0(a.menge)} ${gibtName}</div>
            <div class="erlaeuterung">im Tausch gegen
              <span class="zahl" style="color:${machbar?"var(--text)":"var(--bernstein)"}">
                ${z0(a.preis)} ${RES_NAMEN[a.will]}</span>
              · vorrätig ${z0(spiel.res[a.will]||0)}</div></div>
          <button data-handel="${obj.id}" data-nr="${i}" ${machbar?"":"disabled"}>
            ${machbar?"Tauschen":"Zu wenig"}</button></div>`;
      });
      if(!offen)
        h2 += `<div class="flaeche"><div class="erlaeuterung">Ausverkauft.
          Neue Ware in ${zeitText(rest*TEMPO)}.</div></div>`;
    }
    return h2;
  }

  // ----- Nicht besiedelt -----
  if(!kolonie){
    const kosten = kolonieKosten(objId);
    const z = zaehleKolonien();
    const grenze = def.art === "planet" ? z.planeten >= maxPlaneten() : z.habitate >= maxHabitate();
    let felder = "";
    for(const d in obj.felder)
      felder += `<div class="mess"><div class="k">${DISTRIKTE[d].name}</div>
                 <div class="v">${obj.felder[d]}</div></div>`;
    return `<div class="flaeche">
      <div class="weltkopf">
        ${scheibe(obj.typ, 88)}
        <div class="weltdaten">
          <div class="gattung">${def.name}${def.art==="habitat"?" · Habitat":""}</div>
          <div class="name">${obj.name}</div>
          <div class="lage">System ${sys.name} · ${(STERNE[sys.stern]||STERNE.gelber_stern).name}
            · ${def.beschreibung}</div>
        </div>
      </div>
      <div class="messwerte">${felder}</div>
      <div class="werte" style="margin-top:13px">${kostenZeile(kosten, null)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:11px">
        <button data-kolonisieren="${objId}" ${kannKolonisieren(objId)?"":"disabled"}>
          ${grenze?(def.art==="planet"?"Planetengrenze erreicht":"Habitatgrenze erreicht")
            :sys.piraten?"Piraten im System"
            :flotteFrei("siedlerschiff")<1?"Kein Siedlerschiff":"Besiedeln"}</button>
        <button class="still" data-sammeln="${objId}" ${flotteFrei("frachter")<1?"disabled":""}>
          ${flotteFrei("frachter")<1?"Keine Frachter":`Sammeln mit ${flotteFrei("frachter")} Frachtern`}</button>
      </div>
      ${grenze?`<div class="meldung">Die Grenze lässt sich unter Forschung anheben.</div>`:""}
      <div class="erlaeuterung" style="margin-top:9px">Frachter holen hier ${FRACHTER_KAPAZITAET} Einheiten
        je Schiff — auch ohne Kolonie.</div>
    </div>`;
  }

  // ----- Besiedelt -----
  const k = kolonie, z = g.je[objId];
  const bisPop = z.wachstumProStunde > 0
    ? zeitText((z.wachstumsziel - k.wachstum)/z.wachstumProStunde*3600/TEMPO) : "—";

  let meldungen = "";
  if(g.hunger) meldungen += `<div class="meldung rot">Hungersnot im Reich — die Bevölkerung schrumpft. Mehr Nahrung erzeugen.</div>`;
  if(z.wohnraum === 0) meldungen += `<div class="meldung">Kein Wohnraum. ${def.art==="habitat"?"Habitatmodul":"Wohnkomplex"} bauen, sonst bleibt die Kolonie unbewohnt.</div>`;
  else if(z.bev >= z.wohnraum) meldungen += `<div class="meldung">Wohnraum erschöpft — hier wächst niemand mehr nach.</div>`;
  if(z.frei > 0) meldungen += `<div class="meldung">${z.frei} Bewohner ohne Aufgabe. Jede Zuweisung bringt 10 % mehr Ertrag.</div>`;

  let h = `<div class="flaeche" style="margin-top:12px">
    <div class="weltkopf">
      ${scheibe(obj.typ, 88)}
      <div class="weltdaten">
        <div class="gattung">${def.name}${def.art==="habitat"?" · Habitat":""}</div>
        <div class="name">${obj.name}</div>
        <div class="lage">System ${sys.name} · ${(STERNE[sys.stern]||STERNE.gelber_stern).name}
          · ${def.beschreibung}</div>
      </div>
    </div>
    <div class="messwerte">
      <div class="mess"><div class="k">Bewohner</div>
        <div class="v ${z.wohnraum&&z.bev>=z.wohnraum?"warn":""}">${z.bev} / ${z.wohnraum}</div></div>
      <div class="mess"><div class="k">Zugewiesen</div><div class="v">${z.zugewiesen}</div></div>
      <div class="mess"><div class="k">Zuwachs in</div><div class="v">${bisPop}</div></div>
      <div class="mess"><div class="k">Lagerbeitrag</div><div class="v">${z0(z.lager)}</div></div>
    </div>
    ${meldungen}</div>`;

  if(k.bau){
    const name = k.bau.art === "distrikt" ? DISTRIKTE[k.bau.schluessel].name
               : GEBAEUDE[k.bau.schluessel].name + " → Stufe " + (k.gebaeude[k.bau.schluessel]+1);
    const rest = (k.bau.fertigAb-Date.now())/1000;
    h += `<div class="vorgang" style="margin-top:10px">
      <div class="zeile1"><strong>Im Bau · ${name}</strong>
        <span class="rest">${zeitText(rest*TEMPO)}</span></div>
      ${fortschrittBalken(rest, k.bau.dauer)}</div>`;
  }

  // Unterreiter der Kolonie
  const t = spiel.kolonieTab;
  h += `<div class="unterreiter">
    <button data-koltab="uebersicht" class="${t==="uebersicht"?"an":""}">Übersicht</button>
    <button data-koltab="distrikte" class="${t==="distrikte"?"an":""}">Distrikte</button>
    <button data-koltab="gebaeude" class="${t==="gebaeude"?"an":""}">Gebäude</button>
  </div>`;

  if(t === "uebersicht"){
    h += `<div class="rubrik"><h2>Was diese Kolonie beisteuert</h2>
      <span class="zusatz">je Stunde</span></div>`;
    if(!z.beitrag.length)
      h += `<div class="flaeche"><div class="erlaeuterung">Noch nichts gebaut.
        Fangen Sie unter Distrikte an.</div></div>`;
    for(const p of z.beitrag){
      h += `<div class="posten-zeile">
        <div class="rumpf">
          <div class="bezeichnung">${p.name} <span class="stufe">×${p.anzahl}</span></div>
          <div class="erlaeuterung">${ertragText(p.ertrag)}${p.zug?` · Bonus +${Math.round(p.zug*BONUS_PRO_KOPF*100)} % durch ${p.zug} Bewohner`:""}</div>
        </div></div>`;
    }
    h += `<div class="rubrik"><h2>Verbrauch</h2></div>
      <div class="posten-zeile"><div class="rumpf">
        <div class="bezeichnung">Versorgung der Bewohner</div>
        <div class="erlaeuterung">−${z0(z.bev*NAHRUNG_PRO_KOPF)} Nahrung je Stunde
          (${z.bev} Bewohner × ${NAHRUNG_PRO_KOPF})</div></div></div>`;
  }

  if(t === "distrikte"){
    h += `<div class="rubrik"><h2>Distrikte</h2>
      <span class="zusatz">Keine Stufen — mehr bauen statt ausbauen</span></div>`;
    for(const d in obj.felder){
      const dd = DISTRIKTE[d], n = k.distrikte[d], max = obj.felder[d];
      const kosten = distriktKosten(d);
      const zug = k.zuweisung["d:"+d] || 0;
      const faktor = 1 + zug*BONUS_PRO_KOPF;
      const ertrag = {};
      for(const r in dd.produziert) ertrag[r] = dd.produziert[r]*n*faktor;
      let balken = "";
      for(let i=0;i<Math.min(max,20);i++) balken += `<i class="${i<n?"belegt":""}"></i>`;
      h += `<div class="posten-zeile ${n>=max?"erschoepft":""}">
        <div class="rumpf">
          <div class="bezeichnung">${dd.name} <span class="stufe">${n} / ${max}</span></div>
          <div class="erlaeuterung">${n ? ertragText(ertrag)+" / h" : dd.beschreibung||"noch nichts gebaut"}
            ${zug?` · +${Math.round(zug*BONUS_PRO_KOPF*100)} %`:""}</div>
          <div class="felder">${balken}</div>
          <div class="werte">${kostenZeile(kosten, bauzeit(kosten))}</div></div>
        ${n>0?`<div class="regler">
          <button data-zu="d:${d}" data-id="${objId}" data-delta="-1" ${zug<=0?"disabled":""}>−</button>
          <b>${zug}</b>
          <button data-zu="d:${d}" data-id="${objId}" data-delta="1" ${zug>=MAX_ZUWEISUNG||z.frei<=0?"disabled":""}>+</button>
          <span>/${MAX_ZUWEISUNG}</span></div>`:""}
        <button data-bd="${d}" data-id="${objId}" ${(k.bau||n>=max||!bezahlbar(kosten))?"disabled":""}>
          ${n>=max?"Felder belegt":k.bau?"Bauplatz belegt":"Bauen"}</button>
      </div>`;
    }
  }

  if(t === "gebaeude"){
    const erlaubt = erlaubteGebaeude(objId);
    h += `<div class="rubrik"><h2>Gebäude</h2>
      <span class="zusatz">${def.art==="habitat"
        ? "Habitate bauen vorerst nur Lager und Wohnmodul"
        : "Pro Stufe 30 % teurer, 20 % mehr Ertrag"}</span></div>`;
    for(const sKey of erlaubt){
      const gb = GEBAEUDE[sKey], lvl = k.gebaeude[sKey];
      const ziel = lvl + 1, maximal = lvl >= gb.maxLevel;
      const kosten = gebaeudeKosten(sKey, ziel);
      const zug = k.zuweisung["g:"+sKey] || 0;
      const faktor = 1 + zug*BONUS_PRO_KOPF;
      let wirkung = [];
      if(gb.produziert)
        for(const r in gb.produziert) wirkung.push(`+${z0(gebaeudeErtrag(gb.produziert[r],lvl)*faktor)} ${RES_NAMEN[r]} / h`);
      if(gb.wohnraum) wirkung.push(`${z0(gebaeudeErtrag(gb.wohnraum,lvl))} Wohnraum`);
      if(gb.lager)    wirkung.push(`${z0(gebaeudeErtrag(gb.lager,lvl))} Lager`);
      h += `<div class="posten-zeile ${maximal?"erschoepft":""}">
        <div class="rumpf">
          <div class="bezeichnung">${gb.name} <span class="stufe">Stufe ${lvl} / ${gb.maxLevel}</span></div>
          <div class="erlaeuterung">${lvl?wirkung.join(" · "):gb.beschreibung}
            ${zug?` · +${Math.round(zug*BONUS_PRO_KOPF*100)} %`:""}</div>
          ${maximal?"":`<div class="werte">${kostenZeile(kosten, bauzeit(kosten))}</div>`}</div>
        ${(lvl>0&&gb.produziert)?`<div class="regler">
          <button data-zu="g:${sKey}" data-id="${objId}" data-delta="-1" ${zug<=0?"disabled":""}>−</button>
          <b>${zug}</b>
          <button data-zu="g:${sKey}" data-id="${objId}" data-delta="1" ${zug>=MAX_ZUWEISUNG||z.frei<=0?"disabled":""}>+</button>
          <span>/${MAX_ZUWEISUNG}</span></div>`:""}
        <button data-gb="${sKey}" data-id="${objId}" ${(k.bau||maximal||!bezahlbar(kosten))?"disabled":""}>
          ${maximal?"Höchststufe":k.bau?"Bauplatz belegt":lvl?"Ausbauen":"Bauen"}</button>
      </div>`;
    }
  }
  return h;
}

/* ------------------------------------------------------------
   Seite: Werft — hier entstehen Schiffe
   ------------------------------------------------------------ */
function seiteWerft(g){
  const w = werftStufe();
  let h = "";

  if(w < 1){
    h += `<div class="meldung">Noch keine Werft gebaut. Eine Werft entsteht als Gebäude auf
      einem Planeten — Habitate können keine bauen. Jede Stufe verkürzt die Bauzeit um 25 %.</div>`;
  }else{
    // Wo steht die beste Werft?
    let ort = null;
    for(const id in spiel.kolonien)
      if((spiel.kolonien[id].gebaeude.werft||0) === w) { ort = spiel.objekte[id].name; break; }
    h += `<div class="flaeche"><div class="messwerte" style="margin:0">
      <div class="mess"><div class="k">Werftstufe</div><div class="v">${w} / ${GEBAEUDE.werft.maxLevel}</div></div>
      <div class="mess"><div class="k">Standort</div><div class="v" style="font-size:14px">${ort||"—"}</div></div>
      <div class="mess"><div class="k">Bauzeit</div>
        <div class="v">−${Math.round((1-1/(1+0.25*(w-1)))*100)} %</div></div>
      <div class="mess"><div class="k">Schiffe gesamt</div>
        <div class="v">${Object.keys(SCHIFFE).reduce((a,t)=>a+flotteFrei(t),0)}</div></div>
    </div></div>`;
  }

  if(spiel.werftauftrag){
    const rest = (spiel.werftauftrag.fertigAb-Date.now())/1000;
    const bt = spiel.werftauftrag.typ;
    h += `<div class="vorgang" style="margin-top:10px">
      <div class="zeile1">
        <span style="display:flex;gap:10px;align-items:center">
          ${SCHIFF_BILDER[bt] ? `<img class="schiffbild klein" src="${SCHIFF_BILDER[bt]}" alt="">` : ""}
          <strong>Im Bau · ${SCHIFFE[bt].name}</strong></span>
        <span class="rest">${zeitText(rest*TEMPO)}</span></div>
      ${fortschrittBalken(rest, spiel.werftauftrag.dauer)}</div>`;
  }

  let rolle = "";
  for(const t in SCHIFFE){
    const d = SCHIFFE[t];
    if(d.rolle !== rolle){
      rolle = d.rolle;
      h += `<div class="rubrik"><h2>${rolle}</h2></div>`;
    }
    let werte = [];
    if(d.angriff)    werte.push(`Angriff ${d.angriff}`);
    if(d.panzerung)  werte.push(`Panzerung ${d.panzerung}`);
    if(d.kapazitaet) werte.push(`Ladung ${d.kapazitaet}`);
    h += `<div class="posten-zeile">
      ${SCHIFF_BILDER[t] ? `<img class="schiffbild" src="${SCHIFF_BILDER[t]}" alt="${d.name}"
        loading="lazy">` : ""}
      <div class="rumpf">
        <div class="bezeichnung">${d.name} <span class="stufe">${flotteFrei(t)} bereit</span></div>
        <div class="erlaeuterung">${d.beschreibung}${werte.length?" — "+werte.join(", "):""}</div>
        <div class="werte">${kostenZeile(d.kosten, schiffBauzeit(t))}</div></div>
      <button data-schiff="${t}" ${(spiel.werftauftrag||w<1||!bezahlbar(d.kosten))?"disabled":""}>
        ${w<1?"Keine Werft":spiel.werftauftrag?"Werft belegt":"Bauen"}</button></div>`;
  }

  // Kontertabelle als Nachschlagewerk
  const kt = ["jaeger","korvette","kreuzer"];
  h += `<div class="rubrik"><h2>Wirksamkeit</h2>
    <span class="zusatz">Zeile greift Spalte an</span></div>
    <div class="flaeche" style="overflow-x:auto">
    <table style="border-collapse:collapse;font-size:12.5px;min-width:340px">
      <tr><td></td>${kt.map(t=>`<td style="padding:4px 9px;color:var(--matt);
        font-size:11px;text-transform:uppercase;letter-spacing:.1em">${SCHIFFE[t].name}</td>`).join("")}</tr>
      ${kt.map(a=>`<tr>
        <td style="padding:4px 9px;color:var(--matt);font-size:11px;text-transform:uppercase;
            letter-spacing:.1em">${SCHIFFE[a].name}</td>
        ${kt.map(v=>{
          const wv = KONTER[a][v];
          const farbe = wv > 1.2 ? "var(--signal)" : wv < 0.8 ? "var(--alarm)" : "var(--matt)";
          return `<td class="zahl" style="padding:4px 9px;color:${farbe}">×${wv.toFixed(1)}</td>`;
        }).join("")}</tr>`).join("")}
    </table>
    <div class="erlaeuterung" style="margin-top:8px">Jäger sind zu wendig für schwere Geschütze und
      reissen Kreuzer auf. Korvetten fangen Jäger ab. Kreuzer zermalmen Korvetten.
      Es zählt also die Mischung, nicht die Menge.</div></div>`;
  return h;
}

/* ------------------------------------------------------------
   Seite: Flotte — Unterwegs, Berichte, Bestand
   ------------------------------------------------------------ */
function seiteFlotte(g){
  if(!spiel.flotteTab) spiel.flotteTab = "unterwegs";
  const t = spiel.flotteTab;
  const offen = spiel.missionen.length;
  const neue = (spiel.berichte||[]).filter(b=>!b.gelesen).length;

  let h = `<div class="unterreiter" style="margin-top:0">
    <button data-flottetab="unterwegs" class="${t==="unterwegs"?"an":""}">Unterwegs${offen?" · "+offen:""}</button>
    <button data-flottetab="berichte" class="${t==="berichte"?"an":""}">Berichte${neue?" · "+neue:""}</button>
    <button data-flottetab="bestand" class="${t==="bestand"?"an":""}">Bestand</button>
  </div>`;

  if(t === "unterwegs"){
    if(!offen){
      h += `<div class="flaeche" style="margin-top:12px"><div class="erlaeuterung">
        Alle Schiffe im Heimatorbit. Missionen starten Sie über die Karte: Sonden bei unerkundeten
        Systemen, Frachter und Siedlerschiffe bei einzelnen Objekten, die Kampfflotte bei
        Piratensystemen.</div></div>`;
    }
    for(const m of spiel.missionen){
      const sym = FLUG_SYMBOL[m.art] || FLUG_SYMBOL.erkunden;
      const rest = (m.endeAb-Date.now())/1000;
      const ziel = (m.art === "sammeln" || m.art === "besiedeln")
        ? spiel.objekte[m.ziel].name : spiel.systeme[m.nachSys].name;
      const flotte = Object.keys(m.schiffe).filter(x=>m.schiffe[x])
        .map(x=>`${m.schiffe[x]} ${SCHIFFE[x].name}`).join(", ") || "—";
      const bez = { erkunden:"Erkundung", besiedeln:"Besiedlung",
                    sammeln:"Sammelflug", angriff:"Angriff" }[m.art];
      h += `<div class="vorgang" style="margin-top:10px">
        <div class="zeile1">
          <span style="display:flex;gap:9px;align-items:center">
            <svg width="24" height="24" viewBox="-6 -6 12 12" style="flex:none">${sym.form(0,0,0)}</svg>
            <strong>${bez} · ${ziel}</strong></span>
          <span class="rest">${m.phase==="rueck"?"Rückflug ":""}${zeitText(rest*TEMPO)}</span></div>
        <div class="erlaeuterung">${flotte}${m.bericht?" · "+m.bericht:""}</div>
        ${fortschrittBalken(rest, m.dauer)}</div>`;
    }
  }

  if(t === "berichte"){
    const b = spiel.berichte || [];
    if(!b.length)
      h += `<div class="flaeche" style="margin-top:12px"><div class="erlaeuterung">
        Noch keine Meldungen. Hier erscheinen Kampfberichte, Erkundungsergebnisse und
        Frachtlieferungen, sobald Flotten zurückkehren.</div></div>`;
    for(let i = 0; i < b.length; i++){
      const r = b[i];
      const sym = FLUG_SYMBOL[r.art] || FLUG_SYMBOL.erkunden;
      const ton = r.text?.startsWith("Niederlage") ? "rot"
                : r.text?.startsWith("Unentschieden") ? "" : "gut";
      const wann = new Date(r.zeit).toLocaleString("de-DE",
        { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });

      // Verluste aus ausgesandter und heimgekehrter Flotte errechnen
      const verluste = [];
      for(const st in (r.ausgesandt||{})){
        const weg = (r.ausgesandt[st]||0) - (r.heimgekehrt?.[st]||0);
        if(weg > 0) verluste.push(`${weg} ${SCHIFFE[st].name}`);
      }
      const ladung = r.ladung ? Object.keys(r.ladung).filter(x=>r.ladung[x]>0)
        .map(x=>`${z0(r.ladung[x])} ${RES_NAMEN[x]}`).join(" · ") : "";

      h += `<div class="flaeche" style="margin-top:10px;border-left:2px solid ${sym.farbe}">
        <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <svg width="26" height="26" viewBox="-6 -6 12 12" style="flex:none">${sym.form(0,0,0)}</svg>
          <div style="flex:1 1 200px">
            <div class="bezeichnung">${r.text || "Meldung"}</div>
            <div class="erlaeuterung">${sym.name} · ${r.ziel || "?"} · ${wann}</div>
          </div>
          <button class="still" data-bericht="${i}" style="font-size:12px;padding:5px 11px">
            ${r.offen ? "Zuklappen" : "Einzelheiten"}</button>
        </div>
        ${ladung ? `<div class="meldung ${ton}" style="margin-top:8px">Beute: ${ladung}</div>` : ""}
        ${verluste.length ? `<div class="erlaeuterung" style="margin-top:6px">
          Verluste: ${verluste.join(", ")}</div>` : ""}`;

      // Aufgeklappt: Gefechtsverlauf Runde für Runde
      if(r.offen && r.runden && r.runden.length){
        h += `<div style="margin-top:9px;border-top:1px solid var(--kante);padding-top:7px">`;
        for(const rd of r.runden){
          const meine = Object.keys(rd.eigenVerlust).length
            ? Object.keys(rd.eigenVerlust).map(x=>`${rd.eigenVerlust[x]} ${SCHIFFE[x].name}`).join(", ")
            : "keine";
          const seine = Object.keys(rd.feindVerlust).length
            ? Object.keys(rd.feindVerlust).map(x=>`${rd.feindVerlust[x]} ${SCHIFFE[x].name}`).join(", ")
            : "keine";
          h += `<div class="erlaeuterung" style="display:flex;gap:10px;flex-wrap:wrap;
              padding:3px 0;border-bottom:1px solid var(--kante)">
            <span class="zahl" style="color:var(--matt);min-width:54px">Runde ${rd.nummer}</span>
            <span style="flex:1 1 130px">Eigene: ${meine}</span>
            <span style="flex:1 1 130px;color:var(--signal)">Gegner: ${seine}</span>
            <span class="zahl" style="color:var(--schwach)">${rd.eigenRest} : ${rd.feindRest}</span>
          </div>`;
        }
        h += `</div>`;
      }else if(r.offen){
        h += `<div class="erlaeuterung" style="margin-top:8px">Kein Gefecht — es gibt keinen
          Rundenverlauf zu diesem Einsatz.</div>`;
      }
      h += `</div>`;
    }
  }

  if(t === "bestand"){
    h += `<div class="rubrik"><h2>Verfügbare Schiffe</h2>
      <span class="zusatz">Im Heimatorbit, einsatzbereit</span></div>`;
    let unterwegs = {};
    for(const m of spiel.missionen)
      for(const st in m.schiffe) unterwegs[st] = (unterwegs[st]||0) + m.schiffe[st];

    for(const st in SCHIFFE){
      const d = SCHIFFE[st], frei = flotteFrei(st), weg = unterwegs[st] || 0;
      if(!frei && !weg) continue;
      let werte = [];
      if(d.angriff)    werte.push(`Angriff ${d.angriff}`);
      if(d.panzerung)  werte.push(`Panzerung ${d.panzerung}`);
      if(d.kapazitaet) werte.push(`Ladung ${d.kapazitaet}`);
      h += `<div class="posten-zeile">
        ${SCHIFF_BILDER[st] ? `<img class="schiffbild" src="${SCHIFF_BILDER[st]}" alt="${d.name}"
          loading="lazy">` : ""}
        <div class="rumpf">
          <div class="bezeichnung">${d.name}
            <span class="stufe">${frei} bereit${weg?` · ${weg} unterwegs`:""}</span></div>
          <div class="erlaeuterung">${d.rolle}${werte.length?" — "+werte.join(", "):""}</div></div></div>`;
    }
    if(!Object.keys(SCHIFFE).some(st=>flotteFrei(st)||unterwegs[st]))
      h += `<div class="flaeche"><div class="erlaeuterung">Keine Schiffe vorhanden.
        Bauen Sie welche in der Werft.</div></div>`;
  }
  return h;
}

/* ------------------------------------------------------------
   Seite: Diplomatie — Verhältnis zu den Parteien
   ------------------------------------------------------------ */
function seiteDiplomatie(g){
  handelPruefen();
  let h = `<div class="flaeche"><div class="erlaeuterung">
    Fremde Welten lassen sich nicht besiedeln. Was Sie mit ihren Bewohnern tun, entscheidet
    die Beziehung: Sie beginnt bei 0 und reicht von −100 bis +100. Handel hebt sie, bessere
    Beziehungen bringen bessere Kurse. Ab −60 verweigert eine Partei jeden Handel.</div></div>`;

  for(const pid in PARTEIEN){
    const d = PARTEIEN[pid];
    const dip = diploStand(pid);
    const welten = fremdeWelten(false).filter(o=>o.fraktion===pid);
    const bekannt = welten.filter(o=>spiel.systeme[o.systemId].erkundet);
    // Position auf dem Band von −100 bis +100
    const pos = (dip.wert - BEZIEHUNG_MIN) / (BEZIEHUNG_MAX - BEZIEHUNG_MIN) * 100;

    h += `<div class="rubrik" style="border-left:2px solid ${d.farbe};padding-left:9px">
        <h2 style="color:var(--text)">${d.name}</h2>
        <span class="zusatz">${bekannt.length} von ${welten.length} Welten bekannt</span></div>
      <div class="flaeche">
        <div class="erlaeuterung">${d.beschreibung}</div>

        <div style="display:flex;justify-content:space-between;align-items:baseline;
             margin-top:12px;gap:10px;flex-wrap:wrap">
          <span>Verhältnis: <strong style="color:${dip.stufe.farbe}">${dip.stufe.name}</strong></span>
          <span class="zahl" style="font-size:17px;color:${dip.stufe.farbe}">
            ${dip.wert > 0 ? "+" : ""}${dip.wert}</span>
        </div>

        <!-- Band von −100 bis +100 mit Nullmarke -->
        <div style="position:relative;height:8px;background:var(--raum);border-radius:4px;
             margin-top:7px;overflow:hidden">
          <div style="position:absolute;left:0;top:0;bottom:0;width:${pos}%;
               background:${dip.stufe.farbe};opacity:.75"></div>
          <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;
               background:var(--kante-hell)"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:3px">
          <span class="erlaeuterung">−100</span>
          <span class="erlaeuterung">0</span>
          <span class="erlaeuterung">+100</span>
        </div>

        <div class="messwerte" style="margin-top:12px">
          <div class="mess"><div class="k">Handelskurs</div>
            <div class="v">${Math.round(dip.stufe.bonus*100)} %</div></div>
          <div class="mess"><div class="k">Nächste Stufe</div>
            <div class="v" style="font-size:14px">${dip.naechst
              ? dip.naechst.name+" ab "+dip.naechst.ab : "höchste erreicht"}</div></div>
          <div class="mess"><div class="k">Handel</div>
            <div class="v" style="font-size:14px;color:${dip.wert<=-60?"var(--alarm)":"var(--signal)"}">
              ${dip.wert<=-60?"verweigert":"möglich"}</div></div>
        </div>
      </div>`;

    // Bekannte Welten dieser Partei
    if(bekannt.length){
      for(const o of bekannt){
        const hd = spiel.handel[o.id];
        const offen = (hd?.angebote || []).filter(a=>!a.weg).length;
        h += `<div class="posten-zeile">
          <div class="rumpf">
            <div class="bezeichnung">${o.name}
              <span class="stufe">${OBJEKTE[o.typ].name}</span></div>
            <div class="erlaeuterung">System ${spiel.systeme[o.systemId].name}
              · ${offen} Angebote offen</div></div>
          <button class="still" data-objekt="${o.id}">Ansehen</button></div>`;
      }
    }else{
      h += `<div class="flaeche"><div class="erlaeuterung">
        Noch keine Welt dieser Partei entdeckt. Erkunden Sie weitere Systeme.</div></div>`;
    }
  }
  return h;
}

/* ------------------------------------------------------------
   Seite: Aufträge — Fortschritt ohne Ablaufdatum
   ------------------------------------------------------------ */
function seiteAuftraege(g){
  const st = aufgabenStand();
  const r = rangZu(st.punkte);
  const erfuellt = st.liste.filter(a=>a.erfuellt).length;

  // Fortschritt zum nächsten Rang
  const von = r.jetzt.punkte;
  const bis = r.naechst ? r.naechst.punkte : r.jetzt.punkte;
  const anteil = r.naechst ? (st.punkte - von) / (bis - von) * 100 : 100;

  let h = `<div class="flaeche">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
      <div>
        <div class="gattung">Rang ${r.stufe} von ${RAENGE.length}</div>
        <div class="name" style="font-size:22px">${r.jetzt.titel}</div>
      </div>
      <div style="text-align:right">
        <div class="zahl" style="font-size:20px;font-weight:600">${st.punkte}</div>
        <div class="erlaeuterung">Punkte${r.naechst?` · ${bis - st.punkte} bis ${r.naechst.titel}`:" · höchster Rang"}</div>
      </div>
    </div>
    <div class="schiene" style="margin-top:11px;height:6px">
      <i style="width:${Math.min(100, anteil)}%"></i></div>
    <div class="erlaeuterung" style="margin-top:9px">
      ${erfuellt} von ${st.liste.length} Aufträgen erfüllt. Aufträge laufen nicht ab und werden
      nie zurückgesetzt — es zählt, was Sie erreichen, nicht wie oft Sie vorbeischauen.</div>
  </div>`;

  // Nach Gruppen sortiert, offene zuerst
  const gruppen = [...new Set(st.liste.map(a=>a.gruppe))];
  for(const gr of gruppen){
    const drin = st.liste.filter(a=>a.gruppe===gr)
      .sort((a,b)=> (a.erfuellt?1:0) - (b.erfuellt?1:0));
    const fertig = drin.filter(a=>a.erfuellt).length;
    h += `<div class="rubrik"><h2>${gr}</h2>
      <span class="zusatz">${fertig} / ${drin.length}</span></div>`;
    for(const a of drin){
      const anteilA = Math.min(100, a.wert / a.ziel * 100);
      h += `<div class="posten-zeile ${a.erfuellt?"erschoepft":""}">
        <div class="rumpf">
          <div class="bezeichnung">${a.erfuellt?"✓ ":""}${a.name}
            <span class="stufe">${a.punkte} Punkte</span></div>
          <div class="erlaeuterung">${a.beschreibung}</div>
          ${a.erfuellt ? "" : `<div class="schiene" style="margin-top:6px">
            <i style="width:${anteilA}%"></i></div>`}
        </div>
        <div class="zahl" style="color:${a.erfuellt?"var(--signal)":"var(--matt)"}">
          ${z0(a.wert)} / ${z0(a.ziel)}</div></div>`;
    }
  }

  h += `<div class="rubrik"><h2>Ränge</h2></div><div class="flaeche">`;
  for(let i=0;i<RAENGE.length;i++){
    const erreicht = st.punkte >= RAENGE[i].punkte;
    h += `<div style="display:flex;justify-content:space-between;padding:4px 0;
        border-bottom:${i<RAENGE.length-1?"1px solid var(--kante)":"none"}">
      <span style="color:${erreicht?"var(--text)":"var(--schwach)"}">
        ${erreicht?"✓ ":""}${RAENGE[i].titel}</span>
      <span class="zahl" style="color:var(--matt)">${RAENGE[i].punkte}</span></div>`;
  }
  h += `</div>`;
  return h;
}

/* ------------------------------------------------------------
   Seite: Forschung
   ------------------------------------------------------------ */
function seiteForschung(g){
  let h = `<div class="rubrik"><h2>Forschung</h2>
    <span class="zusatz">${z0(spiel.forschung)} vorhanden · +${z0(g.forschung)} je Stunde</span></div>`;
  if(g.forschung <= 0)
    h += `<div class="meldung">Niemand forscht. Laborkomplex ausbauen oder ein Objekt mit
      Forschungsdistrikten besiedeln.</div>`;
  for(const id in TECHS){
    const t = TECHS[id];
    const fertig = !techVerfuegbar(id);
    const kosten = fertig ? 0 : techKosten(id);
    h += `<div class="posten-zeile ${fertig?"erschoepft":""}">
      <div class="rumpf">
        <div class="bezeichnung">${t.name}
          ${techStufe(id)?`<span class="stufe">Stufe ${techStufe(id)}</span>`:""}</div>
        <div class="erlaeuterung">${t.wirkung}${fertig?" · abgeschlossen":""}</div>
        ${fertig?"":`<div class="werte"><span class="${spiel.forschung<kosten?"fehlt":""}"
          style="color:var(--forschung)">${z0(kosten)} Forschung</span></div>`}</div>
      ${fertig?"":`<button class="forsch" data-tech="${id}" ${spiel.forschung>=kosten?"":"disabled"}>Erforschen</button>`}
    </div>`;
  }
  return h;
}

document.addEventListener("click", e => {
  const sysEl = e.target.closest("[data-system]");
  if(sysEl){ spiel.offenesSystem = +sysEl.dataset.system; spiel.ansicht = "system"; speichern(); zeichnen(); return; }
  const ansehen = e.target.closest("button[data-objekt]");
  if(ansehen){
    const id = +ansehen.dataset.objekt;
    spiel.auswahl = id; spiel.offenesSystem = spiel.objekte[id].systemId;
    spiel.ansicht = "objekt"; spiel.tab = "karte";
    speichern(); zeichnen(); return;
  }
  const objEl = e.target.closest("[data-objekt]");
  if(objEl && !e.target.closest("button")){
    const id = +objEl.dataset.objekt;
    spiel.auswahl = id; spiel.offenesSystem = spiel.objekte[id].systemId; spiel.ansicht = "objekt";
    speichern(); zeichnen(); return;
  }
  const b = e.target.closest("button");
  if(!b) return;
  if(b.dataset.tab){
    spiel.tab = b.dataset.tab;
    if(b.dataset.tab === "auftrag") spiel.neueAufgaben = 0;
    speichern(); zeichnen();
  }
  else if(b.dataset.koltab){ spiel.kolonieTab = b.dataset.koltab; speichern(); zeichnen(); }
  else if(b.dataset.flottetab){
    spiel.flotteTab = b.dataset.flottetab;
    // Beim Öffnen der Berichte gelten alle als gelesen
    if(b.dataset.flottetab === "berichte")
      for(const r of (spiel.berichte||[])) r.gelesen = true;
    speichern(); zeichnen();
  }
  else if(b.dataset.handel){ handeln(b.dataset.handel, +b.dataset.nr); }
  else if(b.dataset.bericht){
    const r = (spiel.berichte||[])[+b.dataset.bericht];
    if(r){ r.offen = !r.offen; speichern(); zeichnen(); }
  }
  else if(b.dataset.kolonie){ spiel.auswahl = +b.dataset.kolonie; speichern(); zeichnen(); }
  else if(b.dataset.ansicht){ spiel.ansicht = b.dataset.ansicht; speichern(); zeichnen(); }
  else if(b.dataset.sonde)        sondeSenden(+b.dataset.sonde);
  else if(b.dataset.kolonisieren) kolonisieren(+b.dataset.kolonisieren);
  else if(b.dataset.bd)           baueDistrikt(+b.dataset.id, b.dataset.bd);
  else if(b.dataset.gb)           baueGebaeude(+b.dataset.id, b.dataset.gb);
  else if(b.dataset.zu)           zuweisen(+b.dataset.id, b.dataset.zu, +b.dataset.delta);
  else if(b.dataset.tech)         erforsche(b.dataset.tech);
  else if(b.dataset.schiff)       schiffBauen(b.dataset.schiff);
  else if(b.dataset.sammeln){
    const n = flotteFrei("frachter");
    if(n > 0 && !spiel.objekte[+b.dataset.sammeln].fraktion)
      starteMission("sammeln", +b.dataset.sammeln, { frachter:n });
  }
  else if(b.dataset.angriff){
    const flotte = {};
    for(const t of ["jaeger","korvette","kreuzer"]) if(flotteFrei(t)>0) flotte[t] = flotteFrei(t);
    if(Object.keys(flotte).length) starteMission("angriff", +b.dataset.angriff, flotte);
  }
});
document.getElementById("reset").addEventListener("click", () => {
  if(confirm("Spielstand wirklich löschen? Die Galaxie wird neu erzeugt.")){
    localStorage.removeItem("aussenposten8");
    spiel = neuesSpiel();
    zeichnen();
  }
});

/* ------------------------------------------------------------
   Sternenfeld — einmal erzeugt, danach reines Bild.
   Zwei Ebenen mit unterschiedlicher Dichte geben etwas Tiefe.
   ------------------------------------------------------------ */
function sternenFeld(anzahl, kachel, maxRadius, deckkraft){
  let punkte = "";
  for(let i=0;i<anzahl;i++){
    const x = (Math.random()*kachel).toFixed(1);
    const y = (Math.random()*kachel).toFixed(1);
    const r = (0.35 + Math.random()*maxRadius).toFixed(2);
    const o = (0.25 + Math.random()*deckkraft).toFixed(2);
    // wenige Sterne bekommen einen Farbstich, wie echte Sternfelder
    const w = Math.random();
    const farbe = w > 0.94 ? "#bcd4ff" : w > 0.88 ? "#ffe0bd" : "#ffffff";
    punkte += `<circle cx="${x}" cy="${y}" r="${r}" fill="${farbe}" opacity="${o}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${kachel}" height="${kachel}">${punkte}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
document.getElementById("sterne").style.backgroundImage  = sternenFeld(260, 420, 0.65, 0.40);
document.getElementById("sterne2").style.backgroundImage = sternenFeld(85, 300, 1.05, 0.60);

window.addEventListener("beforeunload", speichern);
