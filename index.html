    if(!flottenStaerke(eigen) || !flottenStaerke(feind)) break;

    // Beide Seiten feuern auf den Stand zu Rundenbeginn
    /* Schiffe, die aus der Linie ausscheren, feuern getrennt — sie
       suchen sich ihre Ziele im Hinterland statt in der Front. */
    const linie = {}, ausscherer = {};
    for(const t in eigen){
      if(SCHIFFE[t] && SCHIFFE[t].umkehren) ausscherer[t] = eigen[t];
      else linie[t] = eigen[t];
    }
    // Ionenstörer senken die Feuerkraft der Gegenseite
    const eigenBonus = { flottenBonus: wEigen.flottenBonus };
    const schadenAufFeind = schadenAusteilen(linie, feind, 1 - wFeind.abschlag, true, rollen, false, r, eigenBonus);
    if(flottenStaerke(ausscherer)){
      const extra = schadenAusteilen(ausscherer, feind, 1 - wFeind.abschlag, true, rollen, true, r, eigenBonus);
      for(const t in extra) schadenAufFeind[t] = (schadenAufFeind[t]||0) + extra[t];
    }
    const schadenAufUns   = schadenAusteilen(feind, eigen, panzerbonus * (1 - wEigen.abschlag),
                                             false, null, false, r, { flottenBonus: wFeind.flottenBonus });

    /* Spiegelkreuzer werfen zurück, was auf SIE gefeuert wurde — nicht
       einen Anteil des Gesamtbeschusses. Sonst verschwindet die Wirkung,
       sobald sie nur beigemischt sind statt die Flotte zu stellen. */
    let reflektiert = 0;
    for(const t in schadenAufUns){
      const d = SCHIFFE[t]; if(!d || !d.reflex || !eigen[t]) continue;
      reflektiert += schadenAufUns[t] * d.reflex;
    }
    if(reflektiert > 0){
      const verteilung = schadenAusteilen(feind, feind, 0, false, null, false, r, null);
      const summe = Object.values(verteilung).reduce((a,b)=>a+b,0) || 1;
      for(const t in verteilung)
        schadenAufFeind[t] = (schadenAufFeind[t]||0) + reflektiert * (verteilung[t]/summe);
    }

    /* Nanitensiphon fängt einen Teil des Beschusses ab, der die eigene
       Linie trifft — gleiche Überlegung: an die Schiffe gekoppelt, die
       tatsächlich da sind. */
    let siphonKraft = 0;
    for(const t in eigen){
      const d = SCHIFFE[t]; if(d && d.siphon) siphonKraft += d.siphon * eigen[t];
    }
    if(siphonKraft > 0){
      const eigenMenge = Object.values(eigen).reduce((a,b)=>a+b,0) || 1;
      const quote = Math.min(0.35, siphonKraft / eigenMenge);
      for(const t in schadenAufUns) schadenAufUns[t] *= (1 - quote);
    }

    const feindVerlust = verlusteAnwenden(feind, schadenAufFeind, kontoFeind);
    const eigenVerlust = verlusteAnwenden(eigen, schadenAufUns, kontoEigen);

    runden.push({
      nummer: r,
      eigenVerlust, feindVerlust,
      eigenRest: flottenStaerke(eigen),
      feindRest: flottenStaerke(feind),
    });
  }

  const feindWeg = flottenStaerke(feind) === 0;
  const eigenWeg = flottenStaerke(eigen) === 0;

  /* --- Sonderregeln der Beuteschiffe nach dem Gefecht --- */
  const schlepper = anzahlIm(eigen, "bergungsschlepper");
  const zusatz = [];

  // Wachfregatten gehen nicht verloren, sondern kehren angeschlagen heim
  let instand = 0;
  const wfVerlust = (schiffe.wachfregatte||0) - (eigen.wachfregatte||0);
  if(wfVerlust > 0){
    eigen.wachfregatte = (eigen.wachfregatte||0) + wfVerlust;
    instand = wfVerlust;
    zusatz.push(`${wfVerlust} Wachfregatten kehren angeschlagen zurück und werden instand gesetzt.`);
  }

  /* Logistiktender bergen einen Anteil der Verluste aller Klassen.
     Bewusst als Anteil und nicht als feste Zahl: Bei kleinen Gefechten
     soll ein Tender nicht mehr zurückholen, als überhaupt ausfiel. */
  const tender = anzahlIm(eigen, "logistiktender");
  if(tender > 0){
    const quote = Math.min(0.45, SCHIFFE.logistiktender.bergung * tender);
    let geborgen = 0;
    for(const t in schiffe){
      if(SCHIFFE[t] && SCHIFFE[t].verbrauch) continue;      // Drohnen sind weg
      const verlust = schiffe[t] - (eigen[t]||0);
      if(verlust <= 0) continue;
      const zurueck = Math.floor(verlust * quote);
      if(zurueck > 0){ eigen[t] = (eigen[t]||0) + zurueck; geborgen += zurueck; }
    }
    if(geborgen > 0){
      instand += geborgen;
      zusatz.push(`Logistiktender bergen ${geborgen} beschädigte Schiffe.`);
    }
  }

  // Drohnenboote verbrauchen sich — sie kehren grundsätzlich nicht zurück
  for(const t in eigen){
    if(SCHIFFE[t] && SCHIFFE[t].verbrauch){
      const weg = eigen[t];
      delete eigen[t];
      if(weg > 0) zusatz.push(`${weg} ${SCHIFFE[t].name} wurden im Einsatz verbraucht.`);
    }
  }

  // Schrottjäger zerfallen nach jedem Gefecht — auch bei Sieg
  if(eigen.schrottjaeger){
    const muede = Math.floor(eigen.schrottjaeger * SCHROTT_VERSCHLEISS);
    if(muede > 0){
      eigen.schrottjaeger -= muede;
      if(eigen.schrottjaeger <= 0) delete eigen.schrottjaeger;
      zusatz.push(`${muede} Schrottjäger fallen durch Materialermüdung aus.`);
    }
  }

  let bericht, beute = null, fragment = null;
  if(feindWeg){
    sys.piraten = null;
    const wert = feindStart * 40 * art.beute * (1 + schlepper * SCHLEPPER_BEUTE);
    beute = {};
    for(const r of ["erz","silikat","kupfer","legierung"])
      beute[r] = Math.floor(wert * (0.6 + Math.random()*0.6));
    bericht = `Sieg bei ${sys.name} — ${art.name} zerschlagen.`;
    // Wracks geben Baupläne der Bauart preis, gegen die gekämpft wurde
    fragment = fragmentWurf("gefecht", verband, schlepper);
  }else if(eigenWeg){
    sys.piraten.flotte = feind;
    bericht = `Niederlage bei ${sys.name} — die Flotte wurde aufgerieben.`;
  }else{
    sys.piraten.flotte = feind;
    bericht = `Unentschieden bei ${sys.name} — beide Seiten zogen sich zurück.`;
  }

  if(gewuerfelt) zusatz.unshift(`Die Wandelrümpfe kämpften diesmal in der Rolle: ${gewuerfelt}.`);
  if(fragment) zusatz.push(fragmentText(fragment));
  if(zusatz.length) bericht += " " + zusatz.join(" ");

  return { ueberlebende: eigen, beute, bericht, runden, instand,
           feindRest: flottenStaerke(feind) };
}


/* ------------------------------------------------------------
   Bodenkampf
   Bewusst nach demselben Muster wie der Raumkampf: acht Runden,
   beide Seiten schlagen gleichzeitig zu, das Feuer verteilt sich
   auf die Zieltypen nach ihrem Anteil. Wer die Konter kennt,
   gewinnt mit weniger Truppen.
   ------------------------------------------------------------ */
function bodenLeben(typ){ return (TRUPPEN[typ].panzerung||0) * BODEN_PANZER_ZU_LEBEN + 30; }

function bodenSchaden(angreifer, verteidiger, bonus){
  const gesamt = truppenAnzahl(verteidiger);
  if(!gesamt) return {};
  const anteil = {}, schaden = {};
  for(const t in verteidiger){ anteil[t] = verteidiger[t]/gesamt; schaden[t] = 0; }
  for(const at in angreifer){
    const n = angreifer[at]; if(!n) continue;
    const roh = n * (TRUPPEN[at].angriff||0) * bonus * BODEN_SCHADEN_FAKTOR;
    for(const zt in anteil){
      const konter = (KONTER_BODEN[at] && KONTER_BODEN[at][zt]) || 1;
      const streuung = 1 + (Math.random()*2 - 1) * BODEN_STREUUNG;
      schaden[zt] += roh * anteil[zt] * konter * streuung;
    }
  }
  return schaden;
}

// Gleiches Schadenskonto wie im Raumkampf — siehe verlusteAnwenden
function bodenVerluste(heer, schaden, konto){
  const verluste = {};
  for(const t in heer){
    if(!heer[t]) continue;
    konto[t] = (konto[t] || 0) + (schaden[t] || 0);
    const leben = bodenLeben(t);
    const gefallen = Math.min(heer[t], Math.floor(konto[t] / leben));
    if(gefallen > 0){
      konto[t] -= gefallen * leben;
      heer[t] -= gefallen; verluste[t] = gefallen;
      if(heer[t] <= 0){ delete heer[t]; delete konto[t]; }
    }
  }
  return verluste;
}

function bodenkampf(objId, truppen, bastion){
  const obj = spiel.objekte[objId];
  const eigen = { ...truppen };
  const feind = { ...(obj.garnison || {}) };
  const gelaende = gelaendeFaktor(obj.typ);
  const runden = [];
  /* Das Bastionsschiff setzt eigene Truppen ab, für die der
     Geländevorteil nicht gilt. Sie werden deshalb getrennt geführt
     und schlagen ohne den Verteidigerbonus zu. */
  const bastionTruppen = (bastion||0) * SCHIFFE.bastionsschiff.bodentruppen;
  const kontoEigen = {}, kontoFeind = {};

  for(let r = 1; r <= BODEN_RUNDEN; r++){
    if(!truppenAnzahl(eigen) || !truppenAnzahl(feind)) break;
    const aufFeind = bodenSchaden(eigen, feind, 1);
    // Bastionstruppen ignorieren das Gelände: ihr Anteil schlägt ungebremst zu
    if(bastionTruppen > 0){
      const extra = bodenSchaden({ panzer: bastionTruppen }, feind, 1);
      for(const t in extra) aufFeind[t] = (aufFeind[t]||0) + extra[t];
    }
    const aufUns   = bodenSchaden(feind, eigen, gelaende);
    const feindVerlust = bodenVerluste(feind, aufFeind, kontoFeind);
    const eigenVerlust = bodenVerluste(eigen, aufUns, kontoEigen);
    runden.push({ nummer:r, eigenVerlust, feindVerlust,
                  eigenRest: truppenAnzahl(eigen), feindRest: truppenAnzahl(feind) });
  }

  const genommen = truppenAnzahl(feind) === 0 && truppenAnzahl(eigen) > 0;
  return { ueberlebende: eigen, rest: feind, runden, genommen, gelaende };
}

/* Erobern: Die Welt wechselt mitsamt Bevölkerung und bereits
   gebauten Distrikten den Besitzer. Sie zählt gegen die Höchstzahl. */
function weltErobern(objId, uebrig){
  const obj = spiel.objekte[objId];
  const partei = obj.fraktion;
  const k = neueKolonie(objId);
  // Die Vorbesitzer haben schon gebaut — der Neuling erbt einen Teil davon
  for(const d in obj.felder) k.distrikte[d] = Math.floor(obj.felder[d] * 0.4);
  k.bev = Math.max(2, Math.round(truppenAnzahl(uebrig) * 0.15));
  spiel.kolonien[objId] = k;
  obj.fraktion = null;
  delete obj.garnison;
  delete spiel.handel[objId];
  diploAendern(partei, BEZIEHUNG_INVASION);
  return partei;
}

function missionAuswerten(m){
  const zielIstObjekt = (m.art === "sammeln" || m.art === "invasion");
  const sys = spiel.systeme[m.art === "foerdern" ? (clusterVon(m.ziel)||{systemId:0}).systemId
            : zielIstObjekt ? spiel.objekte[m.ziel].systemId : m.ziel];
  if(m.art === "erkunden"){
    sys.erkundet = true;
    m.bericht = `System ${sys.name} erkundet — ${sys.objekte.length} Objekte erfasst.`;
    // Manchmal findet die Sonde nebenbei etwas
    if(Math.random() < ANOMALIE_CHANCE){
      const arten = Object.keys(ANOMALIEN);
      const art = arten[Math.floor(Math.random()*arten.length)];
      spiel.anomalien = spiel.anomalien || [];
      spiel.anomalien.push({
        id: Date.now() + Math.floor(Math.random()*1000),
        art, systemId: sys.id, gefunden: Date.now(), erledigt: false,
      });
      m.bericht += ` Fundstück entdeckt: ${ANOMALIEN[art].name}.`;
    }
    /* Antike Zivilisationen geben einmalig je Welt ein Bruchstück
       fremder Bauart her — die verlässlichste Quelle für die
       Schwarm-Bauarten, und ganz ohne Kampf erreichbar. */
    for(const oid of sys.objekte){
      const o = spiel.objekte[oid];
      if(o.typ === "antike" && !o.bergungGehoben){
        o.bergungGehoben = true;
        spiel.gesehen.schwarm = true;   // fremde Bauart wird dadurch bekannt
        const fa = fragmentZiehen("schwarm");
        if(fa) m.bericht += ` In den Ruinen: ${fragmentText(fa)}`;
      }
    }
    // Die Sonde bleibt erhalten und tritt den Rückflug an
  }
  else if(m.art === "besiedeln"){
    spiel.kolonien[m.ziel] = neueKolonie(m.ziel);
    m.schiffe = {};                       // Siedlerschiff wird zur Kolonie
    m.bericht = `${spiel.objekte[m.ziel].name} besiedelt.`;
  }
  else if(m.art === "sammeln"){
    m.ladung = sammelErtrag(m.ziel, m.schiffe.frachter||0, m.schiffe.blockadebrecher||0);
    m.bericht = `Frachter beladen bei ${spiel.objekte[m.ziel].name}.`;
    /* Trümmerfelder am Sammelort geben Bruchstücke preis. Ohne Kampf
       weiss man nicht, von wem sie stammen — die Bauart ist zufällig. */
    const f = fragmentWurf("truemmer", null, m.schiffe.bergungsschlepper||0);
    if(f) m.bericht += " " + fragmentText(f);
  }
  else if(m.art === "invasion"){
    invasionAnkunft(m, sys);
  }
  else if(m.art === "foerdern"){
    const c = clusterVon(m.ziel);
    if(!c){
      m.bericht = "Der Cluster war bei Ankunft bereits aufgelöst — die Flotte kehrt um.";
      m.abgebrochen = true;
    }else{
      m.bericht = `Förderbetrieb bei ${CLUSTER_ARTEN[c.art].name} aufgenommen.`;
    }
  }
  else if(m.art === "angriff"){
    const e = kampf(sys.id, m.schiffe);
    m.schiffe = e.ueberlebende;
    m.ladung = e.beute;
    m.bericht = e.bericht;
    m.runden = e.runden;
    m.instand = e.instand || 0;
  }
}

/* Ankunft einer Invasionsflotte: Erst der Orbit, dann die Belagerung.
   Steht noch ein Piratenverband im System, ist der Orbit nicht frei —
   die unbewaffneten Landungsschiffe gehen dabei verloren. */
function invasionAnkunft(m, sys){
  const obj = spiel.objekte[m.ziel];
  if(sys.piraten){
    const verloren = m.schiffe.landungsschiff || 0;
    m.schiffe = {}; m.truppen = {};
    m.bericht = `Invasion von ${obj.name} gescheitert — der Orbit ist nicht frei. `
              + `${verloren} Landungsschiffe wurden abgefangen.`;
    m.abgebrochen = true;
    return;
  }
  if(!obj.fraktion){
    m.bericht = `${obj.name} ist bereits in eigener Hand — die Flotte kehrt um.`;
    m.abgebrochen = true;
    return;
  }
  m.belagerungBis = Date.now() + belagerungsdauer(m.ziel)*1000/TEMPO;
  m.bericht = `Orbit über ${obj.name} gesichert. Die Belagerung hat begonnen.`;
}

function belagerungsdauer(objId){
  const obj = spiel.objekte[objId];
  const bev = truppenAnzahl(obj.garnison);
  return Math.round(BELAGERUNG_GRUND + bev * BELAGERUNG_JE_KOPF / 4);
}

/* Der Sturm. Die Belagerung hat die Garnison bereits zermürbt —
   wer wartet, verliert weniger eigene Leute. */
function invasionSturm(m){
  const obj = spiel.objekte[m.ziel];
  if(!obj.fraktion){ m.bericht = `${obj.name} ist bereits genommen.`; m.truppen = {}; return; }

  for(const t in obj.garnison){
    obj.garnison[t] = Math.max(0, Math.round(obj.garnison[t] * (1 - BELAGERUNG_ZERMUERBUNG)));
    if(!obj.garnison[t]) delete obj.garnison[t];
  }

  const e = bodenkampf(m.ziel, m.truppen || {}, anzahlIm(m.schiffe, "bastionsschiff"));
  m.bodenrunden = e.runden;
  m.truppen = e.ueberlebende;

  if(e.genommen){
    const partei = weltErobern(m.ziel, e.ueberlebende);
    m.bericht = `${obj.name} erobert — ${PARTEIEN[partei].kurz} verliert eine Welt. `
              + `Die Beziehung sinkt um ${Math.abs(BEZIEHUNG_INVASION)}.`;
    // Eroberte Welten geben Baupläne der Sturmdoktrin preis
    if(spiel.gesehen.tiefenwache){
      const f = fragmentWurf("gefecht", "tiefenwache", 0);
      if(f) m.bericht += " " + fragmentText(f);
    }
    // Die Überlebenden bleiben als Besatzung vor Ort
    m.truppen = {};
  }else if(!truppenAnzahl(e.ueberlebende)){
    obj.garnison = e.rest;
    m.bericht = `Landung auf ${obj.name} gescheitert — die Truppen wurden aufgerieben.`;
  }else{
    obj.garnison = e.rest;
    m.bericht = `Sturm auf ${obj.name} abgebrochen — die Garnison hält noch `
              + `${truppenAnzahl(e.rest)} Verbände. Die Truppen ziehen sich zurück.`;
  }
}

function missionHeimkehr(m){
  // Trümmerfelder geben gelegentlich Baupläne her
  if(m.art === "foerdern" && m.clusterArt){
    const d = CLUSTER_ARTEN[m.clusterArt];
    if(d && d.fragmentChance && Math.random() < d.fragmentChance){
      const f = fragmentZiehen(null);
      if(f) m.bericht = (m.bericht||"") + " " + fragmentText(f);
    }
  }
  /* Wachfregatten kehren angeschlagen zurück statt zu sinken — die
     Instandsetzung kostet nur einen Bruchteil des Neubaus. Reicht das
     Lager nicht, wartet die Reparatur; verloren geht das Schiff nie. */
  if(m.instand > 0){
    // Pauschal nach dem Satz der Wachfregatte — sonst müsste die Mission
    // festhalten, welche Klasse jeweils geborgen wurde
    const k = {};
    for(const r in SCHIFFE.wachfregatte.kosten)
      k[r] = Math.round(SCHIFFE.wachfregatte.kosten[r] * WACHFREGATTE_REPARATUR * m.instand);
    if(bezahlbar(k)) abbuchen(k);
  }
  for(const t in m.schiffe) spiel.schiffe[t] = (spiel.schiffe[t]||0) + m.schiffe[t];
  for(const t in (m.truppen||{})) spiel.truppen[t] = (spiel.truppen[t]||0) + m.truppen[t];
  if(m.ladung)
    for(const r in m.ladung) spiel.res[r] = (spiel.res[r]||0) + m.ladung[r];
  if(m.ladungSelten)
    for(const t in m.ladungSelten)
      spiel.selten[t] = (spiel.selten[t]||0) + Math.floor(m.ladungSelten[t]);

  spiel.berichte = spiel.berichte || [];
  spiel.berichte.unshift({
    text: m.bericht,
    art: m.art,
    ziel: (m.art === "sammeln" || m.art === "besiedeln" || m.art === "invasion")
          ? (spiel.objekte[m.ziel]?.name || "?")
          : (spiel.systeme[m.nachSys]?.name || "?"),
    ausgesandt: m.ausgesandt || m.schiffe,
    heimgekehrt: { ...m.schiffe },
    ladung: m.ladung,
    runden: m.runden || null,
    bodenrunden: m.bodenrunden || null,
    truppenAus: m.truppenAus || null,
    truppenZurueck: { ...(m.truppen||{}) },
    zeit: Date.now(),
  });
  spiel.berichte = spiel.berichte.slice(0, 25);
}

/* ============================================================
   11. AKTIONEN
   ============================================================ */
// Verteilt eine Gesamtstärke nach der Mischung des Verbandes auf Schiffstypen
/* Erzeugt eine Piratenflotte zu einer Zielstärke.
   Wichtig: Nicht die Stückzahl wird vorgegeben, sondern die STÄRKE.
   Sonst wäre ein Verband aus Schlachtschiffen bei gleicher Stückzahl
   um ein Vielfaches gefährlicher als einer aus Jägern — und beim
   Schwarm, dessen Mischung gewürfelt wird, schwankte die Gefahr
   unkontrolliert. So bleibt jeder Verband berechenbar gefährlich;
   was sich unterscheidet, ist die ZUSAMMENSETZUNG, nicht die Wucht. */
function piratenFlotte(art, gesamt){
  const d = PIRATEN_ARTEN[art];
  const mischung = d.mischung || schwarmMischung();
  const ziel = gesamt * PIRAT_STAERKE_JE_PUNKT * (d.staerkeFaktor || 1);

  // Stärke einer gedachten Einheit dieser Mischung
  let jeEinheit = 0;
  for(const t in mischung){
    if(!SCHIFFE[t] || !mischung[t]) continue;
    jeEinheit += mischung[t] * ((SCHIFFE[t].angriff||0) + (SCHIFFE[t].panzerung||0)*0.5);
  }
  if(jeEinheit <= 0) return { jaeger: Math.max(1, Math.round(gesamt)) };

  // Aschefahrer sind zahlreicher, als ihre Stärke vermuten lässt
  const einheiten = (ziel / jeEinheit) * (d.mengenBonus || 1);
  const f = {};
  for(const t in mischung){
    const n = Math.round(einheiten * mischung[t]);
    if(n > 0) f[t] = n;
  }
  if(!Object.keys(f).length) f.jaeger = 1;
  return f;
}

/* Zufällige Aufstellung für den Schwarm. Bewusst breit gestreut:
   mal fast nur Jäger, mal fast nur Schwere. */
function schwarmMischung(){
  const arten = ["jaeger","zerstoerer","korvette","fregatte","kreuzer","schlachtschiff"];
  const roh = arten.map(()=> Math.pow(Math.random(), 2));
  const summe = roh.reduce((a,b)=>a+b,0) || 1;
  const m = {};
  arten.forEach((t,i)=> m[t] = roh[i]/summe);
  return m;
}

function piratenStaerke(sys){
  if(!sys.piraten) return 0;
  let s = 0;
  for(const t in sys.piraten.flotte)
    s += sys.piraten.flotte[t] * ((SCHIFFE[t].angriff||0) + (SCHIFFE[t].panzerung||0)*0.5);
  return Math.floor(s * (PIRATEN_ARTEN[sys.piraten.art].panzerbonus || 1));
}
function piratenAnzahl(sys){
  if(!sys.piraten) return 0;
  let n = 0; for(const t in sys.piraten.flotte) n += sys.piraten.flotte[t];
  return n;
}

function entfernungSys(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function naechstesEigenesSystem(sys){
  let best = Infinity;
  for(const id in spiel.kolonien){
    const s = spiel.systeme[spiel.objekte[id].systemId];
    best = Math.min(best, entfernungSys(sys, s));
  }
  return best === Infinity ? 40 : best;
}
function sondeSenden(sysId){
  if(spiel.systeme[sysId].erkundet || flotteFrei("sonde") < 1) return;
  starteMission("erkunden", sysId, { sonde:1 });
}
function kolonieKosten(objId){
  const art = OBJEKTE[spiel.objekte[objId].typ].art;
  const z = zaehleKolonien();
  const n = art === "planet" ? z.planeten : z.habitate;
  const basis = art === "planet" ? { erz:800, silikat:400, energiezellen:300 }
                                 : { erz:600, silikat:500, kupfer:200, energiezellen:400 };
  const k = {};
  for(const r in basis) k[r] = Math.floor(basis[r]*Math.pow(1.5, n));
  return k;
}
function kannKolonisieren(objId){
  if(spiel.kolonien[objId]) return false;
  const obj = spiel.objekte[objId];
  if(obj.fraktion) return false;              // fremde Welt, nicht besiedelbar
  if(spiel.systeme[obj.systemId].piraten) return false;         // erst aufräumen
  if(flotteFrei("siedlerschiff") < 1) return false;
  const t = OBJEKTE[obj.typ], z = zaehleKolonien();
  if(!t.zaehltNicht){
    if(t.art === "planet"  && z.planeten >= maxPlaneten()) return false;
    if(t.art === "habitat" && z.habitate >= maxHabitate()) return false;
  }
  return bezahlbar(kolonieKosten(objId));
}
/* Startet eine Invasion: Geleitschutz, Landungsschiffe und so viele
   Truppen, wie der Transportraum hergibt. Wie beim Piratenangriff
   wird alles Verfügbare geschickt — eine Teilauswahl wäre eine
   Bedienlast ohne echten Gewinn. */
/* Schickt alle freien Förderschiffe zum Cluster. Wie bei den anderen
   Missionen keine Teilauswahl — sie wäre Bedienlast ohne echten Gewinn. */
function foerderungStarten(clusterId){
  const c = clusterVon(clusterId); if(!c) return;
  const n = flotteFrei("foerderschiff"); if(n < 1) return;
  if(spiel.missionen.some(m => m.art === "foerdern" && m.ziel === clusterId)) return;
  starteMission("foerdern", clusterId, { foerderschiff: n });
  speichern(); zeichnen();
}

function invasionStarten(objId){
  const obj = spiel.objekte[objId];
  if(!obj || !obj.fraktion) return;
  if(spiel.systeme[obj.systemId].piraten) return;
  const transport = flotteFrei("landungsschiff");
  if(transport < 1) return;

  const platz = transport * TRUPPEN_JE_LANDUNGSSCHIFF;
  const truppen = {};
  let genommen = 0;
  // Gleichmässig aus allen Gattungen laden, damit die Mischung erhalten bleibt
  const arten = Object.keys(TRUPPEN).filter(t => truppenFrei(t) > 0);
  const gesamtFrei = arten.reduce((a,t)=>a+truppenFrei(t),0);
  if(!gesamtFrei) return;
  for(const t of arten){
    const anteil = truppenFrei(t)/gesamtFrei;
    const n = Math.min(truppenFrei(t), Math.floor(platz*anteil));
    if(n > 0){ truppen[t] = n; genommen += n; }
  }
  // Restplatz auffüllen
  for(const t of arten){
    while(genommen < platz && truppenFrei(t) > (truppen[t]||0)){
      truppen[t] = (truppen[t]||0)+1; genommen++;
    }
  }
  if(!genommen) return;

  const schiffe = { landungsschiff: Math.max(1, Math.ceil(genommen/TRUPPEN_JE_LANDUNGSSCHIFF)) };
  // Geleitschutz mitschicken, falls vorhanden — Landungsschiffe sind wehrlos
  for(const t of ["jaeger","korvette","kreuzer"]) if(flotteFrei(t) > 0) schiffe[t] = flotteFrei(t);

  starteMission("invasion", objId, schiffe, truppen);
}

function kolonisieren(objId){
  if(!kannKolonisieren(objId)) return;
  abbuchen(kolonieKosten(objId));
  starteMission("besiedeln", objId, { siedlerschiff:1 });
}
function baueDistrikt(id, s){
  const k = spiel.kolonien[id], obj = spiel.objekte[id];
  const max = obj.felder[s] || 0;
  const kosten = distriktKosten(s, id);
  if(k.bau || k.distrikte[s] >= max || !bezahlbar(kosten)) return;
  abbuchen(kosten);
  const dauer = bauzeit(kosten);
  k.bau = { art:"distrikt", schluessel:s, dauer, fertigAb:Date.now()+dauer*1000/TEMPO };
  speichern(); zeichnen();
}
function baueGebaeude(id, s){
  const k = spiel.kolonien[id], g = GEBAEUDE[s];
  const ziel = k.gebaeude[s] + 1;
  if(k.bau || ziel > g.maxLevel || !erlaubteGebaeude(id).includes(s)) return;
  const kosten = gebaeudeKosten(s, ziel);
  if(!bezahlbar(kosten)) return;
  abbuchen(kosten);
  const dauer = bauzeit(kosten);
  k.bau = { art:"gebaeude", schluessel:s, dauer, fertigAb:Date.now()+dauer*1000/TEMPO };
  speichern(); zeichnen();
}
function zuweisen(id, schluessel, delta){
  const k = spiel.kolonien[id], z = berechneKolonie(id);
  const jetzt = k.zuweisung[schluessel] || 0;
  const neu = jetzt + delta;
  if(neu < 0 || neu > MAX_ZUWEISUNG) return;
  if(delta > 0 && z.frei <= 0) return;
  k.zuweisung[schluessel] = neu;
  speichern(); zeichnen();
}
function erforsche(id){
  if(!techVerfuegbar(id)) return;
  const k = techKosten(id);
  if(spiel.forschung < k) return;
  spiel.forschung -= k;
  spiel.techs[id] = techStufe(id) + 1;
  speichern(); zeichnen();
}

/* ============================================================
   12. ANZEIGE
   Aufbau: Kopfleiste (klebt) — Hauptreiter — Bühne.
   Die Bühne zeigt je nach Reiter Karte, Kolonie, Flotte oder Forschung.
   ============================================================ */
const nf = new Intl.NumberFormat("de-DE");
const z0 = n => nf.format(Math.round(n));
function zeitText(s){
  s = Math.max(0, Math.ceil(s));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), r=s%60;
  if(h) return `${h} h ${String(m).padStart(2,"0")} min`;
  if(m) return `${m}:${String(r).padStart(2,"0")} min`;
  return `${r} s`;
}
function seltenZeile(selten){
  if(!selten) return "";
  return Object.keys(selten).map(t => {
    const fehlt = (spiel.selten?.[t]||0) < selten[t];
    return `<span class="${fehlt?"fehlt":""}" style="${fehlt?"":"color:"+SELTEN[t].farbe}">
      ${SELTEN[t].name} ${z0(selten[t])}</span>`;
  }).join("");
}

/* Kosten und Erträge tragen dasselbe Symbol wie der Streifen. Der Name
   steht im Tooltip — bei vier bis fünf Posten nebeneinander sind
   ausgeschriebene Namen die Hauptursache für Zeilenumbrüche. */
function kostenZeile(kosten, dauer){
  let h="";
  for(const r in kosten)
    h += `<span class="${(spiel.res[r]||0)<kosten[r]?"fehlt":""}" title="${RES_NAMEN[r]}"
      style="color:var(--${r})">${resSymbol(r, 13)} <span style="color:var(--text)">${z0(kosten[r])}</span></span>`;
  if(dauer != null) h += `<span>${zeitText(dauer)}</span>`;
  return h;
}
function ertragText(ertrag){
  return Object.keys(ertrag).map(r =>
    `<span title="${RES_NAMEN[r]}" style="color:var(--${r})">${resSymbol(r, 13)}
      <span style="color:var(--text)">+${z0(ertrag[r])}</span></span>`).join(" ");
}
function fortschrittBalken(rest, dauer){
  return `<div class="schiene"><i style="width:${Math.min(100,Math.max(0,(1-rest/(dauer/TEMPO))*100))}%"></i></div>`;
}

/* ------------------------------------------------------------
   Planetenscheibe — je Objekttyp anders gezeichnet.

function scheibe(typ, groesse){

  // Eigenes Bild hinterlegt? Dann hat es Vorrang.

    return `<img class="scheibe weltbild" src="${BILDER[typ]}" alt="${def.name}"
      width="${groesse}" height="${groesse}" loading="lazy"
      onerror="this.replaceWith(bildErsatz('${typ}', ${groesse}))">`;
  }
  const u = "s"+typ;                     // eindeutige Kennung je Typ
  let oberflaeche = "";

  switch(typ){
    case "ozean":
      oberflaeche = `<ellipse cx="34" cy="38" rx="15" ry="9" fill="#6fae7a" opacity=".8"/>
        <ellipse cx="62" cy="60" rx="19" ry="11" fill="#6fae7a" opacity=".7"/>

        <ellipse cx="50" cy="14" rx="26" ry="7" fill="#ffffff" opacity=".25"/>`;
      break;
    case "vulkan":
      oberflaeche = `<path d="M20 62 L38 44 L52 58 L68 34 L82 52" stroke="#ffb648" stroke-width="2.6"
          fill="none" opacity=".85" stroke-linejoin="round"/>
        <path d="M14 40 L30 30 L44 40" stroke="#ff8a3c" stroke-width="2" fill="none" opacity=".7"/>
        <circle cx="66" cy="70" r="7" fill="#ff9c3f" opacity=".55"/>
        <circle cx="30" cy="24" r="4.5" fill="#ffb648" opacity=".45"/>`;
      break;
    case "fels":
      oberflaeche = `<circle cx="35" cy="36" r="9" fill="#000" opacity=".22"/>
        <circle cx="63" cy="57" r="12" fill="#000" opacity=".18"/>
        <circle cx="52" cy="24" r="5" fill="#000" opacity=".2"/>
        <circle cx="26" cy="62" r="6.5" fill="#000" opacity=".2"/>
        <circle cx="72" cy="32" r="4" fill="#fff" opacity=".12"/>`;
      break;
    case "eis":
      oberflaeche = `<ellipse cx="50" cy="15" rx="27" ry="9" fill="#ffffff" opacity=".62"/>
        <ellipse cx="50" cy="85" rx="24" ry="8" fill="#ffffff" opacity=".55"/>
        <path d="M22 46 L44 40 L66 50 L84 44" stroke="#ffffff" stroke-width="1.6" fill="none" opacity=".4"/>
        <path d="M18 60 L40 56 L62 64" stroke="#ffffff" stroke-width="1.2" fill="none" opacity=".3"/>`;
      break;
    case "gasriese":
      oberflaeche = `<ellipse cx="50" cy="28" rx="47" ry="7" fill="#000" opacity=".16"/>
        <ellipse cx="50" cy="45" rx="49" ry="6" fill="#fff" opacity=".14"/>
        <ellipse cx="50" cy="60" rx="46" ry="8" fill="#000" opacity=".18"/>
        <ellipse cx="50" cy="74" rx="38" ry="5" fill="#fff" opacity=".1"/>
        <ellipse cx="64" cy="59" rx="10" ry="4.5" fill="#e08048" opacity=".7"/>`;
      break;
    default:
      // Habitatobjekte: kein fester Körper, sondern Schwaden und Bruchstücke
      if(typ === "erzguertel"){
        return `<svg class="scheibe" viewBox="0 0 100 100" width="${groesse}" height="${groesse}">
          <ellipse cx="50" cy="50" rx="44" ry="15" fill="none" stroke="${f}" stroke-width="1" opacity=".35"/>
          ${[[22,44,5],[38,56,3.4],[54,42,6],[68,55,4],[80,48,3],[46,60,2.6],[62,38,2.4]]
            .map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" opacity=".85"/>`).join("")}
        </svg>`;
      }
      if(typ === "antike"){
        return `<svg class="scheibe" viewBox="0 0 100 100" width="${groesse}" height="${groesse}">
          <circle cx="50" cy="50" r="40" fill="none" stroke="${f}" stroke-width=".8" opacity=".3"/>
          <path d="M30 72 L30 40 L50 26 L70 40 L70 72 Z" fill="none" stroke="${f}" stroke-width="1.8" opacity=".85"/>

// Springt ein, wenn eine hinterlegte Bilddatei nicht gefunden wird
function bildErsatz(typ, groesse){
  const h = document.createElement("div");
  const merk = BILDER[typ];
  BILDER[typ] = "";                 // einmal umschalten, sonst Endlosschleife
  h.innerHTML = scheibe(typ, groesse);
  BILDER[typ] = merk;
  console.warn("Bild nicht gefunden:", merk, "— gezeichnete Scheibe wird verwendet.");
  return h.firstElementChild;
}

/* ------------------------------------------------------------
   Hauptzeichnung
   ------------------------------------------------------------ */
function zeichnen(){
  const g = berechneReich();
  if(!spiel.tab) spiel.tab = "karte";
  if(!spiel.kolonieTab) spiel.kolonieTab = "uebersicht";

  // Kopfzeile: Reichskennung
  const z = zaehleKolonien();
  document.getElementById("kennung").textContent =
    `${z.planeten}/${maxPlaneten()} Planeten · ${z.habitate}/${maxHabitate()} Habitate · ${g.bev} Bewohner`;

  // Ressourcenstreifen
  let h = "";
  for(const r of RES){
    const rate = g.ein[r];
    // Volles Lager sichtbar machen — sonst verfällt Ertrag unbemerkt
    const anteil = g.lagergrenze ? spiel.res[r]/g.lagergrenze : 0;
    const voll = anteil >= 0.995 && rate > 0;
    const knapp = !voll && anteil >= 0.9 && rate > 0;
    h += `<div class="posten" style="--ton:var(--${r})"
        title="${RES_NAMEN[r]} — ${z0(spiel.res[r])} im Lager, ${(rate>=0?"+":"")+z0(rate)} je Stunde${
          voll ? ", Lager voll" : ""}">
      ${resSymbol(r, 17)}
      <div class="werte-block">
        <span class="stand"${voll?' style="color:var(--alarm)"':knapp?' style="color:var(--bernstein)"':''}>${z0(spiel.res[r])}</span>
        <span class="fluss ${rate<0?"minus":""}"${voll?' style="color:var(--alarm)"':''}>${
          voll ? "voll" : (rate>=0?"+":"")+z0(rate)}</span></div></div>`;
  }
  h += `<div class="posten" style="--ton:var(--forschung)"
      title="Forschung — ${z0(spiel.forschung)} verfügbar, +${z0(g.forschung)} je Stunde">
      ${resSymbol("forschung", 17)}
      <div class="werte-block">
        <span class="stand">${z0(spiel.forschung)}</span>
        <span class="fluss" style="color:var(--forschung)">+${z0(g.forschung)}</span></div></div>`;
  /* Seltene Stoffe in eigener Zeile mit Symbolen. Sie stehen bewusst nicht
     im Hauptstreifen: Acht Kacheln plus Forschung sind die Grenze des
     Lesbaren, und seltene Stoffe braucht man nur beim Schiffbau. */
  /* Seltene Stoffe als vollwertige Kacheln — seit alle Ressourcen ein
     Symbol tragen, gibt es keinen Grund mehr für eine Sonderzeile. Alle
     Stoffe stehen immer im Streifen; er bricht in eine zweite Reihe um. */
  for(const t in SELTEN){
    const d = SELTEN[t], n = spiel.selten?.[t] || 0;
    h += `<div class="posten" style="--ton:${d.farbe}" title="${d.name} — ${d.zweck}">
      <svg width="17" height="17" viewBox="-8 -8 16 16" class="res-sym"
        style="color:${d.farbe}">${d.symbol}</svg>
      <div class="werte-block">
        <span class="stand">${z0(n)}</span>
        <span class="fluss" style="color:var(--matt)">${d.name}</span></div></div>`;
  }
  document.getElementById("streifen").innerHTML = h;

  // Hauptreiter mit Zählern
  const laufend = spiel.missionen.length + (spiel.werftauftrag?1:0);
  const bauend = Object.keys(spiel.kolonien).filter(id => spiel.kolonien[id].bau).length;
  const forschbar = Object.keys(TECHS).filter(t => techVerfuegbar(t) && spiel.forschung >= techKosten(t)).length;
  const neueBerichte = (spiel.berichte||[]).filter(b => !b.gelesen).length;
  const reiter = [
    ["karte","Karte",""],
    ["kolonie","Kolonien", bauend?`<span class="zeiger">${bauend}</span>`:""],
    ["werft","Werft", spiel.werftauftrag?`<span class="zeiger">1</span>`:""],
    ["flotte","Flotte", spiel.missionen.length?`<span class="zeiger">${spiel.missionen.length}</span>`
      : neueBerichte?`<span class="zeiger warn">${neueBerichte}</span>`:""],
    ["forschung","Forschung", forschbar?`<span class="zeiger warn">${forschbar}</span>`:""],
    ["diplomatie","Diplomatie",""],
    ["auftrag","Aufträge", spiel.neueAufgaben?`<span class="zeiger warn">${spiel.neueAufgaben}</span>`:""],
  ];
  document.getElementById("nav").innerHTML = reiter.map(([k,n,zg]) =>
    `<button data-tab="${k}" class="${spiel.tab===k?"an":""}">${n}${zg}</button>`).join("");

  // Bühne
  const buehne = document.getElementById("buehne");
  if(spiel.tab === "karte")          buehne.innerHTML = seiteKarte(g);
  else if(spiel.tab === "kolonie")   buehne.innerHTML = seiteKolonie(g);
  else if(spiel.tab === "werft")     buehne.innerHTML = seiteWerft(g);
  else if(spiel.tab === "flotte")    buehne.innerHTML = seiteFlotte(g);
  else if(spiel.tab === "diplomatie") buehne.innerHTML = seiteDiplomatie(g);
  else if(spiel.tab === "auftrag")   buehne.innerHTML = seiteAuftraege(g);
  else                               buehne.innerHTML = seiteForschung(g);
}

/* ------------------------------------------------------------
   Seite: Karte
   ------------------------------------------------------------ */
function seiteKarte(g){
  const sys = spiel.systeme[spiel.offenesSystem];
  let h = lageTafel();
  h += `<div class="pfad">
    <button data-ansicht="galaxie">Galaxie</button>`;
  if(spiel.ansicht !== "galaxie") h += `<span>›</span><button data-ansicht="system">${sys.name}</button>`;
  if(spiel.ansicht === "objekt") h += `<span>›</span><span>${spiel.objekte[spiel.auswahl].name}</span>`;
  h += `</div>`;

  h += `<div class="karte">${spiel.ansicht === "galaxie" ? galaxieKarte() : systemKarte(sys)}</div>`;

  if(spiel.ansicht === "objekt")
    h += `<div style="margin-top:12px">${objektTafel(spiel.auswahl, g)}</div>`;
  else if(spiel.ansicht === "system"){
    h += clusterTafel(sys.id);
  }
  if(spiel.ansicht === "galaxie"){
    // Cluster aller Systeme, damit man sie nicht suchen muss
    const alle = spiel.cluster || [];
    if(alle.length){
      h += `<div class="rubrik"><h2>Ressourcencluster</h2>
        <span class="zusatz">${alle.length} in der Galaxie</span></div>`;
      for(const c of alle){
        const d = CLUSTER_ARTEN[c.art];
        const rest = (c.bisAb - Date.now())/1000;
        const laeuft = spiel.missionen.find(m => m.art === "foerdern" && m.ziel === c.id);
        h += `<div class="posten-zeile" style="border-left:2px solid ${d.farbe}">
          <div class="rumpf">
            <div class="bezeichnung" style="color:${d.farbe}">${d.name}
              <span class="stufe">${z0(c.vorrat)} übrig</span></div>
            <div class="erlaeuterung">System ${spiel.systeme[c.systemId].name} ·
              löst sich auf in ${zeitText(rest*TEMPO)}
              ${d.selten ? `<br><span style="color:${d.farbe}">Liefert ${SELTEN[d.selten].name} —
                ${SELTEN[d.selten].zweck}</span>` : ""}</div></div>
          ${laeuft ? `<span class="stufe" style="color:var(--signal)">Förderung läuft</span>`
                   : `<button data-cluster="${c.id}"
                       ${flotteFrei("foerderschiff")?"":"disabled"}>Fördern</button>`}</div>`;
      }
    }

    // Offene Fundstücke — warten, bis man Zeit hat
    const offen = (spiel.anomalien||[]).filter(a => !a.erledigt);
    if(offen.length){
      h += `<div class="rubrik"><h2>Fundstücke</h2>
        <span class="zusatz">${offen.length} unerschlossen</span></div>`;
      for(const a of offen){
        const d = ANOMALIEN[a.art];
        h += `<div class="posten-zeile" style="border-left:2px solid ${d.farbe}">
          <div class="rumpf">
            <div class="bezeichnung" style="color:${d.farbe}">${d.name}</div>
            <div class="erlaeuterung">System ${spiel.systeme[a.systemId].name} · ${d.text}</div></div>
          <button data-anomalie="${a.id}">Untersuchen</button></div>`;
      }
    }

    // Übersicht der strategischen Vorkommen
    const vb = vorkommenBesitz();
    const hat = Object.keys(STRATEGISCH).filter(v => vb.zahl[v] > 0);
    h += `<div class="rubrik"><h2>Strategische Vorkommen</h2>
      <span class="zusatz">${hat.length} von ${Object.keys(STRATEGISCH).length} erschlossen</span></div>`;
    for(const v in STRATEGISCH){
      const d = STRATEGISCH[v], n = vb.zahl[v], w = vb.wirksam[v];
      h += `<div class="posten-zeile ${n?"":"erschoepft"}">
        <div class="rumpf">
          <div class="bezeichnung" style="color:${n?d.farbe:"var(--matt)"}">${d.name}
            <span class="stufe">${n} besiedelt${n>w?` · ${w} wirksam`:""}</span></div>
          <div class="erlaeuterung">${n ? d.wirkung
            : "Vorkommen auf: " + d.vorkommenAuf.map(t=>OBJEKTE[t]?.name||t).join(", ")}</div></div>
        <div class="zahl" style="color:${n?d.farbe:"var(--schwach)"}">${w}/${d.maxStufen}</div></div>`;
    }
    if(spiel.missionen.length){
      h += `<div class="rubrik"><h2>Unterwegs</h2>
        <span class="zusatz">${spiel.missionen.length} Flüge</span></div>`;
      for(const m of spiel.missionen){
        const sym = FLUG_SYMBOL[m.art] || FLUG_SYMBOL.erkunden;
        const rest = (m.endeAb - Date.now())/1000;
        const ziel = (m.art === "sammeln" || m.art === "besiedeln")
          ? spiel.objekte[m.ziel].name : spiel.systeme[m.nachSys].name;
        const flotte = Object.keys(m.schiffe).filter(t=>m.schiffe[t])
          .map(t=>`${m.schiffe[t]} ${SCHIFFE[t].name}`).join(", ") || "—";
        h += `<div class="posten-zeile">
          <svg width="26" height="26" viewBox="-6 -6 12 12" style="flex:none">
            ${sym.form(0,0,0)}</svg>
          <div class="rumpf">
            <div class="bezeichnung">${sym.name}
              <span class="stufe">${m.phase==="rueck"?"Rückflug":"nach "+ziel}</span></div>
            <div class="erlaeuterung">${flotte}</div></div>
          <div class="zahl" style="color:${sym.farbe}">${zeitText(rest*TEMPO)}</div></div>`;
      }
    }
    /* Legende der Ressourcenzeichen. Tooltips helfen auf dem Handy nicht,
       deshalb gehört die Zuordnung einmal ausgeschrieben ins Spiel. */
    h += `<div class="rubrik"><h2>Ressourcenzeichen</h2>
      <span class="zusatz">im Streifen oben</span></div>
      <div class="flaeche"><div style="display:flex;flex-wrap:wrap;gap:9px 18px">`;
    for(const r of RES)
      h += `<span style="display:flex;align-items:center;gap:6px;color:var(--${r});font-size:12.5px">
        ${resSymbol(r, 15)}<span style="color:var(--matt)">${RES_NAMEN[r]}</span></span>`;
    h += `<span style="display:flex;align-items:center;gap:6px;color:var(--forschung);font-size:12.5px">
        ${resSymbol("forschung", 15)}<span style="color:var(--matt)">Forschung</span></span>`;
    for(const t in SELTEN)
      h += `<span style="display:flex;align-items:center;gap:6px;color:${SELTEN[t].farbe};font-size:12.5px">
        <svg width="15" height="15" viewBox="-8 -8 16 16" class="res-sym">${SELTEN[t].symbol}</svg>
        <span style="color:var(--matt)">${SELTEN[t].name}</span></span>`;
    h += `</div></div>`;

    h += `<div class="rubrik"><h2>Ablesen</h2><span class="zusatz">Ein System anklicken zum Öffnen</span></div>
      <div class="flaeche"><div class="erlaeuterung">
      Erkundete Systeme zeigen ihren Stern, unerkundete einen grauen Punkt. Ein Ring markiert eigene
      Kolonien, rote Beschriftung Piraten. Gestrichelte Linien sind Flugbahnen unterwegs befindlicher
      Flotten.</div></div>`;
  }
  return h;
}

/* ------------------------------------------------------------
   Symbole für unterwegs befindliche Flotten.
   Jede Missionsart bekommt eine eigene Form, damit man sie auch
   ohne Beschriftung auseinanderhält.
   ------------------------------------------------------------ */
const FLUG_SYMBOL = {
  erkunden:  { farbe:"var(--signal)",     name:"Sonde",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <circle cx="0" cy="0" r="1.5" fill="none" stroke="var(--signal)" stroke-width="0.5"/>
      <path d="M-2.6 0 L2.6 0 M0 -2.6 L0 2.6" stroke="var(--signal)" stroke-width="0.4"/></g>` },
  besiedeln: { farbe:"var(--nahrung)",    name:"Siedlerschiff",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <path d="M3 0 L-2 2 L-1 0 L-2 -2 Z" fill="var(--nahrung)"/></g>` },
  foerdern:  { farbe:"var(--signal)",     name:"Förderflotte",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <rect x="-2.6" y="-1.4" width="5" height="2.8" rx="0.6" fill="var(--signal)"/>
      <circle cx="2.8" cy="0" r="0.9" fill="var(--signal)"/></g>` },
  sammeln:   { farbe:"var(--kupfer)",     name:"Frachter",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <rect x="-2.2" y="-1.4" width="4.4" height="2.8" rx="0.5" fill="var(--kupfer)"/>
      <path d="M2.2 0 L3.4 0" stroke="var(--kupfer)" stroke-width="0.6"/></g>` },
  angriff:   { farbe:"var(--alarm)",      name:"Kampfflotte",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <path d="M3.4 0 L-2.4 2.4 L-1 0 L-2.4 -2.4 Z" fill="var(--alarm)"/>
      <path d="M-1 0 L-3.4 0" stroke="var(--alarm)" stroke-width="0.5"/></g>` },
  invasion:  { farbe:"var(--bernstein)", name:"Invasionsflotte",
    form:(x,y,w)=>`<g transform="translate(${x} ${y}) rotate(${w})">
      <path d="M3.2 0 L-2 2 L-2 -2 Z" fill="var(--bernstein)"/>
      <rect x="-3.4" y="-1.2" width="1.6" height="2.4" rx="0.4" fill="var(--bernstein)"/></g>` },
};

// Zeichnet alle laufenden Flüge zwischen den Systemen
function flugbahnen(){
  let out = "";
  const jetzt = Date.now();
  for(const m of spiel.missionen){
    const a = spiel.systeme[m.vonSys], b = spiel.systeme[m.nachSys];
    if(!a || !b || a.id === b.id) continue;
    const sym = FLUG_SYMBOL[m.art] || FLUG_SYMBOL.erkunden;

    // Anteil des zurückgelegten Weges
    const gesamt = m.endeAb - m.startAb;
    let t = gesamt > 0 ? (jetzt - m.startAb) / gesamt : 1;
    t = Math.max(0, Math.min(1, t));
    // Auf dem Rückflug läuft die Bewegung andersherum
    const von = m.phase === "rueck" ? b : a;
    const nach = m.phase === "rueck" ? a : b;

    const x = von.x + (nach.x - von.x) * t;
    const y = von.y + (nach.y - von.y) * t;
    const winkel = Math.atan2(nach.y - von.y, nach.x - von.x) * 180 / Math.PI;

    out += `<line x1="${von.x}" y1="${von.y}" x2="${nach.x}" y2="${nach.y}"
        stroke="${sym.farbe}" stroke-width="0.35" stroke-dasharray="2 2" opacity=".45"/>
      <line x1="${von.x}" y1="${von.y}" x2="${x}" y2="${y}"
        stroke="${sym.farbe}" stroke-width="0.45" opacity=".8"/>
      <circle cx="${x}" cy="${y}" r="3.4" fill="${sym.farbe}" opacity=".14"/>
      ${sym.form(x, y, winkel)}`;
  }
  return out;
}

function galaxieKarte(){
  let linien = "", punkte = "";
  const eigene = new Set();
  for(const id in spiel.kolonien) eigene.add(spiel.objekte[id].systemId);
  for(const s of spiel.systeme)
    if(eigene.has(s.id) && s.id !== 0)
      linien += `<line x1="${s.x}" y1="${s.y}" x2="${spiel.systeme[0].x}" y2="${spiel.systeme[0].y}"
                  stroke="var(--kante)" stroke-width="0.35" stroke-dasharray="1.4 1.6"/>`;
  for(const s of spiel.systeme){
    const anzKol = s.objekte.filter(o => spiel.kolonien[o]).length;
    const offen = spiel.offenesSystem === s.id;
    punkte += `<g class="punkt" data-system="${s.id}">
      ${offen?`<circle cx="${s.x}" cy="${s.y}" r="7" fill="none" stroke="var(--bernstein)" stroke-width="0.4" opacity=".8"/>`:""}
      ${anzKol?`<circle cx="${s.x}" cy="${s.y}" r="5.2" fill="none" stroke="var(--signal)" stroke-width="0.55"/>`:""}
      ${s.erkundet ? (() => {
        const st = STERNE[s.stern] || STERNE.gelber_stern;
        const r = 2.4 + st.groesse*1.6;          // Darstellungsgrösse nach Sterntyp
        return `<image href="${st.bild}" x="${s.x-r}" y="${s.y-r}"
          width="${r*2}" height="${r*2}" preserveAspectRatio="xMidYMid meet"/>`;
      })() : `<circle cx="${s.x}" cy="${s.y}" r="3" fill="#33485f"/>`}
      <text x="${s.x}" y="${s.y+7.8}" text-anchor="middle" font-size="3.1" font-weight="600"
        fill="${s.erkundet?"var(--text)":"var(--schwach)"}">${s.erkundet?s.name:"unbekannt"}</text>
      ${s.erkundet?`<text x="${s.x}" y="${s.y+11.6}" text-anchor="middle" font-size="2.5"
        fill="${s.piraten?"var(--alarm)":"var(--matt)"}">${s.piraten
          ? PIRATEN_ARTEN[s.piraten.art].name+" · "+piratenAnzahl(s)
          : s.objekte.length+" Objekte"+(anzKol?" · "+anzKol+" besiedelt":"")}</text>`:""}
    </g>`;
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    ${linien}${flugbahnen()}${punkte}</svg>`;
}

function systemKarte(sys){
  if(!sys.erkundet){
    const frei = flotteFrei("sonde");
    return `<div style="padding:16px">
      <div class="bezeichnung">${sys.name} — unerkundet</div>
      <div class="erlaeuterung">Eine Sonde deckt auf, welche Objekte hier liegen. ${frei} Sonden bereit.</div>
      <button data-sonde="${sys.id}" ${frei<1?"disabled":""} style="margin-top:11px">
        ${frei<1?"Keine Sonde verfügbar":"Sonde senden"}</button></div>`;
  }
  const sd = STERNE[sys.stern] || STERNE.gelber_stern;
  let kopf = `<div style="padding:12px 14px 2px;display:flex;gap:11px;align-items:center;flex-wrap:wrap">
    <img src="${sd.bild}" width="34" height="34" alt="" style="flex:none">
    <div><div class="bezeichnung">${sys.name} <span class="stufe">${sd.name}</span></div>
      <div class="erlaeuterung">${sd.beschreibung}</div></div></div>`;
  if(sys.piraten){
    const art = PIRATEN_ARTEN[sys.piraten.art];
    const feindStaerke = piratenStaerke(sys);
    // Alle kampffähigen Schiffe, auch die neuen schweren und die Beuteschiffe
    const kampftypen = Object.keys(SCHIFFE).filter(t => (SCHIFFE[t].angriff||0) > 0);

    // Eigene Kampfkraft und wie gut sie zur gegnerischen Mischung passt
    let eigen = 0, eigenAnzahl = 0;
    for(const t of kampftypen){
      const n = flotteFrei(t); if(!n) continue;
      eigenAnzahl += n;
      let schnitt = 0, ziele = 0;
      for(const ft in sys.piraten.flotte){
        schnitt += (konterZeile(t)?.[ft] || 1) * sys.piraten.flotte[ft];
        ziele += sys.piraten.flotte[ft];
      }
      const passung = ziele ? schnitt/ziele : 1;
      eigen += n * ((SCHIFFE[t].angriff||0)*passung + (SCHIFFE[t].panzerung||0)*0.5);
    }

    const feindListe = Object.keys(sys.piraten.flotte)
      .map(t => `${sys.piraten.flotte[t]} ${SCHIFFE[t].name}`).join(" · ");
    const eigenListe = kampftypen.filter(t=>flotteFrei(t)>0)
      .map(t => `${flotteFrei(t)} ${SCHIFFE[t].name}`).join(" · ") || "keine Kampfschiffe";

    const verhaeltnis = eigen / Math.max(1, feindStaerke);
    const lage = verhaeltnis >= 1.4 ? "gut" : verhaeltnis >= 0.9 ? "" : "rot";
    const urteil = eigenAnzahl === 0 ? "Bauen Sie zuerst Kampfschiffe."
      : verhaeltnis < 0.7 ? "Aussichtslos — die Flotte würde aufgerieben."
      : verhaeltnis < 0.9 ? "Unterlegen. Ein Sieg ist unwahrscheinlich."
      : verhaeltnis < 1.4 ? "Ausgeglichen. Der Ausgang ist offen."
      : "Überlegen. Der Sieg sollte gelingen.";

    // Welcher eigene Typ trifft diesen Gegner am besten?
    let bester = null, besterWert = 0;
    for(const t of kampftypen){
      let schnitt = 0, ziele = 0;
      for(const ft in sys.piraten.flotte){
        schnitt += (konterZeile(t)?.[ft] || 1) * sys.piraten.flotte[ft];
        ziele += sys.piraten.flotte[ft];
      }
      const w = ziele ? schnitt/ziele : 1;
      if(w > besterWert){ besterWert = w; bester = t; }
    }

    kopf = `<div style="padding:13px 14px 4px">
      <div class="meldung rot" style="margin-top:0">
        <strong>${art.name} in ${sys.name}</strong> · ${piratenAnzahl(sys)} Schiffe
        · Stärke <span class="zahl">${z0(feindStaerke)}</span><br>
        <span style="color:var(--matt)">${art.beschreibung}</span><br>
        <span style="color:var(--matt)">Verband: ${feindListe}</span><br>
        <span style="color:var(--schwach)">${art.geschichte}</span></div>
      <div class="meldung ${lage}">
        Ihre Flotte: ${eigenListe} · gewichtete Stärke <span class="zahl">${z0(eigen)}</span><br>
        ${urteil}${bester && besterWert > 1.15
          ? ` <span style="color:var(--signal)">${SCHIFFE[bester].name} sind gegen diesen Verband besonders wirksam (×${besterWert.toFixed(2)}).</span>` : ""}
        <br><span style="color:var(--bernstein)">${art.antwort}</span>
        ${art.verhalten === "wechselnd"
          ? `<br><span style="color:var(--schwach)">Die Aufstellung ändert sich bei jedem
             Zusammentreffen — eine gezielte Vorbereitung ist nicht möglich.</span>` : ""}
      </div>
      ${art.verhalten === "angebot"
        ? `<div class="erlaeuterung">Die Kartellflotte greift nicht an. Ein Gefecht ist
           möglich, aber sie ist auch als Handelspartner zu haben.</div>` : ""}
      ${aufstellungTafel(Object.fromEntries(kampftypen.map(t=>[t,flotteFrei(t)])))}
      <button data-angriff="${sys.id}" ${eigenAnzahl<=0?"disabled":""} style="margin-top:9px">
        ${eigenAnzahl<=0?"Keine Flotte":"Gesamte Flotte entsenden"}</button></div>`;
  }
  const stern = STERNE[sys.stern] || STERNE.gelber_stern;
  const sr = 7 * stern.groesse;          // Darstellungsradius nach Sterntyp
  let inhalt = `
    <image href="${stern.bild}" x="${50-sr}" y="${50-sr}" width="${sr*2}" height="${sr*2}"
      preserveAspectRatio="xMidYMid meet"/>`;

  /* --- Etappe 31b: Monde kreisen um ihre Planeten -----------------
     Monde bekommen keine eigene Bahn um den Stern mehr, sondern hängen
     als Trabanten am nächstgelegenen Planeten ihres Systems. Gibt es
     keinen Planeten (reines Habitatsystem), bleibt der Mond auf einer
     eigenen Bahn — sonst hinge er im Leeren. */
  const monde = {}, haupt = [];
  const planeten = sys.objekte.filter(id => {
    const t = OBJEKTE[spiel.objekte[id].typ];
    return t.art === "planet" && spiel.objekte[id].typ !== "mond";
  });
  sys.objekte.forEach(id => {
    if(spiel.objekte[id].typ === "mond" && planeten.length){
      // Monde reihum den Planeten zuordnen, damit sie sich verteilen
      const mutter = planeten[Object.keys(monde).length ?
        (Object.values(monde).flat().length % planeten.length) : 0];
      (monde[mutter] = monde[mutter] || []).push(id);
    }else haupt.push(id);
  });

  /* Bahnabstände so wählen, dass die äusserste Bahn samt Beschriftung
     im Bild bleibt — vorher liefen weite Bahnen aus dem Rahmen. */
  const n = haupt.length;
  const innen = 15 + sr*0.9;
  const MAX_BAHN = 41;
  const schritt = n > 1 ? Math.min(10.2, (MAX_BAHN - innen)/(n-1)) : 0;

  let texte = "";   // Beschriftungen in eigener Schicht, immer im Vordergrund

  haupt.forEach((objId, i) => {
    const o = spiel.objekte[objId], def = OBJEKTE[o.typ];
    const bahn = innen + i*schritt;
    // Winkel so verteilen, dass sich benachbarte Objekte nicht überlagern
    const winkel = 0.55 + i*2.399;
    const x = 50 + Math.cos(winkel)*bahn, y = 50 + Math.sin(winkel)*bahn*0.55;
    const kolonie = !!spiel.kolonien[objId];
    const gr = def.art === "planet" ? 4.0 : 3.2;     // Radius der Darstellung
    const bild = BILDER[o.typ];

    inhalt += `<ellipse cx="50" cy="50" rx="${bahn}" ry="${bahn*0.55}" fill="none"
                stroke="var(--kante)" stroke-width="0.2" opacity=".55"/>
      <g class="punkt" data-objekt="${objId}">
        ${spiel.auswahl===objId?`<circle cx="${x}" cy="${y}" r="${gr+2.4}" fill="none"
            stroke="var(--bernstein)" stroke-width="0.45"/>`:""}
        ${kolonie?`<circle cx="${x}" cy="${y}" r="${gr+1.3}" fill="none"
            stroke="var(--signal)" stroke-width="0.5"/>`:""}
        ${o.fraktion?`<circle cx="${x}" cy="${y}" r="${gr+1.3}" fill="none"
            stroke="${PARTEIEN[o.fraktion].farbe}" stroke-width="0.5"
            stroke-dasharray="1.6 1.2"/>`:""}`;

    if(bild){
      inhalt += `<image href="${bild}" x="${x-gr}" y="${y-gr}"
          width="${gr*2}" height="${gr*2}" preserveAspectRatio="xMidYMid meet"/>`;
    }else{
      inhalt += `<circle cx="${x}" cy="${y}" r="${gr*0.8}" fill="${def.farbe}"
          ${def.art==="habitat"?'stroke="var(--text)" stroke-width="0.28" stroke-dasharray="1 0.9"':""}/>`;
    }
    inhalt += `</g>`;

    // Beschriftung IMMER unterhalb des Objekts, in der Vordergrund-Schicht
    const ty = y + gr + 3.6;
    texte += `<text x="${x}" y="${ty}" text-anchor="middle" font-size="2.9"
        font-weight="600" fill="var(--text)" stroke="#060b13" stroke-width="0.9"
        paint-order="stroke" stroke-linejoin="round">${o.name}</text>
      <text x="${x}" y="${ty+3.4}" text-anchor="middle" font-size="2.4"
        fill="${o.fraktion ? PARTEIEN[o.fraktion].farbe : "var(--matt)"}"
        stroke="#060b13" stroke-width="0.8"
        paint-order="stroke" stroke-linejoin="round">${o.fraktion
          ? PARTEIEN[o.fraktion].kurz : def.name}</text>`;

    // --- Trabanten dieses Planeten ---
    (monde[objId]||[]).forEach((mondId, mi) => {
      const mo = spiel.objekte[mondId];
      const mBahn = gr + 2.8 + mi*2.1;
      const mWinkel = 0.9 + mi*2.1;
      const mx = x + Math.cos(mWinkel)*mBahn, my = y + Math.sin(mWinkel)*mBahn*0.6;
      const mKol = !!spiel.kolonien[mondId];
      const mgr = 1.5;
      inhalt += `<ellipse cx="${x}" cy="${y}" rx="${mBahn}" ry="${mBahn*0.6}" fill="none"
          stroke="var(--kante)" stroke-width="0.16" opacity=".5"/>
        <g class="punkt" data-objekt="${mondId}">
          ${spiel.auswahl===mondId?`<circle cx="${mx}" cy="${my}" r="${mgr+1.4}" fill="none"
              stroke="var(--bernstein)" stroke-width="0.4"/>`:""}
          ${mKol?`<circle cx="${mx}" cy="${my}" r="${mgr+0.8}" fill="none"
              stroke="var(--signal)" stroke-width="0.4"/>`:""}
          ${BILDER.mond
            ? `<image href="${BILDER.mond}" x="${mx-mgr}" y="${my-mgr}" width="${mgr*2}"
                height="${mgr*2}" preserveAspectRatio="xMidYMid meet"/>`
            : `<circle cx="${mx}" cy="${my}" r="${mgr*0.85}" fill="${OBJEKTE.mond.farbe}"/>`}
        </g>`;
      /* Mondnamen nur bei Auswahl oder eigener Kolonie — dauerhaft
         beschriftet kollidieren sie mit dem Namen ihres Planeten. Der
         Name erscheint beim Anklicken ohnehin in der Objekttafel. */
      if(spiel.auswahl === mondId || mKol)
        texte += `<text x="${mx}" y="${my+mgr+2.6}" text-anchor="middle" font-size="2.0"
            fill="var(--matt)" stroke="#060b13" stroke-width="0.7"
            paint-order="stroke" stroke-linejoin="round">${mo.name}</text>`;
    });
  });

  // Textschicht zuletzt: Namen liegen über allen Bahnen und Scheiben,
  // fangen aber keine Klicks ab
  inhalt += `<g style="pointer-events:none">${texte}</g>`;

  return kopf + `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inhalt}</svg>`;
}

/* ------------------------------------------------------------
   Seite: Kolonien
   ------------------------------------------------------------ */
function seiteKolonie(g){
  const ids = Object.keys(spiel.kolonien);
  if(!ids.length) return `<div class="flaeche">Noch keine Kolonie. Besiedeln Sie ein Objekt über die Karte.</div>`;
  if(!spiel.kolonien[spiel.auswahl]) spiel.auswahl = +ids[0];

  let h = `<div class="unterreiter" style="margin-top:0">`;
  for(const id of ids){
    const k = spiel.kolonien[id];
    h += `<button data-kolonie="${id}" class="${+spiel.auswahl===+id?"an":""}">
      ${spiel.objekte[id].name}${k.bau?" ·":""}</button>`;
  }
  h += `</div>` + objektTafel(+spiel.auswahl, g, true);
  return h;
}

// Zeigt Bewohnbarkeit, Besonderheiten und ein etwaiges Vorkommen
function weltEigenschaften(obj, def){
  const vk = obj.vorkommen ? STRATEGISCH[obj.vorkommen] : null;
  const hinweise = [];
  const bew = def.ohneBevoelkerung ? 0 : (def.bewohnbarkeit != null ? def.bewohnbarkeit : 1);
  hinweise.push(`Bewohnbarkeit ${Math.round(bew*100)} %`);
  if(def.ohneBevoelkerung) hinweise.push("keine Bewohner möglich — reiner Automatikbetrieb");
  if(def.zaehltNicht)      hinweise.push("zählt gegen keine Höchstzahl");
  if(def.distriktKosten)   hinweise.push(`Distrikte ${Math.round((def.distriktKosten-1)*100)} % teurer`);

  let h = `<div class="erlaeuterung" style="margin-top:9px">${hinweise.join(" · ")}</div>`;
  if(vk){
    h += `<div class="meldung gut" style="border-left-color:${vk.farbe}">
      <strong style="color:${vk.farbe}">Vorkommen: ${vk.name}</strong><br>
      <span style="color:var(--matt)">${vk.beschreibung}</span><br>
      ${vk.wirkung} — gilt reichsweit, sobald diese Welt besiedelt ist.</div>`;
  }
  return h;
}

/* Ressourcencluster eines Systems. Zeigt Restvorrat, verbleibende Standzeit
   und die geschätzte Förderdauer mit der verfügbaren Flotte — damit die
   Entscheidung "welchen Cluster zuerst" auf Zahlen beruht und nicht auf Gefühl. */
function clusterTafel(sysId){
  const liste = clusterImSystem(sysId);
  if(!liste.length) return "";
  let h = `<div class="rubrik"><h2>Ressourcencluster</h2>
    <span class="zusatz">${liste.length} vorhanden</span></div>`;

  for(const c of liste){
    const d = CLUSTER_ARTEN[c.art];
    const rest = (c.bisAb - Date.now())/1000;
    const anteil = c.vorrat / c.anfangsvorrat;
    const laeuft = spiel.missionen.find(m => m.art === "foerdern" && m.ziel === c.id);
    const frei = flotteFrei("foerderschiff");
    const dauer = frei ? c.vorrat / (frei * SCHIFFE.foerderschiff.foerderrate) * 3600 : 0;
    const ergibt = d.gibtSelten
      ? Object.keys(d.gibtSelten).map(t => SELTEN[t].name).join(" und ")
      : Object.keys(d.gibt).map(r => RES_NAMEN[r]).join(" und ");

    h += `<div class="posten-zeile"><div class="rumpf">
      <div class="bezeichnung" style="color:${d.farbe}">${d.name}
        <span class="stufe">${z0(c.vorrat)} übrig</span></div>
      <div class="erlaeuterung">${d.text}<br>
        Ergibt ${ergibt}. Löst sich auf in <span class="zahl">${zeitText(rest*TEMPO)}</span>.
        ${frei ? `Mit ${frei} Förderschiffen dauert der Abbau
          <span class="zahl">${zeitText(dauer)}</span>.`
               : `<span style="color:var(--bernstein)">Keine Förderschiffe verfügbar.</span>`}
        ${dauer > rest*TEMPO ? `<br><span style="color:var(--bernstein)">Die Zeit reicht nicht
          für den ganzen Vorrat — der Rest bleibt ungehoben.</span>` : ""}</div>
      ${fortschrittBalken(anteil*100, 100)}</div>
      ${laeuft
        ? `<span class="stufe" style="color:var(--signal)">Förderung läuft</span>`
        : `<button data-cluster="${c.id}" ${frei?"":"disabled"}>Förderflotte senden</button>`}</div>`;
  }
  return h;
}

/* Offene Entscheidungen und Warnungen — steht ganz oben, damit man es
   beim Öffnen sieht und nicht im Berichtsstapel suchen muss. */
function lageTafel(){
  let h = "";

  // --- Angekündigter Überfall ---
  const u = spiel.ueberfall;
  if(u && spiel.objekte[u.ziel]){
    const rest = (u.faelligAb - Date.now())/1000;
    let abwehr = eigeneGarnison(u.ziel) * 12;
    for(const t in spiel.schiffe) abwehr += flotteFrei(t) * ((SCHIFFE[t].angriff||0) + (SCHIFFE[t].panzerung||0)*0.5);
    const gegner = u.staerke * PIRAT_STAERKE_JE_PUNKT;
    const reicht = abwehr >= gegner;
    h += `<div class="meldung ${reicht?"gut":"rot"}" style="margin-bottom:10px">
      <strong>${PIRATEN_ARTEN[u.verband].name} kündigt einen Zugriff an</strong> —
      Ziel: ${spiel.objekte[u.ziel].name}, in ${zeitText(rest*TEMPO)}<br>
      <span style="color:var(--matt)">Abwehrkraft vor Ort
        <span class="zahl">${z0(abwehr)}</span> gegen <span class="zahl">${z0(gegner)}</span>.
        ${reicht ? "Die Verteidigung sollte halten."
                 : "Zu schwach — holen Sie Flotten zurück, sonst werden Vorräte geplündert."}</span><br>
      <span style="color:var(--schwach)">Anlagen, Distrikte und Bevölkerung sind nie betroffen.</span></div>`;
  }

  // --- Offenes Ereignis ---
  const e = spiel.ereignis;
  if(e && EREIGNISSE[e.art]){
    const d = EREIGNISSE[e.art];
    const rest = (e.offenBis - Date.now())/1000;
    h += `<div class="flaeche" style="margin-bottom:10px;border-left:3px solid var(--bernstein)">
      <div class="rubrik" style="margin-top:0"><h2>${d.name}</h2>
        <span class="zusatz">Frist ${zeitText(rest*TEMPO)}</span></div>
      <div class="erlaeuterung" style="margin-bottom:8px">${d.text}</div>`;
    d.wahl.forEach((w,i)=>{
      const geht = !w.kosten || bezahlbar(w.kosten);
      h += `<div class="posten-zeile"><div class="rumpf">
        <div class="bezeichnung">${w.text}</div>
        <div class="erlaeuterung">${w.hinweis||""}</div>
        ${w.kosten?`<div class="werte">${kostenZeile(w.kosten,0)}</div>`:""}</div>
        <button data-ereignis="${i}" ${geht?"":"disabled"}>Wählen</button></div>`;
    });
    h += `<div class="erlaeuterung" style="margin-top:6px;color:var(--schwach)">
      Läuft die Frist ab, wird von selbst die folgenlose Möglichkeit gewählt.
      Verpassen kostet nur den möglichen Gewinn.</div></div>`;
  }
  return h;
}

/* Aufstellung einer Flotte nach Zonen — als Balken plus Klartext.
   Ohne diese Anzeige bliebe die Zonenwirkung unsichtbar, und der
   Spieler verlöre Flotten, ohne den Grund zu erkennen. */
function aufstellungTafel(flotte){
  const je = { front:0, mitte:0, hinten:0 };
  let gesamt = 0;
  for(const t in flotte){
    const n = flotte[t]; if(!n) continue;
    je[zoneVon(t)] += n; gesamt += n;
  }
  if(!gesamt) return "";

  const farben = { front:"var(--alarm)", mitte:"var(--bernstein)", hinten:"var(--signal)" };
  let balken = `<div style="display:flex;height:9px;border-radius:2px;overflow:hidden;
    border:1px solid var(--kante);margin:5px 0">`;
  for(const z of ["front","mitte","hinten"]){
    if(!je[z]) continue;
    balken += `<div style="width:${(je[z]/gesamt*100).toFixed(1)}%;background:${farben[z]}"></div>`;
  }
  balken += `</div>`;

  const text = ["front","mitte","hinten"].filter(z=>je[z])
    .map(z=>`<span style="color:${farben[z]}">${ZONEN[z].name}: ${je[z]}</span>`).join(" · ");

  // Die eigentliche Warnung: ohne Front zieht das Hinterland alles Feuer
  const deckung = deckungsgrad(flotte);
  let hinweis = "";
  if(deckung < 0.4 && (je.hinten + je.mitte) > 0)
    hinweis = `<div style="color:var(--alarm);margin-top:3px">Zu wenig vordere Linie
      (Deckung ${Math.round(deckung*100)} %) — das Feuer trifft die schweren Schiffe
      fast ungebremst.</div>`;
  else if(je.front / gesamt > 0.85)
    hinweis = `<div style="color:var(--bernstein);margin-top:3px">Fast nur vordere Linie —
      viel Deckung, wenig Durchschlagskraft.</div>`;
  else
    hinweis = `<div style="color:var(--matt);margin-top:3px">Deckung
      ${Math.round(deckung*100)} % — die hinteren Schiffe sind entsprechend geschützt.</div>`;

  return `<div class="erlaeuterung">Aufstellung: ${text}${balken}${hinweis}</div>`;
}

/* Lagebild vor einer Invasion.
   Zeigt Garnison, Gelände, eigene Truppen und ein ehrliches Urteil —
   dieselbe Machart wie die Piratentafel im System, damit der Spieler
   nicht zwei verschiedene Sprachen lernen muss. */
/* ------------------------------------------------------------
   Blaupausen  (Etappe 26)
   Die Anzeige gehört zur Mechanik, nicht zur Ausstattung: Wer nicht
   sieht, dass ihm ein Stück von vier fehlt, hat keinen Grund
   weiterzusuchen. Unbekannte Bauarten bleiben verdeckt — man erfährt
   von einem Schiff dadurch, dass man ihm begegnet.
   ------------------------------------------------------------ */
function blaupausenTafel(){
  let h = `<div class="rubrik"><h2>Blaupausen</h2>
    <span class="zusatz">Bergemarken <span class="zahl">${spiel.bergemarken||0}</span></span></div>`;

  h += `<div class="erlaeuterung" style="margin-bottom:8px">Erbeutete Baupläne der
    Piratenverbände. Man findet Stücke der Bauart, gegen die man gekämpft hat —
    doppelte Funde werden zu Bergemarken, mit denen sich ein fehlendes Stück
    kaufen lässt.</div>`;

  // Nach Verband gruppiert, damit die Herkunft ablesbar bleibt
  for(const vid in PIRATEN_ARTEN){
    const bauarten = Object.keys(BAUARTEN).filter(b => BAUARTEN[b].verband === vid);
    if(!bauarten.length) continue;
    const bekannt = !!spiel.gesehen[vid];
    h += `<div class="rubrik" style="margin-top:10px"><h2 style="font-size:12px">
      ${bekannt ? PIRATEN_ARTEN[vid].name : "Unbekannter Verband"}</h2></div>`;

    for(const b of bauarten){
      const d = BAUARTEN[b];
      const habe = fragmentStand(b), braucht = d.teile, fertig = bauartFertig(b);
      if(!bekannt){
        h += `<div class="posten-zeile"><div class="rumpf">
          <div class="bezeichnung" style="color:var(--schwach)">? ? ?
            <span class="stufe">${braucht} Teile</span></div>
          <div class="erlaeuterung">Noch keiner Bauart dieses Verbands begegnet.</div>
          </div></div>`;
        continue;
      }
      const felder = Array.from({length:braucht}, (_,i) =>
        `<span style="display:inline-block;width:13px;height:13px;margin-right:3px;
          border-radius:2px;border:1px solid ${i<habe?"var(--signal)":"var(--kante)"};
          background:${i<habe?"var(--signal)":"transparent"}"></span>`).join("");
      const preis = markenPreis(b);
      const kaufbar = !fertig && (spiel.bergemarken||0) >= preis;
      h += `<div class="posten-zeile"><div class="rumpf">
        <div class="bezeichnung">${d.name}
          <span class="stufe">${habe} / ${braucht}</span></div>
        <div style="margin:3px 0">${felder}</div>
        <div class="erlaeuterung">${d.kann}<br>
          <span style="color:var(--bernstein)">${d.kannNicht}</span></div></div>
        ${fertig
          ? `<span class="stufe" style="color:var(--signal)">Baubar</span>`
          : `<button data-fragment="${b}" ${kaufbar?"":"disabled"}>
              Stück kaufen (${preis})</button>`}</div>`;
    }
  }
  return h;
}

function invasionTafel(obj, sys){
  const gar = obj.garnison || {};
  const garAnzahl = truppenAnzahl(gar);
  const gelaende = gelaendeFaktor(obj.typ);
  const laeuft = spiel.missionen.find(m => m.art === "invasion" && m.ziel === obj.id);
  const z = zaehleKolonien();
  const def = OBJEKTE[obj.typ];
  const grenze = def.zaehltNicht ? false
    : def.art === "planet" ? z.planeten >= maxPlaneten() : z.habitate >= maxHabitate();

  let h = `<div class="rubrik"><h2>Bodenoffensive</h2>
    <span class="zusatz">Gelände ×${gelaende.toFixed(2)} für den Verteidiger</span></div>`;

  if(laeuft){
    const rest = (laeuft.endeAb - Date.now())/1000;
    const was = laeuft.phase === "belagerung" ? "Belagerung läuft"
              : laeuft.phase === "hin" ? "Invasionsflotte im Anflug" : "Rückflug";
    return h + `<div class="meldung">${was} — noch ${zeitText(rest*TEMPO)}.</div>`;
  }

  const garListe = Object.keys(gar).map(t => `${gar[t]} ${TRUPPEN[t].name}`).join(" · ") || "keine";
  const eigenListe = Object.keys(TRUPPEN).filter(t=>truppenFrei(t)>0)
    .map(t => `${truppenFrei(t)} ${TRUPPEN[t].name}`).join(" · ") || "keine Truppen";

  // Wie gut passt die eigene Mischung zu dieser Garnison?
  let eigen = 0, eigenAnzahl = 0, bester = null, besterWert = 0;
  for(const t in TRUPPEN){
    let schnitt = 0, ziele = 0;
    for(const ft in gar){ schnitt += (KONTER_BODEN[t]?.[ft] || 1) * gar[ft]; ziele += gar[ft]; }
    const passung = ziele ? schnitt/ziele : 1;
    if(passung > besterWert){ besterWert = passung; bester = t; }
    const n = truppenFrei(t); if(!n) continue;
    eigenAnzahl += n;
    eigen += n * ((TRUPPEN[t].angriff||0)*passung + (TRUPPEN[t].panzerung||0)*0.5);
  }
  // Die Belagerung nimmt der Garnison vorher einen Teil ab
  const feindStaerke = truppenStaerke(gar) * gelaende * (1 - BELAGERUNG_ZERMUERBUNG);
  const verhaeltnis = eigen / Math.max(1, feindStaerke);

  const schiffeNoetig = Math.ceil(eigenAnzahl / TRUPPEN_JE_LANDUNGSSCHIFF);
  const schiffeDa = flotteFrei("landungsschiff");
  const mitnehmen = Math.min(eigenAnzahl, schiffeDa * TRUPPEN_JE_LANDUNGSSCHIFF);
  const orbitFrei = !sys.piraten;

  const lage = verhaeltnis >= 1.4 ? "gut" : verhaeltnis >= 0.9 ? "" : "rot";
  const urteil = eigenAnzahl === 0 ? "Bilden Sie zuerst Truppen in einer Kaserne aus."
    : verhaeltnis < 0.7 ? "Aussichtslos — die Landung würde zerschlagen."
    : verhaeltnis < 0.9 ? "Unterlegen. Ein Durchbruch ist unwahrscheinlich."
    : verhaeltnis < 1.4 ? "Ausgeglichen. Der Ausgang ist offen."
    : "Überlegen. Die Welt sollte zu nehmen sein.";

  const hindernisse = [];
  if(!orbitFrei) hindernisse.push("Der Orbit ist nicht frei — erst den Piratenverband schlagen.");
  if(schiffeDa < 1) hindernisse.push("Keine Landungsschiffe. Ohne Transport keine Landung.");
  if(eigenAnzahl < 1) hindernisse.push("Keine Truppen bereit.");
  if(grenze) hindernisse.push(`Höchstzahl erreicht — eine eroberte Welt zählt wie eine besiedelte.`);

  h += `<div class="meldung rot" style="margin-top:0">
      <strong>Garnison von ${obj.name}</strong> · ${garAnzahl} Verbände
      · Stärke <span class="zahl">${z0(truppenStaerke(gar)*gelaende)}</span><br>
      <span style="color:var(--matt)">Aufstellung: ${garListe}</span><br>
      <span style="color:var(--matt)">Belagerung vor dem Sturm:
        ${zeitText(belagerungsdauer(obj.id))} — sie zermürbt die Garnison um
        ${Math.round(BELAGERUNG_ZERMUERBUNG*100)} %.</span></div>
    <div class="meldung ${lage}">
      Ihre Truppen: ${eigenListe} · gewichtete Stärke <span class="zahl">${z0(eigen)}</span><br>
      ${urteil}${bester && besterWert > 1.15
        ? ` <span style="color:var(--signal)">${TRUPPEN[bester].name} sind gegen diese
            Garnison besonders wirksam (×${besterWert.toFixed(2)}).</span>` : ""}<br>
      <span style="color:var(--matt)">Transport: ${schiffeDa} Landungsschiffe
        (${schiffeNoetig} nötig für alle Truppen) — mitgenommen würden ${mitnehmen} Verbände.</span></div>`;

  if(hindernisse.length)
    h += `<div class="meldung">${hindernisse.join("<br>")}</div>`;

  h += `<div class="erlaeuterung" style="margin:8px 0">Eine Eroberung kostet
    ${Math.abs(BEZIEHUNG_INVASION)} Punkte Beziehung zu ${PARTEIEN[obj.fraktion].kurz}.
    Ab −60 wird jeder Handel verweigert.</div>
    <button data-invasion="${obj.id}"
      ${(hindernisse.length)?"disabled":""}>
      ${hindernisse.length ? "Invasion nicht möglich" : "Invasion starten"}</button>`;
  return h;
}

function objektTafel(objId, g, mitReitern){
  const obj = spiel.objekte[objId], def = OBJEKTE[obj.typ];
  const kolonie = spiel.kolonien[objId];
  const sys = spiel.systeme[obj.systemId];

  // ----- Fremde Welt: Handelsmenü statt Besiedlung -----
  if(!kolonie && obj.fraktion){
    handelPruefen();
    const d = PARTEIEN[obj.fraktion];
    const dip = diploStand(obj.fraktion);
    const hd = spiel.handel[obj.id];
    const rest = hd ? (hd.bisAb - Date.now())/1000 : 0;
    const gesperrt = dip.wert <= -60;

    let felder = "";
    for(const dd in obj.felder)
      felder += `<div class="mess"><div class="k">${DISTRIKTE[dd].name}</div>
                 <div class="v">${obj.felder[dd]}</div></div>`;

    let h2 = `<div class="flaeche" style="border-left:2px solid ${d.farbe}">
      <div class="weltkopf">
        ${scheibe(obj.typ, 88)}
        <div class="weltdaten">
          <div class="gattung" style="color:${d.farbe}">${d.name}</div>
          <div class="name">${obj.name}</div>
          <div class="lage">${def.name} · System ${sys.name}
            · ${(STERNE[sys.stern]||STERNE.gelber_stern).name}</div>
          <div class="lage">Diese Welt ist bewohnt und lässt sich nicht besiedeln.</div>
        </div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;
           gap:10px;margin-top:12px;flex-wrap:wrap">
        <span>Beziehung: <strong style="color:${dip.stufe.farbe}">${dip.stufe.name}</strong></span>
        <span class="zahl" style="color:${dip.stufe.farbe}">${dip.wert > 0 ? "+" : ""}${dip.wert}</span>
      </div>
      <div class="schiene" style="margin-top:6px">
        <i style="width:${(dip.wert - BEZIEHUNG_MIN) / (BEZIEHUNG_MAX - BEZIEHUNG_MIN) * 100}%;
           background:${dip.stufe.farbe}"></i></div>
      <div class="erlaeuterung" style="margin-top:8px">${d.beschreibung}</div>
      ${d.risiko?`<div class="meldung">Etwa ${Math.round(d.risiko*100)} % der Lieferungen
        dieser Partei kommen nicht an. Die Bezahlung ist dann trotzdem weg.</div>`:""}
      <div class="messwerte" style="margin-top:12px">${felder}</div>
    </div>`;

    h2 += invasionTafel(obj, sys);

    h2 += `<div class="rubrik"><h2>Handelsangebote</h2>
      <span class="zusatz">${gesperrt ? "gesperrt" : "wechselt in " + zeitText(rest*TEMPO)}</span></div>`;

    if(gesperrt){
      h2 += `<div class="meldung rot">${d.kurz} verweigert jeden Handel.
        Die Beziehung muss sich erst bessern.</div>`;
    }else{
      let offen = 0;
      (hd?.angebote || []).forEach((a, i) => {
        if(a.weg) return;
        offen++;
        const machbar = (spiel.res[a.will] || 0) >= a.preis;
        const gibtName = a.gibt === "forschung" ? "Forschung" : RES_NAMEN[a.gibt];
        h2 += `<div class="posten-zeile">
          <div class="rumpf">
            <div class="bezeichnung" style="color:${d.farbe}">${z0(a.menge)} ${gibtName}</div>
            <div class="erlaeuterung">im Tausch gegen
              <span class="zahl" style="color:${machbar?"var(--text)":"var(--bernstein)"}">
                ${z0(a.preis)} ${RES_NAMEN[a.will]}</span>
              · vorrätig ${z0(spiel.res[a.will]||0)}</div></div>
          <button data-handel="${obj.id}" data-nr="${i}" ${machbar?"":"disabled"}>
            ${machbar?"Tauschen":"Zu wenig"}</button></div>`;
      });
      if(!offen)
        h2 += `<div class="flaeche"><div class="erlaeuterung">Ausverkauft.
          Neue Ware in ${zeitText(rest*TEMPO)}.</div></div>`;
    }
    return h2;
  }

  // ----- Nicht besiedelt -----
  if(!kolonie){
    const kosten = kolonieKosten(objId);
    const z = zaehleKolonien();
    const grenze = def.art === "planet" ? z.planeten >= maxPlaneten() : z.habitate >= maxHabitate();
    let felder = "";
    for(const d in obj.felder)
      felder += `<div class="mess"><div class="k">${DISTRIKTE[d].name}</div>
                 <div class="v">${obj.felder[d]}</div></div>`;
    const vk = obj.vorkommen ? STRATEGISCH[obj.vorkommen] : null;
    return `<div class="flaeche">
      <div class="weltkopf">
        ${scheibe(obj.typ, 88)}
        <div class="weltdaten">
          <div class="gattung">${def.name}${def.art==="habitat"?" · Habitat":""}</div>
          <div class="name">${obj.name}</div>
          <div class="lage">System ${sys.name} · ${(STERNE[sys.stern]||STERNE.gelber_stern).name}
            · ${def.beschreibung}</div>
        </div>
      </div>
      ${weltEigenschaften(obj, def)}
      <div class="messwerte">${felder}</div>
      <div class="werte" style="margin-top:13px">${kostenZeile(kosten, null)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:11px">
        <button data-kolonisieren="${objId}" ${kannKolonisieren(objId)?"":"disabled"}>
          ${grenze?(def.art==="planet"?"Planetengrenze erreicht":"Habitatgrenze erreicht")
            :sys.piraten?"Piraten im System"
            :flotteFrei("siedlerschiff")<1?"Kein Siedlerschiff":"Besiedeln"}</button>
        <button class="still" data-sammeln="${objId}" ${flotteFrei("frachter")<1?"disabled":""}>
          ${flotteFrei("frachter")<1?"Keine Frachter":`Sammeln mit ${flotteFrei("frachter")} Frachtern`}</button>
      </div>
      ${grenze?`<div class="meldung">Die Grenze lässt sich unter Forschung anheben.</div>`:""}
      <div class="erlaeuterung" style="margin-top:9px">Frachter holen hier ${FRACHTER_KAPAZITAET} Einheiten
        je Schiff — auch ohne Kolonie.</div>
    </div>`;
  }

  // ----- Besiedelt -----
  const k = kolonie, z = g.je[objId];
  const bisPop = z.wachstumProStunde > 0
    ? zeitText((z.wachstumsziel - k.wachstum)/z.wachstumProStunde*3600/TEMPO) : "—";

  let meldungen = "";
  if(g.hunger) meldungen += `<div class="meldung rot">Hungersnot im Reich — die Bevölkerung schrumpft. Mehr Nahrung erzeugen.</div>`;
  if(z.wohnraum === 0) meldungen += `<div class="meldung">Kein Wohnraum. ${def.art==="habitat"?"Habitatmodul":"Wohnkomplex"} bauen, sonst bleibt die Kolonie unbewohnt.</div>`;
  else if(z.bev >= z.wohnraum) meldungen += `<div class="meldung">Wohnraum erschöpft — hier wächst niemand mehr nach.</div>`;
  if(z.frei > 0) meldungen += `<div class="meldung">${z.frei} Bewohner ohne Aufgabe. Jede Zuweisung bringt 10 % mehr Ertrag.</div>`;

  let h = `<div class="flaeche" style="margin-top:12px">
    <div class="weltkopf">
      ${scheibe(obj.typ, 88)}
      <div class="weltdaten">
        <div class="gattung">${def.name}${def.art==="habitat"?" · Habitat":""}</div>
        <div class="name">${obj.name}</div>
        <div class="lage">System ${sys.name} · ${(STERNE[sys.stern]||STERNE.gelber_stern).name}
          · ${def.beschreibung}</div>
      </div>
    </div>
    ${weltEigenschaften(obj, def)}
    <div class="messwerte">
      <div class="mess"><div class="k">Bewohner</div>
        <div class="v ${z.wohnraum&&z.bev>=z.wohnraum?"warn":""}">${z.bev} / ${z.wohnraum}</div></div>
      <div class="mess"><div class="k">Zugewiesen</div><div class="v">${z.zugewiesen}</div></div>
      <div class="mess"><div class="k">Zuwachs in</div><div class="v">${bisPop}</div></div>
      <div class="mess"><div class="k">Lagerbeitrag</div><div class="v">${z0(z.lager)}</div></div>
    </div>
    ${meldungen}</div>`;

  if(k.bau){
    const name = k.bau.art === "distrikt" ? DISTRIKTE[k.bau.schluessel].name
               : GEBAEUDE[k.bau.schluessel].name + " → Stufe " + (k.gebaeude[k.bau.schluessel]+1);
    const rest = (k.bau.fertigAb-Date.now())/1000;
    h += `<div class="vorgang" style="margin-top:10px">
      <div class="zeile1"><strong>Im Bau · ${name}</strong>
        <span class="rest">${zeitText(rest*TEMPO)}</span></div>
      ${fortschrittBalken(rest, k.bau.dauer)}</div>`;
  }

  // Unterreiter der Kolonie
  const t = spiel.kolonieTab;
  h += `<div class="unterreiter">
    <button data-koltab="uebersicht" class="${t==="uebersicht"?"an":""}">Übersicht</button>
    <button data-koltab="distrikte" class="${t==="distrikte"?"an":""}">Distrikte</button>
    <button data-koltab="gebaeude" class="${t==="gebaeude"?"an":""}">Gebäude</button>
  </div>`;

  if(t === "uebersicht"){
    h += `<div class="rubrik"><h2>Was diese Kolonie beisteuert</h2>
      <span class="zusatz">je Stunde</span></div>`;
    if(!z.beitrag.length)
      h += `<div class="flaeche"><div class="erlaeuterung">Noch nichts gebaut.
