<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aussenposten — Etappe 5</title>
<style>
  :root{
    /* Leitstand-Palette: tiefes Vakuum, Stahlblau, Signalfarben */
    --raum:#060b13; --konsole:#0e1826; --konsole2:#152337; --kante:#23384f;
    --kante-hell:#31506f;
    --text:#dae5f1; --matt:#7b93ac; --schwach:#4d647c;
    --signal:#56d6c6; --bernstein:#f0a63c; --alarm:#e2635c;
    --energiezellen:#f0cf4a; --erz:#dd8b64; --silikat:#9fb0c2; --kupfer:#e08048;
    --nahrung:#87cf85; --wasserstoff:#77c2e8; --kohlenstoff:#93939f; --legierung:#cbaf66;
    --forschung:#b58ce8;
    --daten:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:
      /* Galaxienebel — mehrere weiche Farbwolken übereinander */
      radial-gradient(1000px 620px at 18% 8%,  rgba(64,116,178,.30) 0%, transparent 62%),
      radial-gradient(760px 520px at 84% 22%, rgba(150,80,190,.24) 0%, transparent 60%),
      radial-gradient(900px 700px at 62% 78%, rgba(38,150,160,.18) 0%, transparent 64%),
      radial-gradient(520px 420px at 8% 72%,  rgba(200,110,70,.13) 0%, transparent 62%),
      linear-gradient(178deg, #070d18 0%, #0a1120 45%, #060a13 100%);
    background-attachment:fixed;
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  .zahl,.daten{font-family:var(--daten);font-variant-numeric:tabular-nums}

  /* Sternenfeld: liegt hinter allem, bewegt sich beim Scrollen leicht mit */
  #sterne{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-repeat:repeat;
  }
  #sterne.nah{opacity:.9}
  #sterne.fern{opacity:.55}

  /* Planetenbilder bekommen einen leisen Lichtsaum statt eines Kastens */
  .weltbild{
    object-fit:contain;
    filter:drop-shadow(0 0 14px rgba(120,180,230,.16)) drop-shadow(0 3px 9px rgba(0,0,0,.6));
  }

  /* ---------- Kopfleiste, klebt beim Scrollen ---------- */
  .kopf{
    position:sticky; top:0; z-index:30;
    background:rgba(10,17,28,.93);
    backdrop-filter:blur(9px);
    border-bottom:1px solid var(--kante);
  }
  .kopfinhalt{max-width:960px;margin:0 auto;padding:9px 12px 0}
  .marke{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .marke h1{
    font-size:16px;margin:0;letter-spacing:.28em;text-transform:uppercase;font-weight:600;
  }
  .marke .kennung{font-family:var(--daten);font-size:10.5px;color:var(--schwach);letter-spacing:.09em}

  /* Ressourcenstreifen — waagerecht scrollbar statt umbrechend */
  .streifen{
    display:flex;gap:7px;overflow-x:auto;padding:9px 0 10px;
    scrollbar-width:none;
  }
  .streifen::-webkit-scrollbar{display:none}
  .posten{
    flex:0 0 auto;min-width:96px;
    background:var(--konsole);border:1px solid var(--kante);border-radius:6px;
    padding:5px 9px 6px;position:relative;overflow:hidden;
  }
  .posten::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ton)}
  .posten .etikett{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--matt);
                   white-space:nowrap}
  .posten .stand{font-family:var(--daten);font-size:15px;font-weight:600;line-height:1.3}
  .posten .fluss{font-family:var(--daten);font-size:10.5px;color:var(--signal);white-space:nowrap}
  .posten .fluss.minus{color:var(--alarm)}

  /* ---------- Hauptnavigation ---------- */
  .nav{display:flex;gap:0;border-top:1px solid var(--kante);overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{
    flex:1 0 auto;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--matt);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:600;padding:11px 15px;border-radius:0;white-space:nowrap;
  }
  .nav button.an{color:var(--text);border-bottom-color:var(--signal)}
  .nav button .zeiger{
    display:inline-block;min-width:16px;margin-left:6px;padding:0 5px;border-radius:9px;
    background:var(--konsole2);color:var(--signal);font-family:var(--daten);font-size:10px;
    letter-spacing:0;
  }
  .nav button .zeiger.warn{background:#3a2410;color:var(--bernstein)}

  main{max-width:960px;margin:0 auto;padding:15px 12px 0}

  /* ---------- Überschriften ---------- */
  .rubrik{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
    margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--kante);
  }
  .rubrik h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--matt);
             margin:0;font-weight:600}
  .rubrik .zusatz{font-size:12px;color:var(--schwach)}

  /* ---------- Flächen ---------- */
  .flaeche{background:rgba(14,24,38,.82);border:1px solid var(--kante);border-radius:9px;padding:14px 15px}
  .karte{background:rgba(10,17,28,.62);border:1px solid var(--kante);border-radius:9px;padding:5px;
         overflow:hidden;position:relative}
  .karte svg{display:block;width:100%;height:auto;touch-action:manipulation}
  .punkt{cursor:pointer}
  .punkt:hover circle:last-of-type{filter:brightness(1.25)}

  /* Brotkrumen */
  .pfad{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px;
        font-size:12px;color:var(--schwach)}
  .pfad button{background:var(--konsole);border:1px solid var(--kante);color:var(--matt);
               font-size:12px;font-weight:400;padding:4px 10px;letter-spacing:.04em}
  .pfad button:hover{color:var(--text);border-color:var(--kante-hell)}

  /* Untergeordnete Reiter */
  .unterreiter{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 0}
  .unterreiter button{
    background:var(--konsole);border:1px solid var(--kante);color:var(--matt);
    font-size:12.5px;font-weight:400;padding:6px 13px;letter-spacing:.04em;
  }
  .unterreiter button.an{background:var(--konsole2);border-color:var(--signal);color:var(--text)}

  /* ---------- Kolonie-Kopf mit Planetenscheibe ---------- */
  .weltkopf{display:flex;gap:15px;align-items:flex-start;flex-wrap:wrap}
  .scheibe{flex:none;width:88px;height:88px}
  .weltdaten{flex:1 1 220px;min-width:0}
  .weltdaten .name{font-size:19px;font-weight:600;letter-spacing:.02em}
  .weltdaten .gattung{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--signal)}
  .weltdaten .lage{font-size:13px;color:var(--matt);margin-top:5px}

  .messwerte{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:14px}
  .mess{border-left:2px solid var(--kante);padding-left:9px}
  .mess .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--matt)}
  .mess .v{font-family:var(--daten);font-size:16px;font-weight:600}
  .mess .v.warn{color:var(--bernstein)} .mess .v.rot{color:var(--alarm)}

  /* ---------- Meldungen ---------- */
  .meldung{font-size:12.5px;padding:8px 11px;border-radius:6px;margin-top:7px;
           background:#2a2110;border-left:2px solid var(--bernstein)}
  .meldung.rot{background:#2c1719;border-left-color:var(--alarm)}
  .meldung.gut{background:#0f2a2b;border-left-color:var(--signal)}

  /* ---------- Listenzeilen ---------- */
  .posten-zeile{
    background:var(--konsole);border:1px solid var(--kante);border-radius:8px;
    padding:11px 13px;margin-bottom:7px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  }
  .posten-zeile:hover{border-color:var(--kante-hell)}
  .posten-zeile.erschoepft{opacity:.45}
  .posten-zeile .rumpf{flex:1 1 230px;min-width:0}
  .bezeichnung{font-weight:600;font-size:14.5px}
  .stufe{font-family:var(--daten);color:var(--signal);font-weight:400;font-size:13px}
  .erlaeuterung{font-size:12.5px;color:var(--matt);margin-top:2px}
  .werte{font-family:var(--daten);font-size:11.5px;margin-top:5px;display:flex;gap:11px;
         flex-wrap:wrap;color:var(--schwach)}
  .werte .fehlt{color:var(--bernstein)}

  /* Balkenanzeige für Felderauslastung */
  .felder{display:flex;gap:2px;margin-top:6px}
  .felder i{flex:1;height:4px;background:var(--konsole2);border-radius:1px;max-width:16px}
  .felder i.belegt{background:var(--signal)}

  /* Zuweisungsregler */
  .regler{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--matt);
          background:var(--konsole2);border:1px solid var(--kante);border-radius:7px;padding:3px 5px}
  .regler b{font-family:var(--daten);color:var(--text);min-width:13px;text-align:center;font-size:13px}
  .regler button{padding:1px 8px;font-size:14px;background:var(--raum);color:var(--text);
                 border:1px solid var(--kante);font-weight:600;border-radius:5px;line-height:1.3}
  .regler button:disabled{opacity:.28}

  /* ---------- Knöpfe ---------- */
  button{
    font:inherit;font-size:13.5px;padding:8px 15px;border-radius:7px;cursor:pointer;border:none;
    background:var(--signal);color:#04211f;font-weight:600;letter-spacing:.04em;
    transition:filter .12s ease;
  }
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:disabled{background:var(--konsole2);color:var(--schwach);cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--bernstein);outline-offset:2px}
  button.still{background:var(--konsole2);color:var(--text);border:1px solid var(--kante)}
  button.forsch{background:var(--forschung);color:#160d27}

  /* ---------- Laufende Vorgänge ---------- */
  .vorgang{background:var(--konsole2);border:1px solid var(--kante-hell);border-radius:8px;
           padding:11px 13px;margin-bottom:8px}
  .vorgang .zeile1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .vorgang .rest{font-family:var(--daten);font-size:12.5px;color:var(--signal)}
  .schiene{height:4px;background:var(--raum);border-radius:2px;overflow:hidden;margin-top:8px}
  .schiene i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--kante-hell))}

  .fuss{max-width:960px;margin:34px auto 0;padding:0 12px;font-size:11.5px;color:var(--schwach);
        display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .fuss button{background:none;border:1px solid var(--kante);color:var(--matt);font-size:11.5px;
               padding:5px 11px;font-weight:400}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="sterne" class="fern"></div>
<div id="sterne2" class="nah" style="position:fixed;inset:0;z-index:-1;pointer-events:none"></div>

<header class="kopf">
  <div class="kopfinhalt">
    <div class="marke">
      <h1>Aussenposten</h1>
      <span class="kennung" id="kennung"></span>
    </div>
    <div class="streifen" id="streifen"></div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<main id="buehne"></main>

<div class="fuss">
  <span>Der Spielstand liegt im Browser dieses Geräts.</span>
  <button id="reset">Neu anfangen</button>
</div>

<script>
/* ============================================================
   0. STELLSCHRAUBEN
   ============================================================ */
const TEMPO = 1;
const TESTSTART = true;          // true = alle Gebäude auf Maximalstufe, Lager voll
const NAHRUNG_PRO_KOPF = 10;     // je Bewohner und Stunde
const BONUS_PRO_KOPF = 0.10;     // +10 % Ertrag je zugewiesener Person
const MAX_ZUWEISUNG = 5;         // höchstens 5 Personen je Distriktgruppe / Gebäude
const KOSTEN_STEIGERUNG = 1.30;  // Gebäudestufe: 30 % teurer
const ERTRAG_STEIGERUNG = 1.20;  // Gebäudestufe: 20 % mehr Ertrag
const START_MAX_PLANETEN = 5;
const START_MAX_HABITATE = 5;
const FRACHTER_KAPAZITAET = 400;   // Ladung je Frachter und Sammelmission
const KAMPF_RUNDEN = 8;            // Höchstzahl der Gefechtsrunden
const SCHADEN_STREUUNG = 0.15;     // ±15 % Zufall auf den Rundenschaden
const SCHADEN_FAKTOR = 0.90;       // dämpft den Rundenschaden — kleiner = längere Gefechte
const PANZER_ZU_LEBEN = 7;         // wie viel Widerstandskraft ein Punkt Panzerung gibt

/* Kontertabelle: Was richtet die Zeile gegen die Spalte aus?
   Über 1 = stark dagegen, unter 1 = schwach.
   Jäger sind zu wendig für schwere Geschütze, reissen aber schwere
   Schiffe auf. Korvetten fangen Jäger ab. Kreuzer zermalmen Korvetten. */
const KONTER = {
  jaeger:   { jaeger:1.0, korvette:0.6, kreuzer:1.7, pirat:1.0 },
  korvette: { jaeger:1.8, korvette:1.0, kreuzer:0.7, pirat:1.1 },
  kreuzer:  { jaeger:0.5, korvette:1.6, kreuzer:1.0, pirat:1.2 },
  pirat:    { jaeger:1.1, korvette:1.0, kreuzer:0.9, pirat:1.0 },
};
const WOHNRAUM_JE_STUFE = 10;
const LAGER_JE_STUFE = 2000;

/* ============================================================
   0b. EIGENE BILDER
   Trage hier den Dateinamen ein, sobald du ein Bild hast.
   Leer lassen = die gezeichnete Scheibe wird verwendet.
   Beispiel:  ozean: "bilder/ozean.png",
   Die Bilder gehören in einen Ordner "bilder" neben diese Datei.
   Empfohlen: quadratisch, 512×512, PNG mit durchsichtigem Hintergrund.
   ============================================================ */
const BILDER = {
  ozean:            "bilder/ozean.webp",
  vulkan:           "bilder/vulkan.webp",
  fels:             "bilder/fels.webp",
  eis:              "bilder/eis.webp",
  gasriese:         "bilder/gasriese.webp",
  wasserstoffwolke: "",
  erzguertel:       "bilder/erzguertel.webp",
  photonenwolke:    "",
  methanwolke:      "",
  antike:           "",
};

/* ============================================================
   0c. STERNTYPEN
   Vorerst rein optisch: Jedes System bekommt beim Erzeugen einen
   Typ mit gleicher Wahrscheinlichkeit. Die Felder "wirkung" sind
   schon angelegt, werden aber noch nirgends ausgewertet — dort
   kommen später Einflüsse auf Planetenverteilung und Erträge hin.
   ============================================================ */
const STERNE = {
  gelber_stern:    { name:"Gelber Hauptreihenstern", bild:"bilder/stern-gelber-stern.webp",
                     farbe:"#f5d76e", groesse:1.00,
                     beschreibung:"Stabil und mittelwarm — der Normalfall.", wirkung:{} },
  oranger_riese:   { name:"Oranger Riese", bild:"bilder/stern-oranger-riese.webp",
                     farbe:"#e08a3c", groesse:1.35,
                     beschreibung:"Aufgeblähter alter Stern mit weiter Hülle.", wirkung:{} },
  roter_zwerg:     { name:"Roter Zwerg", bild:"bilder/stern-roter-zwerg.webp",
                     farbe:"#d4553a", groesse:0.70,
                     beschreibung:"Klein, kühl und langlebig. Der häufigste Sterntyp.", wirkung:{} },
  roter_ueberriese:{ name:"Roter Überriese", bild:"bilder/stern-roter-ueberriese.webp",
                     farbe:"#a83c28", groesse:1.60,
                     beschreibung:"Gewaltig und instabil, dem Ende nahe.", wirkung:{} },
  blauer_riese:    { name:"Blauer Riese", bild:"bilder/stern-blauer-riese.webp",
                     farbe:"#8fc4f5", groesse:1.30,
                     beschreibung:"Heiß, hell und kurzlebig. Strahlt gewaltig.", wirkung:{} },
  weisser_zwerg:   { name:"Weißer Zwerg", bild:"bilder/stern-weisser-zwerg.webp",
                     farbe:"#dce8f5", groesse:0.45,
                     beschreibung:"Ausgebrannter Kern, dicht und winzig.", wirkung:{} },
  brauner_zwerg:   { name:"Brauner Zwerg", bild:"bilder/stern-brauner-zwerg.webp",
                     farbe:"#7a4a35", groesse:0.60,
                     beschreibung:"Ein verhinderter Stern. Glimmt nur.", wirkung:{} },
  neutronenstern:  { name:"Neutronenstern", bild:"bilder/stern-neutronenstern.webp",
                     farbe:"#c9a3f0", groesse:0.55,
                     beschreibung:"Überrest einer Sternexplosion. Unfassbar dicht.", wirkung:{} },
};

/* ============================================================
   1. RESSOURCEN
   ============================================================ */
const RES = ["energiezellen","erz","silikat","kupfer","nahrung","wasserstoff","kohlenstoff","legierung"];
const RES_NAMEN = {
  energiezellen:"Energiezellen", erz:"Erz", silikat:"Silikat", kupfer:"Kupfer",
  nahrung:"Nahrung", wasserstoff:"Wasserstoff", kohlenstoff:"Kohlenstoff",
  legierung:"Legierung", forschung:"Forschung"
};

/* ============================================================
   2. DISTRIKTE — keine Stufen. Mehr davon bauen, nicht ausbauen.
   ============================================================ */
const DISTRIKTE = {
  solarfarm:      { name:"Solarfarm",      gruppe:"allgemein", produziert:{energiezellen:150}, kosten:{erz:50, silikat:25} },
  eisenmine:      { name:"Eisenmine",      gruppe:"allgemein", produziert:{erz:100},           kosten:{erz:100, silikat:20} },
  silikatmine:    { name:"Silikatmine",    gruppe:"allgemein", produziert:{silikat:70},        kosten:{erz:50, silikat:70} },
  kupfermine:     { name:"Kupfermine",     gruppe:"allgemein", produziert:{kupfer:50},         kosten:{erz:150, silikat:100} },
  landwirtschaft: { name:"Landwirtschaftsdistrikt", gruppe:"allgemein", produziert:{nahrung:25}, kosten:{erz:50, silikat:10} },

  wasserkraftwerk:{ name:"Wasserkraftwerk", gruppe:"spezial", produziert:{energiezellen:300},  kosten:{erz:25, silikat:25, kupfer:10} },
  fischfarm:      { name:"Fischfarm",       gruppe:"spezial", produziert:{nahrung:75},         kosten:{erz:50, silikat:10} },
  thermalkraftwerk:{name:"Thermalkraftwerk",gruppe:"spezial", produziert:{energiezellen:500},  kosten:{erz:50, silikat:25, kupfer:50} },
  wasserstoffextraktor:{name:"Wasserstoffextraktor", gruppe:"spezial", produziert:{wasserstoff:100}, kosten:{erz:100, silikat:50, kupfer:20} },
  methanextraktor:{ name:"Methanextraktor", gruppe:"spezial", produziert:{kohlenstoff:50},     kosten:{erz:150, silikat:50, kupfer:20} },
  forschungsdistrikt:{name:"Forschungsdistrikt", gruppe:"spezial", produziert:{forschung:5},   kosten:{erz:100, silikat:50, kupfer:50} },
};

/* ============================================================
   3. GEBÄUDE — mit Stufen. Pro Stufe 30 % teurer, 20 % mehr Ertrag.
   Je Kolonie höchstens eines von jeder Sorte.
   ============================================================ */
const GEBAEUDE = {
  lagerhalle:   { name:"Lagerhalle", maxLevel:20, startLevel:1,
                  beschreibung:"Schafft Platz für Ressourcen. Steht auf jeder neuen Kolonie bereits auf Stufe 1.",
                  lager:LAGER_JE_STUFE, kosten:{erz:100, silikat:50} },
  wohnkomplex:  { name:"Wohnkomplex", maxLevel:10, startLevel:1,
                  beschreibung:"Stellt Wohnraum zur Verfügung. Ohne Wohnraum wächst niemand nach.",
                  wohnraum:WOHNRAUM_JE_STUFE, kosten:{energiezellen:150, erz:100, silikat:50} },
  laborkomplex: { name:"Laborkomplex", maxLevel:10, startLevel:0,
                  beschreibung:"Produziert Forschung.",
                  produziert:{forschung:10}, kosten:{energiezellen:150, erz:100, silikat:100, kupfer:100} },
  giesserei:    { name:"Legierungsgießerei", maxLevel:10, startLevel:0,
                  beschreibung:"Produziert Legierung.",
                  produziert:{legierung:20}, kosten:{energiezellen:50, erz:200, silikat:100, kupfer:20} },
  filteranlage: { name:"Kohlenstoff-Filteranlage", maxLevel:15, startLevel:0,
                  beschreibung:"Produziert Kohlenstoff.",
                  produziert:{kohlenstoff:10}, kosten:{erz:50, silikat:30} },
  habitatmodul: { name:"Habitatmodul", maxLevel:10, startLevel:0,
                  beschreibung:"Druckkabinen im Vakuum. Der einzige Wohnraum ausserhalb von Planeten.",
                  wohnraum:6, kosten:{energiezellen:200, erz:150, silikat:100, kupfer:40} },
  werft:        { name:"Werft", maxLevel:10, startLevel:0,
                  beschreibung:"Baut Schiffe. Je höher die Stufe, desto schneller. Nur auf Planeten.",
                  kosten:{energiezellen:300, erz:400, silikat:200, kupfer:100} },
};

/* ============================================================
   3b. SCHIFFE — als Stückzahlen, nicht als Einzelobjekte
   ============================================================ */
/* ============================================================
   3c. PIRATENVERBÄNDE — jeder Typ kämpft anders
   ============================================================ */
const PIRATEN_ARTEN = {
  schmuggler: { name:"Schmugglerring",
                beschreibung:"Viele kleine, schnelle Schiffe. Reich, aber schlecht gepanzert.",
                mischung:{ jaeger:0.75, korvette:0.25, kreuzer:0 },
                beute:1.4, wachstum:0.06 },
  freibeuter: { name:"Freibeuterflotte",
                beschreibung:"Ausgewogener Verband aus Jägern und Korvetten.",
                mischung:{ jaeger:0.45, korvette:0.45, kreuzer:0.10 },
                beute:1.0, wachstum:0.09 },
  kriegsherr: { name:"Kriegsherr",
                beschreibung:"Wenige, aber schwere Schiffe. Harte Nuss.",

/* ============================================================
   6. KARTE ERZEUGEN
   ============================================================ */
const SYSNAMEN = ["Kaldar","Veyra","Thessa","Orun","Mirak","Sevesh","Dalun","Aphex",
                  "Rhoven","Nemea","Calyx","Ostara","Tirith","Vandu","Halix","Zoran"];
const ROEM = ["I","II","III","IV","V","VI"];
function rnd(){ return Math.random(); }
function zwischen(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function waehle(liste){ return liste[Math.floor(rnd()*liste.length)]; }

function karteErzeugen(){
  const planetTypen  = Object.keys(OBJEKTE).filter(t => OBJEKTE[t].art === "planet");
  const habitatTypen = Object.keys(OBJEKTE).filter(t => OBJEKTE[t].art === "habitat");
  const systeme = [], objekte = {};
  const namen = [...SYSNAMEN];
  let objId = 0;

  for(let i=0;i<9;i++){
    const ring = i===0 ? 0 : 1 + Math.floor((i-1)/4);
    const winkel = rnd()*Math.PI*2;
    const radius = i===0 ? 0 : ring*27 + rnd()*9;
    const name = namen.splice(Math.floor(rnd()*namen.length),1)[0];
    // Sterntyp: gleiche Chance für alle
    const sternTypen = Object.keys(STERNE);
    const sys = { id:i, name, x:50+Math.cos(winkel)*radius, y:50+Math.sin(winkel)*radius*0.62,
                  erkundet: i===0, objekte:[],
                  stern: sternTypen[Math.floor(rnd()*sternTypen.length)] };

    const anzahl = zwischen(3,6);
    for(let j=0;j<anzahl;j++){
      // Erstes Objekt im Heimatsystem ist immer ein Ozeanplanet — ein fairer Start
      let typ;
      if(i===0 && j===0) typ = "ozean";
      else typ = rnd() < 0.62 ? waehle(planetTypen) : waehle(habitatTypen);

      const def = OBJEKTE[typ], felder = {};
      for(const d in def.felder){
        const [min,max] = def.felder[d];
        felder[d] = zwischen(min,max);
      }
      objekte[objId] = { id:objId, systemId:i, typ, name:`${name} ${ROEM[j]}`, felder };
      sys.objekte.push(objId);
      objId++;
    }
    // Piratenlager — blockiert Besiedlung, bis es zerschlagen ist
    if(i === 0 || rnd() < 0.45){
      sys.piraten = null;
    }else{
      const arten = Object.keys(PIRATEN_ARTEN);
      const art = arten[Math.floor(rnd()*arten.length)];
      const staerke = 8 + Math.floor(rnd()*20) + ring*7;   // Schiffe insgesamt
      sys.piraten = { art, flotte: piratenFlotte(art, staerke) };
    }
    systeme.push(sys);
  }
  return { systeme, objekte };
}

/* ============================================================
   7. SPIELSTAND
   ============================================================ */
// Habitate dürfen vorerst ausschliesslich die Lagerhalle bauen
const HABITAT_GEBAEUDE = ["lagerhalle","habitatmodul"];
function erlaubteGebaeude(objId){
  const art = OBJEKTE[spiel.objekte[objId].typ].art;
  return art === "habitat" ? HABITAT_GEBAEUDE
       : Object.keys(GEBAEUDE).filter(s => s !== "habitatmodul");
}

function neueKolonie(objId, objekteMap){
  const karte = objekteMap || (typeof spiel !== "undefined" ? spiel.objekte : null);
  const art = (objId != null && karte) ? OBJEKTE[karte[objId].typ].art : "planet";
  const erlaubt = art === "habitat" ? HABITAT_GEBAEUDE : Object.keys(GEBAEUDE);
  const g = {};
  for(const s in GEBAEUDE)
    g[s] = !erlaubt.includes(s) ? 0 : (TESTSTART ? GEBAEUDE[s].maxLevel : GEBAEUDE[s].startLevel);
  const d = {};
  for(const s in DISTRIKTE) d[s] = 0;
  return { distrikte:d, gebaeude:g, bev:0, wachstum:0, zuweisung:{}, bau:null };
}

function neuesSpiel(){
  const k = karteErzeugen();
  const res = {};
  for(const r of RES) res[r] = TESTSTART ? 50000 : 800;
  const heimatId = k.systeme[0].objekte[0];
  const heimat = neueKolonie(heimatId, k.objekte);
  heimat.bev = 5;
  // Ein paar Startdistrikte, damit sofort etwas läuft
  heimat.distrikte.solarfarm = 2;
  heimat.distrikte.eisenmine = 2;
  heimat.distrikte.silikatmine = 1;
  heimat.distrikte.landwirtschaft = 2;

  const schiffe = {};
  for(const t in SCHIFFE) schiffe[t] = TESTSTART ? 20 : 0;
  return { systeme:k.systeme, objekte:k.objekte, res, forschung: TESTSTART ? 2000 : 0,
           schiffe, missionen:[], werftauftrag:null,
           kolonien:{ [heimatId]: heimat }, techs:{},
           sonde:null, kolonieflug:null,
           ansicht:"galaxie", offenesSystem:0, auswahl:heimatId,
           zuletzt:Date.now() };
}

let spiel = laden();
function laden(){
  try{
    const roh = localStorage.getItem("aussenposten8");
    if(!roh) return neuesSpiel();
    const s = JSON.parse(roh);
    if(!s.systeme || !s.objekte) return neuesSpiel();
    for(const id in s.kolonien){
      const k = s.kolonien[id];
      for(const d in DISTRIKTE) if(!(d in k.distrikte)) k.distrikte[d]=0;
      for(const g in GEBAEUDE)  if(!(g in k.gebaeude))  k.gebaeude[g]=0;
      if(!k.zuweisung) k.zuweisung = {};
    }
    if(!s.techs) s.techs = {};
    if(!s.schiffe) s.schiffe = {};
    for(const t in SCHIFFE) if(!(t in s.schiffe)) s.schiffe[t] = 0;
    if(!Array.isArray(s.missionen)) s.missionen = [];
    if(!("werftauftrag" in s)) s.werftauftrag = null;
    for(const sy of s.systeme){
      if(!sy.stern){
        const st = Object.keys(STERNE);
        sy.stern = st[Math.floor(Math.random()*st.length)];
      }
      if(!("piraten" in sy)) sy.piraten = null;
      // Alte Spielstände hatten nur eine Zahl — in einen Verband umwandeln
      if(typeof sy.piraten === "number")
        sy.piraten = sy.piraten > 0
          ? { art:"freibeuter", flotte: piratenFlotte("freibeuter", Math.max(6, Math.round(sy.piraten/60))) }
          : null;
    }
    for(const r of RES) if(!(r in s.res)) s.res[r]=0;
    return s;
  }catch(e){ return neuesSpiel(); }
}
function speichern(){ localStorage.setItem("aussenposten6", JSON.stringify(spiel)); }

/* ============================================================
   8. FORMELN
   ============================================================ */
function techStufe(id){ return spiel.techs[id] || 0; }
function techKosten(id){
  const t = TECHS[id];
  return Math.floor(t.kosten * Math.pow(t.steigerung, techStufe(id)));
}
function techVerfuegbar(id){
  const t = TECHS[id];
  return t.wiederholbar || techStufe(id) === 0;
}
function maxPlaneten(){ return START_MAX_PLANETEN + techStufe("kolonierecht"); }
function maxHabitate(){ return START_MAX_HABITATE + techStufe("habitattechnik"); }

// Gebäudewerte auf einer bestimmten Stufe
function gebaeudeErtrag(basis, level){
  return level <= 0 ? 0 : basis * Math.pow(ERTRAG_STEIGERUNG, level-1);
}
function gebaeudeKosten(s, zielLevel){
  const k = {}, basis = GEBAEUDE[s].kosten;
  for(const r in basis) k[r] = Math.floor(basis[r] * Math.pow(KOSTEN_STEIGERUNG, Math.max(0,zielLevel-1)));
  return k;
}
function distriktKosten(s){
  const f = techStufe("distriktbau") ? 0.8 : 1;
  const k = {};
  for(const r in DISTRIKTE[s].kosten) k[r] = Math.floor(DISTRIKTE[s].kosten[r]*f);
  return k;
}
function bauzeit(kosten){
  let s=0; for(const r in kosten) s += kosten[r];
  return Math.max(5, Math.floor(s/20));
}
function bezahlbar(k){ for(const r in k) if((spiel.res[r]||0) < k[r]) return false; return true; }
function abbuchen(k){ for(const r in k) spiel.res[r] -= k[r]; }

function zaehleKolonien(){
  let planeten=0, habitate=0;
  for(const id in spiel.kolonien)
    OBJEKTE[spiel.objekte[id].typ].art === "planet" ? planeten++ : habitate++;
  return { planeten, habitate };
}

/* ============================================================
   9. EINE KOLONIE DURCHRECHNEN
   Gebäude und Distrikte produzieren von sich aus.
   Zugewiesene Bevölkerung gibt +10 % je Person auf diese Gruppe.
   ============================================================ */
function berechneKolonie(id){
  const k = spiel.kolonien[id], obj = spiel.objekte[id];
  const ein = {}; for(const r of RES) ein[r] = 0;
  let forschung = 0, wohnraum = 0, lager = 0;

  const beitrag = [];   // für die Anzeige

  for(const s in DISTRIKTE){
    const n = k.distrikte[s]; if(!n) continue;
    const zug = k.zuweisung["d:"+s] || 0;
    const f = 1 + zug*BONUS_PRO_KOPF;
    const posten = { schluessel:"d:"+s, name:DISTRIKTE[s].name, anzahl:n, zug, faktor:f, ertrag:{} };
    for(const r in DISTRIKTE[s].produziert){
      const menge = DISTRIKTE[s].produziert[r]*n*f;
      posten.ertrag[r] = menge;
      if(r === "forschung") forschung += menge; else ein[r] += menge;
    }
    beitrag.push(posten);
  }

  const erlaubt = erlaubteGebaeude(id);
  for(const s in GEBAEUDE){
    if(!erlaubt.includes(s)) continue;
    const lvl = k.gebaeude[s]; if(!lvl) continue;
    const g = GEBAEUDE[s];
    const zug = k.zuweisung["g:"+s] || 0;
    const f = 1 + zug*BONUS_PRO_KOPF;
    if(g.wohnraum) wohnraum += gebaeudeErtrag(g.wohnraum, lvl);
    if(g.lager)    lager    += gebaeudeErtrag(g.lager, lvl);
    if(g.produziert){
      const posten = { schluessel:"g:"+s, name:g.name, anzahl:lvl, zug, faktor:f, ertrag:{} };
      for(const r in g.produziert){
        const menge = gebaeudeErtrag(g.produziert[r], lvl)*f;
        posten.ertrag[r] = menge;
        if(r === "forschung") forschung += menge; else ein[r] += menge;
      }
      beitrag.push(posten);
    }
  }

  wohnraum = Math.floor(wohnraum);
  const bev = Math.floor(k.bev);
  ein.nahrung -= bev * NAHRUNG_PRO_KOPF;

  let zugewiesen = 0;
  for(const s in k.zuweisung) zugewiesen += k.zuweisung[s];
  const frei = Math.max(0, bev - zugewiesen);

  const platzAnteil = wohnraum > 0 ? Math.max(0, 1 - bev/wohnraum) : 0;
  const wachstumProStunde = 2500 * platzAnteil;
  const wachstumsziel = 100 + 40*bev;

  return { obj, typ:OBJEKTE[obj.typ], ein, forschung, wohnraum, lager, bev, frei, zugewiesen,
           beitrag, wachstumProStunde, wachstumsziel };
}

function berechneReich(){
  const ein = {}; for(const r of RES) ein[r] = 0;
  let forschung = 0, lager = 0, bev = 0;
  const je = {};
  for(const id in spiel.kolonien){
    const z = berechneKolonie(id);
    je[id] = z;
    for(const r of RES) ein[r] += z.ein[r];
    forschung += z.forschung; lager += z.lager; bev += z.bev;
  }
  const hunger = spiel.res.nahrung <= 0 && ein.nahrung < 0;
  return { ein, forschung, lagergrenze:Math.floor(lager), bev, je, hunger };
}

/* ============================================================
   10. ZEIT VERRECHNEN
   ============================================================ */
function fortschreiben(){
  const jetzt = Date.now();
  let sek = (jetzt - spiel.zuletzt)/1000 * TEMPO;
  spiel.zuletzt = jetzt;
  if(sek <= 0) return;

  while(sek > 0){
    const schritt = Math.min(sek, 60);
    sek -= schritt;
    const g = berechneReich();

    for(const r of RES)
      spiel.res[r] = Math.max(0, Math.min(g.lagergrenze, spiel.res[r] + g.ein[r]*schritt/3600));
    spiel.forschung += g.forschung*schritt/3600;

    for(const id in spiel.kolonien){
      const k = spiel.kolonien[id], z = g.je[id];
      let rate = z.wachstumProStunde;
      if(g.hunger) rate = -2500;
      k.wachstum += rate*schritt/3600;
      while(k.wachstum >= z.wachstumsziel){ k.wachstum -= z.wachstumsziel; k.bev += 1; }
      if(k.wachstum < 0){
        if(k.bev > 0){ k.bev -= 1; k.wachstum += z.wachstumsziel; entzieheZuweisung(id); }
        else k.wachstum = 0;
      }
      if(k.bau && jetzt >= k.bau.fertigAb){
        if(k.bau.art === "distrikt") k.distrikte[k.bau.schluessel] += 1;
        else k.gebaeude[k.bau.schluessel] += 1;
        k.bau = null;
      }
    }
    if(spiel.werftauftrag && jetzt >= spiel.werftauftrag.fertigAb){
      const t = spiel.werftauftrag.typ;
      spiel.schiffe[t] = (spiel.schiffe[t]||0) + 1;
      spiel.werftauftrag = null;
    }
    for(let i = spiel.missionen.length-1; i >= 0; i--){
      const m = spiel.missionen[i];
      if(jetzt < m.endeAb) continue;
      if(m.phase === "hin"){
        missionAuswerten(m);
        const uebrig = Object.values(m.schiffe).reduce((a,b)=>a+b,0);
        if(uebrig === 0 && !m.ladung){
          missionHeimkehr(m); spiel.missionen.splice(i,1);
        }else{
          m.phase = "rueck";
          m.endeAb = jetzt + m.dauer*1000/TEMPO;
        }
      }else{
        missionHeimkehr(m);
        spiel.missionen.splice(i,1);
      }
    }
    if(spiel.sonde && jetzt >= spiel.sonde.fertigAb){
      spiel.systeme[spiel.sonde.zielId].erkundet = true;
      spiel.sonde = null;
    }
    if(spiel.kolonieflug && jetzt >= spiel.kolonieflug.fertigAb){
      const zielId = spiel.kolonieflug.zielId;
      spiel.kolonien[zielId] = neueKolonie(zielId);
      spiel.auswahl = zielId;
      spiel.ansicht = "objekt";
      spiel.kolonieflug = null;
    }
  }
}
// Schrumpft die Bevölkerung, müssen Zuweisungen nachgeben
function entzieheZuweisung(id){
  const k = spiel.kolonien[id];
  let zug = 0; for(const s in k.zuweisung) zug += k.zuweisung[s];
  while(zug > Math.floor(k.bev)){
    const s = Object.keys(k.zuweisung).find(x => k.zuweisung[x] > 0);
    if(!s) break;
    k.zuweisung[s] -= 1; zug -= 1;
  }
}

/* ============================================================
   10b. WERFT UND FLOTTE
   ============================================================ */
function werftStufe(){
  let max = 0;
  for(const id in spiel.kolonien) max = Math.max(max, spiel.kolonien[id].gebaeude.werft || 0);
  return max;
}
function schiffBauzeit(typ){
  const w = werftStufe();
  return Math.max(3, Math.floor(SCHIFFE[typ].bauzeit / (1 + 0.25*Math.max(0, w-1))));
}
function schiffBauen(typ){
  if(spiel.werftauftrag || werftStufe() < 1) return;
  const kosten = SCHIFFE[typ].kosten;
  if(!bezahlbar(kosten)) return;
  abbuchen(kosten);
  const dauer = schiffBauzeit(typ);
  spiel.werftauftrag = { typ, dauer, fertigAb: Date.now()+dauer*1000/TEMPO };
  speichern(); zeichnen();
}

// Flugdauer zwischen dem nächsten eigenen System und einem Ziel
function flugdauer(sysId, faktor){
  const d = naechstesEigenesSystem(spiel.systeme[sysId]);
  return Math.max(10, Math.floor(d * faktor));
}
function flotteFrei(typ){ return spiel.schiffe[typ] || 0; }

function starteMission(art, ziel, schiffe){
  for(const t in schiffe) if(flotteFrei(t) < schiffe[t]) return false;
  for(const t in schiffe) spiel.schiffe[t] -= schiffe[t];
  const sysId = art === "sammeln" ? spiel.objekte[ziel].systemId : ziel;
  const dauer = flugdauer(sysId, art === "sammeln" ? 1.8 : 1.5);
  spiel.missionen.push({
    id: Date.now()+Math.floor(Math.random()*1000),
    art, ziel, schiffe, dauer, phase:"hin",
    endeAb: Date.now()+dauer*1000/TEMPO, bericht:null, ladung:null
  });
  speichern(); zeichnen();
  return true;
}

// Was ein Objekt beim Sammeln hergibt — abgeleitet aus seinen Feldern
function sammelErtrag(objId, frachter){
  const obj = spiel.objekte[objId];
  const quellen = {};
  for(const d in obj.felder){
    for(const r in DISTRIKTE[d].produziert){
      if(r === "forschung") continue;
      quellen[r] = (quellen[r]||0) + obj.felder[d];
    }
  }
  const summe = Object.values(quellen).reduce((a,b)=>a+b,0) || 1;
  const gesamt = frachter * FRACHTER_KAPAZITAET;
  const ladung = {};
  for(const r in quellen) ladung[r] = Math.floor(gesamt * quellen[r]/summe);
  return ladung;
}

/* ------------------------------------------------------------
   Rundenkampf
   Beide Seiten feuern gleichzeitig. Wieviel Schaden ein Typ
   anrichtet, hängt davon ab, auf wen er trifft — siehe KONTER.
   Verluste einer Runde wirken sich erst in der nächsten aus,
   deshalb wird ein früher Vorteil im Verlauf immer grösser.
   ------------------------------------------------------------ */
function flottenStaerke(flotte){
  let n = 0; for(const t in flotte) n += flotte[t] || 0; return n;
}
function lebenspunkte(typ){
  return (SCHIFFE[typ].panzerung || 0) * PANZER_ZU_LEBEN + 40;
}

// Schaden, den eine Flotte in einer Runde austeilt, aufgeteilt nach Zieltyp
function schadenAusteilen(angreifer, verteidiger, bonus){
  const zielAnteile = {};
  const gesamt = flottenStaerke(verteidiger);
  if(!gesamt) return {};
  for(const t in verteidiger) zielAnteile[t] = verteidiger[t] / gesamt;

  const schaden = {};
  for(const zt in zielAnteile) schaden[zt] = 0;

  for(const at in angreifer){
    const n = angreifer[at]; if(!n) continue;
    const roh = n * (SCHIFFE[at].angriff || 0) * bonus * SCHADEN_FAKTOR;
    // Feuer verteilt sich auf die Zieltypen nach ihrem Anteil an der Flotte
    for(const zt in zielAnteile){
      const konter = (KONTER[at] && KONTER[at][zt]) || 1;
      const streuung = 1 + (Math.random()*2 - 1) * SCHADEN_STREUUNG;
      schaden[zt] += roh * zielAnteile[zt] * konter * streuung;
    }
  }
  return schaden;
}

// Rechnet Schaden in Schiffsverluste um
function verlusteAnwenden(flotte, schaden){
  const verluste = {};
  for(const t in flotte){
    if(!flotte[t] || !schaden[t]) continue;
    const gefallen = Math.min(flotte[t], Math.floor(schaden[t] / lebenspunkte(t)));
    if(gefallen > 0){
      flotte[t] -= gefallen;
      verluste[t] = gefallen;
      if(flotte[t] <= 0) delete flotte[t];
    }
  }
  return verluste;
}

function kampf(sysId, schiffe){
  const sys = spiel.systeme[sysId];
  const art = PIRATEN_ARTEN[sys.piraten.art];
  const eigen = { ...schiffe };
  const feind = { ...sys.piraten.flotte };
  const feindStart = flottenStaerke(feind);
  const panzerbonus = art.panzerbonus || 1;

  const runden = [];
  for(let r = 1; r <= KAMPF_RUNDEN; r++){
    if(!flottenStaerke(eigen) || !flottenStaerke(feind)) break;

    // Beide Seiten feuern auf den Stand zu Rundenbeginn
    const schadenAufFeind = schadenAusteilen(eigen, feind, 1);
    const schadenAufUns   = schadenAusteilen(feind, eigen, panzerbonus);

    const feindVerlust = verlusteAnwenden(feind, schadenAufFeind);
    const eigenVerlust = verlusteAnwenden(eigen, schadenAufUns);

    runden.push({
      nummer: r,
      eigenVerlust, feindVerlust,
      eigenRest: flottenStaerke(eigen),
      feindRest: flottenStaerke(feind),
    });
  }

  const feindWeg = flottenStaerke(feind) === 0;
  const eigenWeg = flottenStaerke(eigen) === 0;

  let bericht, beute = null;
  if(feindWeg){
    sys.piraten = null;
    const wert = feindStart * 40 * art.beute;
    beute = {};
    for(const r of ["erz","silikat","kupfer","legierung"])
      beute[r] = Math.floor(wert * (0.6 + Math.random()*0.6));
    bericht = `Sieg bei ${sys.name} — ${art.name} zerschlagen.`;
  }else if(eigenWeg){
    sys.piraten.flotte = feind;
    bericht = `Niederlage bei ${sys.name} — die Flotte wurde aufgerieben.`;
  }else{
    sys.piraten.flotte = feind;
    bericht = `Unentschieden bei ${sys.name} — beide Seiten zogen sich zurück.`;
  }

  return { ueberlebende: eigen, beute, bericht, runden,
           feindRest: flottenStaerke(feind) };
}

function missionAuswerten(m){
  const sys = spiel.systeme[m.art === "sammeln" ? spiel.objekte[m.ziel].systemId : m.ziel];
  if(m.art === "erkunden"){
    sys.erkundet = true;
    m.schiffe = {};                       // Sonde bleibt vor Ort
    m.bericht = `System ${sys.name} erkundet.`;
  }
  else if(m.art === "besiedeln"){
    spiel.kolonien[m.ziel] = neueKolonie(m.ziel);
    m.schiffe = {};                       // Siedlerschiff wird zur Kolonie
    m.bericht = `${spiel.objekte[m.ziel].name} besiedelt.`;
  }
  else if(m.art === "sammeln"){
    m.ladung = sammelErtrag(m.ziel, m.schiffe.frachter||0);
    m.bericht = `Frachter beladen bei ${spiel.objekte[m.ziel].name}.`;
  }
  else if(m.art === "angriff"){
    const e = kampf(sys.id, m.schiffe);
    m.schiffe = e.ueberlebende;
    m.ladung = e.beute;
    m.bericht = e.bericht;
    m.runden = e.runden;
  }
}

function missionHeimkehr(m){
  for(const t in m.schiffe) spiel.schiffe[t] = (spiel.schiffe[t]||0) + m.schiffe[t];
  if(m.ladung)
    for(const r in m.ladung) spiel.res[r] = (spiel.res[r]||0) + m.ladung[r];
  spiel.berichte = spiel.berichte || [];
  spiel.berichte.unshift({ text:m.bericht, ladung:m.ladung, runden:m.runden||null, zeit:Date.now() });
  spiel.berichte = spiel.berichte.slice(0,5);
}

// Verteilt eine Gesamtstärke nach der Mischung des Verbandes auf Schiffstypen
function piratenFlotte(art, gesamt){
  const m = PIRATEN_ARTEN[art].mischung, f = {};
  for(const t in m){
    const n = Math.round(gesamt * m[t]);
    if(n > 0) f[t] = n;
  }
  if(!Object.keys(f).length) f.jaeger = 1;
  return f;
}
function piratenStaerke(sys){
  if(!sys.piraten) return 0;
  let s = 0;
  for(const t in sys.piraten.flotte)
    s += sys.piraten.flotte[t] * ((SCHIFFE[t].angriff||0) + (SCHIFFE[t].panzerung||0)*0.5);
  return Math.floor(s * (PIRATEN_ARTEN[sys.piraten.art].panzerbonus || 1));
}
function piratenAnzahl(sys){
  if(!sys.piraten) return 0;
  let n = 0; for(const t in sys.piraten.flotte) n += sys.piraten.flotte[t];
  return n;
}

function entfernungSys(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function naechstesEigenesSystem(sys){
  let best = Infinity;
  for(const id in spiel.kolonien){
    const s = spiel.systeme[spiel.objekte[id].systemId];
    best = Math.min(best, entfernungSys(sys, s));
  }
  return best === Infinity ? 40 : best;
}
function sondeSenden(sysId){
  if(spiel.systeme[sysId].erkundet || flotteFrei("sonde") < 1) return;
  starteMission("erkunden", sysId, { sonde:1 });
}
function kolonieKosten(objId){
  const art = OBJEKTE[spiel.objekte[objId].typ].art;
  const z = zaehleKolonien();
  const n = art === "planet" ? z.planeten : z.habitate;
  const basis = art === "planet" ? { erz:800, silikat:400, energiezellen:300 }
                                 : { erz:600, silikat:500, kupfer:200, energiezellen:400 };
  const k = {};
  for(const r in basis) k[r] = Math.floor(basis[r]*Math.pow(1.5, n));
  return k;
}
function kannKolonisieren(objId){
  if(spiel.kolonien[objId]) return false;
  const obj = spiel.objekte[objId];
  if(spiel.systeme[obj.systemId].piraten) return false;         // erst aufräumen
  if(flotteFrei("siedlerschiff") < 1) return false;
  const art = OBJEKTE[obj.typ].art, z = zaehleKolonien();
  if(art === "planet"  && z.planeten >= maxPlaneten()) return false;
  if(art === "habitat" && z.habitate >= maxHabitate()) return false;
  return bezahlbar(kolonieKosten(objId));
}
function kolonisieren(objId){
  if(!kannKolonisieren(objId)) return;
  abbuchen(kolonieKosten(objId));
  starteMission("besiedeln", objId, { siedlerschiff:1 });
}
function baueDistrikt(id, s){
  const k = spiel.kolonien[id], obj = spiel.objekte[id];
  const max = obj.felder[s] || 0;
  const kosten = distriktKosten(s);
  if(k.bau || k.distrikte[s] >= max || !bezahlbar(kosten)) return;
  abbuchen(kosten);
  const dauer = bauzeit(kosten);
  k.bau = { art:"distrikt", schluessel:s, dauer, fertigAb:Date.now()+dauer*1000/TEMPO };
  speichern(); zeichnen();
}
function baueGebaeude(id, s){
  const k = spiel.kolonien[id], g = GEBAEUDE[s];
  const ziel = k.gebaeude[s] + 1;
  if(k.bau || ziel > g.maxLevel || !erlaubteGebaeude(id).includes(s)) return;
  const kosten = gebaeudeKosten(s, ziel);
  if(!bezahlbar(kosten)) return;
  abbuchen(kosten);
  const dauer = bauzeit(kosten);
  k.bau = { art:"gebaeude", schluessel:s, dauer, fertigAb:Date.now()+dauer*1000/TEMPO };
  speichern(); zeichnen();
}
function zuweisen(id, schluessel, delta){
  const k = spiel.kolonien[id], z = berechneKolonie(id);
  const jetzt = k.zuweisung[schluessel] || 0;
  const neu = jetzt + delta;
  if(neu < 0 || neu > MAX_ZUWEISUNG) return;
  if(delta > 0 && z.frei <= 0) return;
  k.zuweisung[schluessel] = neu;
  speichern(); zeichnen();
}
function erforsche(id){
  if(!techVerfuegbar(id)) return;
  const k = techKosten(id);
  if(spiel.forschung < k) return;
  spiel.forschung -= k;
  spiel.techs[id] = techStufe(id) + 1;
  speichern(); zeichnen();
}

/* ============================================================
   12. ANZEIGE
   Aufbau: Kopfleiste (klebt) — Hauptreiter — Bühne.
   Die Bühne zeigt je nach Reiter Karte, Kolonie, Flotte oder Forschung.
   ============================================================ */
const nf = new Intl.NumberFormat("de-DE");
const z0 = n => nf.format(Math.round(n));
function zeitText(s){
  s = Math.max(0, Math.ceil(s));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), r=s%60;
  if(h) return `${h} h ${String(m).padStart(2,"0")} min`;
  if(m) return `${m}:${String(r).padStart(2,"0")} min`;
  return `${r} s`;
}
function kostenZeile(kosten, dauer){
  let h="";
  for(const r in kosten)
    h += `<span class="${(spiel.res[r]||0)<kosten[r]?"fehlt":""}">${RES_NAMEN[r]} ${z0(kosten[r])}</span>`;
  if(dauer != null) h += `<span>${zeitText(dauer)}</span>`;
  return h;
}
function ertragText(ertrag){
  return Object.keys(ertrag).map(r => `+${z0(ertrag[r])} ${RES_NAMEN[r]}`).join(" · ");
}
function fortschrittBalken(rest, dauer){
  return `<div class="schiene"><i style="width:${Math.min(100,Math.max(0,(1-rest/(dauer/TEMPO))*100))}%"></i></div>`;
}

    case "fels":
      oberflaeche = `<circle cx="35" cy="36" r="9" fill="#000" opacity=".22"/>
        <circle cx="63" cy="57" r="12" fill="#000" opacity=".18"/>
        <circle cx="52" cy="24" r="5" fill="#000" opacity=".2"/>
        <circle cx="26" cy="62" r="6.5" fill="#000" opacity=".2"/>
        <circle cx="72" cy="32" r="4" fill="#fff" opacity=".12"/>`;
      break;
    case "eis":
      oberflaeche = `<ellipse cx="50" cy="15" rx="27" ry="9" fill="#ffffff" opacity=".62"/>
        <ellipse cx="50" cy="85" rx="24" ry="8" fill="#ffffff" opacity=".55"/>
        <path d="M22 46 L44 40 L66 50 L84 44" stroke="#ffffff" stroke-width="1.6" fill="none" opacity=".4"/>
        <path d="M18 60 L40 56 L62 64" stroke="#ffffff" stroke-width="1.2" fill="none" opacity=".3"/>`;
      break;
    case "gasriese":
      oberflaeche = `<ellipse cx="50" cy="28" rx="47" ry="7" fill="#000" opacity=".16"/>

        <ellipse cx="50" cy="60" rx="46" ry="8" fill="#000" opacity=".18"/>

// Springt ein, wenn eine hinterlegte Bilddatei nicht gefunden wird
function bildErsatz(typ, groesse){
  const h = document.createElement("div");
  const merk = BILDER[typ];
  BILDER[typ] = "";                 // einmal umschalten, sonst Endlosschleife
  h.innerHTML = scheibe(typ, groesse);
  BILDER[typ] = merk;
  console.warn("Bild nicht gefunden:", merk, "— gezeichnete Scheibe wird verwendet.");
  return h.firstElementChild;
}

/* ------------------------------------------------------------
   Hauptzeichnung
   ------------------------------------------------------------ */
function zeichnen(){
  const g = berechneReich();
  if(!spiel.tab) spiel.tab = "karte";
  if(!spiel.kolonieTab) spiel.kolonieTab = "uebersicht";

  // Kopfzeile: Reichskennung
  const z = zaehleKolonien();
  document.getElementById("kennung").textContent =
    `${z.planeten}/${maxPlaneten()} Planeten · ${z.habitate}/${maxHabitate()} Habitate · ${g.bev} Bewohner`;

  // Ressourcenstreifen
  let h = "";
  for(const r of RES){
    const rate = g.ein[r];
    h += `<div class="posten" style="--ton:var(--${r})">
      <div class="etikett">${RES_NAMEN[r]}</div>
      <div class="stand">${z0(spiel.res[r])}</div>
      <div class="fluss ${rate<0?"minus":""}">${rate>=0?"+":""}${z0(rate)}/h</div></div>`;
  }
  h += `<div class="posten" style="--ton:var(--forschung)">
      <div class="etikett">Forschung</div>
      <div class="stand">${z0(spiel.forschung)}</div>
      <div class="fluss" style="color:var(--forschung)">+${z0(g.forschung)}/h</div></div>`;
  document.getElementById("streifen").innerHTML = h;

  // Hauptreiter mit Zählern
  const laufend = spiel.missionen.length + (spiel.werftauftrag?1:0);
  const bauend = Object.keys(spiel.kolonien).filter(id => spiel.kolonien[id].bau).length;
  const forschbar = Object.keys(TECHS).filter(t => techVerfuegbar(t) && spiel.forschung >= techKosten(t)).length;
  const reiter = [
    ["karte","Karte",""],
    ["kolonie","Kolonien", bauend?`<span class="zeiger">${bauend}</span>`:""],
    ["flotte","Flotte", laufend?`<span class="zeiger">${laufend}</span>`:""],
    ["forschung","Forschung", forschbar?`<span class="zeiger warn">${forschbar}</span>`:""],
  ];
  document.getElementById("nav").innerHTML = reiter.map(([k,n,zg]) =>
    `<button data-tab="${k}" class="${spiel.tab===k?"an":""}">${n}${zg}</button>`).join("");

  // Bühne
  const buehne = document.getElementById("buehne");
  if(spiel.tab === "karte")          buehne.innerHTML = seiteKarte(g);
  else if(spiel.tab === "kolonie")   buehne.innerHTML = seiteKolonie(g);
  else if(spiel.tab === "flotte")    buehne.innerHTML = seiteFlotte(g);
  else                               buehne.innerHTML = seiteForschung(g);
}

   Seite: Karte
   ------------------------------------------------------------ */
function seiteKarte(g){
  const sys = spiel.systeme[spiel.offenesSystem];
  let h = `<div class="pfad">
    <button data-ansicht="galaxie">Galaxie</button>`;
  if(spiel.ansicht !== "galaxie") h += `<span>›</span><button data-ansicht="system">${sys.name}</button>`;
  if(spiel.ansicht === "objekt") h += `<span>›</span><span>${spiel.objekte[spiel.auswahl].name}</span>`;
  h += `</div>`;

  h += `<div class="karte">${spiel.ansicht === "galaxie" ? galaxieKarte() : systemKarte(sys)}</div>`;

  if(spiel.ansicht === "objekt")
    h += `<div style="margin-top:12px">${objektTafel(spiel.auswahl, g)}</div>`;
  else if(spiel.ansicht === "galaxie")
    h += `<div class="rubrik"><h2>Ablesen</h2><span class="zusatz">Ein System anklicken zum Öffnen</span></div>
      <div class="flaeche"><div class="erlaeuterung">
      Helle Punkte sind erkundete Systeme, dunkle unerkundet. Ein Ring markiert eigene Kolonien,
      rote Beschriftung Piraten. Sonden bauen Sie in der Werft.</div></div>`;
  return h;
}

function galaxieKarte(){
  let linien = "", punkte = "";
  const eigene = new Set();
  for(const id in spiel.kolonien) eigene.add(spiel.objekte[id].systemId);
  for(const s of spiel.systeme)
    if(eigene.has(s.id) && s.id !== 0)
      linien += `<line x1="${s.x}" y1="${s.y}" x2="${spiel.systeme[0].x}" y2="${spiel.systeme[0].y}"
                  stroke="var(--kante)" stroke-width="0.35" stroke-dasharray="1.4 1.6"/>`;
  for(const s of spiel.systeme){
    const anzKol = s.objekte.filter(o => spiel.kolonien[o]).length;
    const offen = spiel.offenesSystem === s.id;
    punkte += `<g class="punkt" data-system="${s.id}">
      ${offen?`<circle cx="${s.x}" cy="${s.y}" r="7" fill="none" stroke="var(--bernstein)" stroke-width="0.4" opacity=".8"/>`:""}
      ${anzKol?`<circle cx="${s.x}" cy="${s.y}" r="5.2" fill="none" stroke="var(--signal)" stroke-width="0.55"/>`:""}
      <circle cx="${s.x}" cy="${s.y}" r="7" fill="${s.erkundet?(STERNE[s.stern]?.farbe||"#f0e2b0"):"#2a3d55"}" opacity=".14"/>
      <circle cx="${s.x}" cy="${s.y}" r="${s.erkundet?(2.2+(STERNE[s.stern]?.groesse||1)*1.1):3}"
        fill="${s.erkundet?(STERNE[s.stern]?.farbe||"#f0e2b0"):"#33485f"}"/>
      <text x="${s.x}" y="${s.y+7.8}" text-anchor="middle" font-size="3.1" font-weight="600"
        fill="${s.erkundet?"var(--text)":"var(--schwach)"}">${s.erkundet?s.name:"unbekannt"}</text>
      ${s.erkundet?`<text x="${s.x}" y="${s.y+11.6}" text-anchor="middle" font-size="2.5"
        fill="${s.piraten?"var(--alarm)":"var(--matt)"}">${s.piraten
          ? PIRATEN_ARTEN[s.piraten.art].name+" · "+piratenAnzahl(s)
          : s.objekte.length+" Objekte"+(anzKol?" · "+anzKol+" besiedelt":"")}</text>`:""}
    </g>`;
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${linien}${punkte}</svg>`;
}

function systemKarte(sys){
  if(!sys.erkundet){
    const frei = flotteFrei("sonde");
    return `<div style="padding:16px">
      <div class="bezeichnung">${sys.name} — unerkundet</div>
      <div class="erlaeuterung">Eine Sonde deckt auf, welche Objekte hier liegen. ${frei} Sonden bereit.</div>
      <button data-sonde="${sys.id}" ${frei<1?"disabled":""} style="margin-top:11px">
        ${frei<1?"Keine Sonde verfügbar":"Sonde senden"}</button></div>`;
  }
  const sd = STERNE[sys.stern] || STERNE.gelber_stern;
  let kopf = `<div style="padding:12px 14px 2px;display:flex;gap:11px;align-items:center;flex-wrap:wrap">
    <img src="${sd.bild}" width="34" height="34" alt="" style="flex:none">
    <div><div class="bezeichnung">${sys.name} <span class="stufe">${sd.name}</span></div>
      <div class="erlaeuterung">${sd.beschreibung}</div></div></div>`;
  if(sys.piraten){
    const art = PIRATEN_ARTEN[sys.piraten.art];
    const feindStaerke = piratenStaerke(sys);
    const kampftypen = ["jaeger","korvette","kreuzer"];

    // Eigene Kampfkraft und wie gut sie zur gegnerischen Mischung passt
    let eigen = 0, eigenAnzahl = 0;
    for(const t of kampftypen){
      const n = flotteFrei(t); if(!n) continue;
      eigenAnzahl += n;
      let schnitt = 0, ziele = 0;
      for(const ft in sys.piraten.flotte){
        schnitt += (KONTER[t]?.[ft] || 1) * sys.piraten.flotte[ft];
        ziele += sys.piraten.flotte[ft];
      }
      const passung = ziele ? schnitt/ziele : 1;
      eigen += n * ((SCHIFFE[t].angriff||0)*passung + (SCHIFFE[t].panzerung||0)*0.5);
    }

    const feindListe = Object.keys(sys.piraten.flotte)
      .map(t => `${sys.piraten.flotte[t]} ${SCHIFFE[t].name}`).join(" · ");
    const eigenListe = kampftypen.filter(t=>flotteFrei(t)>0)
      .map(t => `${flotteFrei(t)} ${SCHIFFE[t].name}`).join(" · ") || "keine Kampfschiffe";

    const verhaeltnis = eigen / Math.max(1, feindStaerke);
    const lage = verhaeltnis >= 1.4 ? "gut" : verhaeltnis >= 0.9 ? "" : "rot";
    const urteil = eigenAnzahl === 0 ? "Bauen Sie zuerst Kampfschiffe."
      : verhaeltnis < 0.7 ? "Aussichtslos — die Flotte würde aufgerieben."
      : verhaeltnis < 0.9 ? "Unterlegen. Ein Sieg ist unwahrscheinlich."
      : verhaeltnis < 1.4 ? "Ausgeglichen. Der Ausgang ist offen."
      : "Überlegen. Der Sieg sollte gelingen.";

    // Welcher eigene Typ trifft diesen Gegner am besten?
    let bester = null, besterWert = 0;
    for(const t of kampftypen){
      let schnitt = 0, ziele = 0;
      for(const ft in sys.piraten.flotte){
        schnitt += (KONTER[t]?.[ft] || 1) * sys.piraten.flotte[ft];
        ziele += sys.piraten.flotte[ft];
      }
      const w = ziele ? schnitt/ziele : 1;
      if(w > besterWert){ besterWert = w; bester = t; }
    }

    kopf = `<div style="padding:13px 14px 4px">
      <div class="meldung rot" style="margin-top:0">
        <strong>${art.name} in ${sys.name}</strong> · ${piratenAnzahl(sys)} Schiffe
        · Stärke <span class="zahl">${z0(feindStaerke)}</span><br>
        <span style="color:var(--matt)">${art.beschreibung}</span><br>
        <span style="color:var(--matt)">Verband: ${feindListe}</span></div>
      <div class="meldung ${lage}">
        Ihre Flotte: ${eigenListe} · gewichtete Stärke <span class="zahl">${z0(eigen)}</span><br>
        ${urteil}${bester && besterWert > 1.15
          ? ` <span style="color:var(--signal)">${SCHIFFE[bester].name} sind gegen diesen Verband besonders wirksam (×${besterWert.toFixed(2)}).</span>` : ""}
      </div>
      <button data-angriff="${sys.id}" ${eigenAnzahl<=0?"disabled":""} style="margin-top:9px">
        ${eigenAnzahl<=0?"Keine Flotte":"Gesamte Flotte entsenden"}</button></div>`;
  }
  const stern = STERNE[sys.stern] || STERNE.gelber_stern;
  const sr = 7 * stern.groesse;          // Darstellungsradius nach Sterntyp
  let inhalt = `
    <circle cx="50" cy="50" r="${sr*2.2}" fill="${stern.farbe}" opacity=".07"/>
    <image href="${stern.bild}" x="${50-sr}" y="${50-sr}" width="${sr*2}" height="${sr*2}"
      preserveAspectRatio="xMidYMid meet"/>`;

  const n = sys.objekte.length;
  sys.objekte.forEach((objId, i) => {
    const o = spiel.objekte[objId], def = OBJEKTE[o.typ];
    const bahn = 15 + sr*0.9 + i*(n > 4 ? 8.4 : 10.2);
    // Winkel so verteilen, dass sich benachbarte Objekte nicht überlagern
    const winkel = 0.55 + i*2.399;
    const x = 50 + Math.cos(winkel)*bahn, y = 50 + Math.sin(winkel)*bahn*0.55;
    const kolonie = !!spiel.kolonien[objId];
    const gr = def.art === "planet" ? 4.0 : 3.2;     // Radius der Darstellung
    const bild = BILDER[o.typ];

    // Beschriftung nach unten, ausser das Objekt liegt am unteren Rand
    const untenFrei = y < 66;
    const ty = untenFrei ? y + gr + 3.6 : y - gr - 4.4;

    inhalt += `<ellipse cx="50" cy="50" rx="${bahn}" ry="${bahn*0.55}" fill="none"
                stroke="var(--kante)" stroke-width="0.2" opacity=".55"/>
      <g class="punkt" data-objekt="${objId}">
        ${spiel.auswahl===objId?`<circle cx="${x}" cy="${y}" r="${gr+2.4}" fill="none"
            stroke="var(--bernstein)" stroke-width="0.45"/>`:""}
        ${kolonie?`<circle cx="${x}" cy="${y}" r="${gr+1.3}" fill="none"
            stroke="var(--signal)" stroke-width="0.5"/>`:""}`;

    if(bild){
      // Eigenes Bild als Scheibe einsetzen
      inhalt += `<image href="${bild}" x="${x-gr}" y="${y-gr}"
          width="${gr*2}" height="${gr*2}" preserveAspectRatio="xMidYMid meet"/>`;
    }else{
      // Ohne Bild: farbiger Punkt wie bisher
      inhalt += `<circle cx="${x}" cy="${y}" r="${gr*0.8}" fill="${def.farbe}"
          ${def.art==="habitat"?'stroke="var(--text)" stroke-width="0.28" stroke-dasharray="1 0.9"':""}/>`;
    }

    // Schrift mit dunklem Rand, damit sie über allem lesbar bleibt
    const zeile2 = untenFrei ? ty + 3.4 : ty - 3.4;
    inhalt += `<text x="${x}" y="${untenFrei ? ty : zeile2}" text-anchor="middle" font-size="2.9"
        font-weight="600" fill="var(--text)" stroke="#060b13" stroke-width="0.9"
        paint-order="stroke" stroke-linejoin="round">${o.name}</text>
      <text x="${x}" y="${untenFrei ? zeile2 : ty}" text-anchor="middle" font-size="2.4"
        fill="var(--matt)" stroke="#060b13" stroke-width="0.8"
        paint-order="stroke" stroke-linejoin="round">${def.name}</text>
      </g>`;
  });

  return kopf + `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inhalt}</svg>`;
}

/* ------------------------------------------------------------
   Seite: Kolonien
   ------------------------------------------------------------ */
function seiteKolonie(g){
  const ids = Object.keys(spiel.kolonien);
  if(!ids.length) return `<div class="flaeche">Noch keine Kolonie. Besiedeln Sie ein Objekt über die Karte.</div>`;
  if(!spiel.kolonien[spiel.auswahl]) spiel.auswahl = +ids[0];

  let h = `<div class="unterreiter" style="margin-top:0">`;
  for(const id of ids){
    const k = spiel.kolonien[id];
    h += `<button data-kolonie="${id}" class="${+spiel.auswahl===+id?"an":""}">
      ${spiel.objekte[id].name}${k.bau?" ·":""}</button>`;
  }
  h += `</div>` + objektTafel(+spiel.auswahl, g, true);
  return h;
}

function objektTafel(objId, g, mitReitern){
  const obj = spiel.objekte[objId], def = OBJEKTE[obj.typ];
  const kolonie = spiel.kolonien[objId];
  const sys = spiel.systeme[obj.systemId];

  // ----- Nicht besiedelt -----
  if(!kolonie){
    const kosten = kolonieKosten(objId);
    const z = zaehleKolonien();
    const grenze = def.art === "planet" ? z.planeten >= maxPlaneten() : z.habitate >= maxHabitate();
    let felder = "";
    for(const d in obj.felder)
      felder += `<div class="mess"><div class="k">${DISTRIKTE[d].name}</div>
                 <div class="v">${obj.felder[d]}</div></div>`;
    return `<div class="flaeche">
      <div class="weltkopf">
        ${scheibe(obj.typ, 88)}
        <div class="weltdaten">
          <div class="gattung">${def.name}${def.art==="habitat"?" · Habitat":""}</div>
          <div class="name">${obj.name}</div>
          <div class="lage">System ${sys.name} · ${(STERNE[sys.stern]||STERNE.gelber_stern).name}
            · ${def.beschreibung}</div>
        </div>
      </div>
      <div class="messwerte">${felder}</div>
      <div class="werte" style="margin-top:13px">${kostenZeile(kosten, null)}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:11px">
        <button data-kolonisieren="${objId}" ${kannKolonisieren(objId)?"":"disabled"}>
          ${grenze?(def.art==="planet"?"Planetengrenze erreicht":"Habitatgrenze erreicht")
            :sys.piraten?"Piraten im System"
            :flotteFrei("siedlerschiff")<1?"Kein Siedlerschiff":"Besiedeln"}</button>
        <button class="still" data-sammeln="${objId}" ${flotteFrei("frachter")<1?"disabled":""}>
          ${flotteFrei("frachter")<1?"Keine Frachter":`Sammeln mit ${flotteFrei("frachter")} Frachtern`}</button>
      </div>
      ${grenze?`<div class="meldung">Die Grenze lässt sich unter Forschung anheben.</div>`:""}
      <div class="erlaeuterung" style="margin-top:9px">Frachter holen hier ${FRACHTER_KAPAZITAET} Einheiten
        je Schiff — auch ohne Kolonie.</div>
    </div>`;
  }

  // ----- Besiedelt -----
  const k = kolonie, z = g.je[objId];
  const bisPop = z.wachstumProStunde > 0
    ? zeitText((z.wachstumsziel - k.wachstum)/z.wachstumProStunde*3600/TEMPO) : "—";

  let meldungen = "";
  if(g.hunger) meldungen += `<div class="meldung rot">Hungersnot im Reich — die Bevölkerung schrumpft. Mehr Nahrung erzeugen.</div>`;
  if(z.wohnraum === 0) meldungen += `<div class="meldung">Kein Wohnraum. ${def.art==="habitat"?"Habitatmodul":"Wohnkomplex"} bauen, sonst bleibt die Kolonie unbewohnt.</div>`;
  else if(z.bev >= z.wohnraum) meldungen += `<div class="meldung">Wohnraum erschöpft — hier wächst niemand mehr nach.</div>`;
  if(z.frei > 0) meldungen += `<div class="meldung">${z.frei} Bewohner ohne Aufgabe. Jede Zuweisung bringt 10 % mehr Ertrag.</div>`;

  let h = `<div class="flaeche" style="margin-top:12px">
    <div class="weltkopf">
      ${scheibe(obj.typ, 88)}
      <div class="weltdaten">
        <div class="gattung">${def.name}${def.art==="habitat"?" · Habitat":""}</div>
        <div class="name">${obj.name}</div>
        <div class="lage">System ${sys.name} · ${(STERNE[sys.stern]||STERNE.gelber_stern).name}
          · ${def.beschreibung}</div>
      </div>
    </div>
    <div class="messwerte">
      <div class="mess"><div class="k">Bewohner</div>
        <div class="v ${z.wohnraum&&z.bev>=z.wohnraum?"warn":""}">${z.bev} / ${z.wohnraum}</div></div>
      <div class="mess"><div class="k">Zugewiesen</div><div class="v">${z.zugewiesen}</div></div>
      <div class="mess"><div class="k">Zuwachs in</div><div class="v">${bisPop}</div></div>
      <div class="mess"><div class="k">Lagerbeitrag</div><div class="v">${z0(z.lager)}</div></div>
    </div>
    ${meldungen}</div>`;

  if(k.bau){
    const name = k.bau.art === "distrikt" ? DISTRIKTE[k.bau.schluessel].name
               : GEBAEUDE[k.bau.schluessel].name + " → Stufe " + (k.gebaeude[k.bau.schluessel]+1);
    const rest = (k.bau.fertigAb-Date.now())/1000;
    h += `<div class="vorgang" style="margin-top:10px">
      <div class="zeile1"><strong>Im Bau · ${name}</strong>
        <span class="rest">${zeitText(rest*TEMPO)}</span></div>
      ${fortschrittBalken(rest, k.bau.dauer)}</div>`;
  }

  // Unterreiter der Kolonie
  const t = spiel.kolonieTab;
  h += `<div class="unterreiter">
    <button data-koltab="uebersicht" class="${t==="uebersicht"?"an":""}">Übersicht</button>
    <button data-koltab="distrikte" class="${t==="distrikte"?"an":""}">Distrikte</button>
    <button data-koltab="gebaeude" class="${t==="gebaeude"?"an":""}">Gebäude</button>
  </div>`;

  if(t === "uebersicht"){
    h += `<div class="rubrik"><h2>Was diese Kolonie beisteuert</h2>
      <span class="zusatz">je Stunde</span></div>`;
    if(!z.beitrag.length)
      h += `<div class="flaeche"><div class="erlaeuterung">Noch nichts gebaut.
        Fangen Sie unter Distrikte an.</div></div>`;
    for(const p of z.beitrag){
      h += `<div class="posten-zeile">
        <div class="rumpf">
          <div class="bezeichnung">${p.name} <span class="stufe">×${p.anzahl}</span></div>
          <div class="erlaeuterung">${ertragText(p.ertrag)}${p.zug?` · Bonus +${Math.round(p.zug*BONUS_PRO_KOPF*100)} % durch ${p.zug} Bewohner`:""}</div>
        </div></div>`;
    }
    h += `<div class="rubrik"><h2>Verbrauch</h2></div>
      <div class="posten-zeile"><div class="rumpf">
        <div class="bezeichnung">Versorgung der Bewohner</div>
        <div class="erlaeuterung">−${z0(z.bev*NAHRUNG_PRO_KOPF)} Nahrung je Stunde
          (${z.bev} Bewohner × ${NAHRUNG_PRO_KOPF})</div></div></div>`;
  }

  if(t === "distrikte"){
    h += `<div class="rubrik"><h2>Distrikte</h2>
      <span class="zusatz">Keine Stufen — mehr bauen statt ausbauen</span></div>`;
    for(const d in obj.felder){
      const dd = DISTRIKTE[d], n = k.distrikte[d], max = obj.felder[d];
      const kosten = distriktKosten(d);
      const zug = k.zuweisung["d:"+d] || 0;
      const faktor = 1 + zug*BONUS_PRO_KOPF;
      const ertrag = {};
      for(const r in dd.produziert) ertrag[r] = dd.produziert[r]*n*faktor;
      let balken = "";
      for(let i=0;i<Math.min(max,20);i++) balken += `<i class="${i<n?"belegt":""}"></i>`;
      h += `<div class="posten-zeile ${n>=max?"erschoepft":""}">
        <div class="rumpf">
          <div class="bezeichnung">${dd.name} <span class="stufe">${n} / ${max}</span></div>
          <div class="erlaeuterung">${n ? ertragText(ertrag)+" / h" : dd.beschreibung||"noch nichts gebaut"}
            ${zug?` · +${Math.round(zug*BONUS_PRO_KOPF*100)} %`:""}</div>
          <div class="felder">${balken}</div>
          <div class="werte">${kostenZeile(kosten, bauzeit(kosten))}</div></div>
        ${n>0?`<div class="regler">
          <button data-zu="d:${d}" data-id="${objId}" data-delta="-1" ${zug<=0?"disabled":""}>−</button>
          <b>${zug}</b>
          <button data-zu="d:${d}" data-id="${objId}" data-delta="1" ${zug>=MAX_ZUWEISUNG||z.frei<=0?"disabled":""}>+</button>
          <span>/${MAX_ZUWEISUNG}</span></div>`:""}
        <button data-bd="${d}" data-id="${objId}" ${(k.bau||n>=max||!bezahlbar(kosten))?"disabled":""}>
          ${n>=max?"Felder belegt":k.bau?"Bauplatz belegt":"Bauen"}</button>
      </div>`;
    }
  }

  if(t === "gebaeude"){
    const erlaubt = erlaubteGebaeude(objId);
    h += `<div class="rubrik"><h2>Gebäude</h2>
      <span class="zusatz">${def.art==="habitat"
        ? "Habitate bauen vorerst nur Lager und Wohnmodul"
        : "Pro Stufe 30 % teurer, 20 % mehr Ertrag"}</span></div>`;
    for(const sKey of erlaubt){
      const gb = GEBAEUDE[sKey], lvl = k.gebaeude[sKey];
      const ziel = lvl + 1, maximal = lvl >= gb.maxLevel;
      const kosten = gebaeudeKosten(sKey, ziel);
      const zug = k.zuweisung["g:"+sKey] || 0;
      const faktor = 1 + zug*BONUS_PRO_KOPF;
      let wirkung = [];
      if(gb.produziert)
        for(const r in gb.produziert) wirkung.push(`+${z0(gebaeudeErtrag(gb.produziert[r],lvl)*faktor)} ${RES_NAMEN[r]} / h`);
      if(gb.wohnraum) wirkung.push(`${z0(gebaeudeErtrag(gb.wohnraum,lvl))} Wohnraum`);
      if(gb.lager)    wirkung.push(`${z0(gebaeudeErtrag(gb.lager,lvl))} Lager`);
      h += `<div class="posten-zeile ${maximal?"erschoepft":""}">
        <div class="rumpf">
          <div class="bezeichnung">${gb.name} <span class="stufe">Stufe ${lvl} / ${gb.maxLevel}</span></div>
          <div class="erlaeuterung">${lvl?wirkung.join(" · "):gb.beschreibung}
            ${zug?` · +${Math.round(zug*BONUS_PRO_KOPF*100)} %`:""}</div>
          ${maximal?"":`<div class="werte">${kostenZeile(kosten, bauzeit(kosten))}</div>`}</div>
        ${(lvl>0&&gb.produziert)?`<div class="regler">
          <button data-zu="g:${sKey}" data-id="${objId}" data-delta="-1" ${zug<=0?"disabled":""}>−</button>
          <b>${zug}</b>
          <button data-zu="g:${sKey}" data-id="${objId}" data-delta="1" ${zug>=MAX_ZUWEISUNG||z.frei<=0?"disabled":""}>+</button>
          <span>/${MAX_ZUWEISUNG}</span></div>`:""}
        <button data-gb="${sKey}" data-id="${objId}" ${(k.bau||maximal||!bezahlbar(kosten))?"disabled":""}>
          ${maximal?"Höchststufe":k.bau?"Bauplatz belegt":lvl?"Ausbauen":"Bauen"}</button>
      </div>`;
    }
  }
  return h;
}

/* ------------------------------------------------------------
   Seite: Flotte
   ------------------------------------------------------------ */
function seiteFlotte(g){
  const w = werftStufe();
  let h = `<div class="rubrik"><h2>Unterwegs</h2>
    <span class="zusatz">${w ? `Werft Stufe ${w} · Bauzeit −${Math.round((1-1/(1+0.25*(w-1)))*100)} %`
      : "Keine Werft — Schiffe brauchen eine Werft auf einem Planeten"}</span></div>`;

  if(!spiel.missionen.length && !spiel.werftauftrag)
    h += `<div class="flaeche"><div class="erlaeuterung">Alle Schiffe im Heimatorbit.
      Missionen starten Sie über die Karte: Sonden bei unerkundeten Systemen,
      Frachter und Siedlerschiffe bei einzelnen Objekten, die Kampfflotte bei Piratensystemen.</div></div>`;

  for(const m of spiel.missionen){
    const rest = (m.endeAb-Date.now())/1000;
    const ziel = (m.art === "sammeln" || m.art === "besiedeln")
      ? spiel.objekte[m.ziel].name : spiel.systeme[m.ziel].name;
    const flotte = Object.keys(m.schiffe).filter(t=>m.schiffe[t])
      .map(t => `${m.schiffe[t]} ${SCHIFFE[t].name}`).join(", ") || "—";
    const bez = { erkunden:"Erkundung", besiedeln:"Besiedlung", sammeln:"Sammelflug", angriff:"Angriff" }[m.art];
    h += `<div class="vorgang">
      <div class="zeile1"><strong>${bez} · ${ziel}</strong>
        <span class="rest">${m.phase==="rueck"?"Rückflug ":""}${zeitText(rest*TEMPO)}</span></div>
      <div class="erlaeuterung">${flotte}${m.bericht?" · "+m.bericht:""}</div>
      ${fortschrittBalken(rest, m.dauer)}</div>`;
  }
  if(spiel.werftauftrag){
    const rest = (spiel.werftauftrag.fertigAb-Date.now())/1000;
    h += `<div class="vorgang">
      <div class="zeile1"><strong>In der Werft · ${SCHIFFE[spiel.werftauftrag.typ].name}</strong>
        <span class="rest">${zeitText(rest*TEMPO)}</span></div>
      ${fortschrittBalken(rest, spiel.werftauftrag.dauer)}</div>`;
  }
  if(spiel.berichte && spiel.berichte.length){
    h += `<div class="rubrik"><h2>Letzte Meldungen</h2></div>`;
    for(const b of spiel.berichte.slice(0,3)){
      const l = b.ladung ? Object.keys(b.ladung).filter(r=>b.ladung[r]>0)
        .map(r=>`${z0(b.ladung[r])} ${RES_NAMEN[r]}`).join(" · ") : "";
      const ton = b.text.startsWith("Niederlage") ? "rot"
                : b.text.startsWith("Unentschieden") ? "" : "gut";
      h += `<div class="meldung ${ton}">${b.text}${l?` Beute: ${l}`:""}</div>`;

      // Gefechtsverlauf Runde für Runde
      if(b.runden && b.runden.length){
        h += `<div class="flaeche" style="margin-top:6px;padding:10px 13px">`;
        for(const r of b.runden){
          const meine = Object.keys(r.eigenVerlust).length
            ? Object.keys(r.eigenVerlust).map(t=>`${r.eigenVerlust[t]} ${SCHIFFE[t].name}`).join(", ")
            : "keine";
          const seine = Object.keys(r.feindVerlust).length
            ? Object.keys(r.feindVerlust).map(t=>`${r.feindVerlust[t]} ${SCHIFFE[t].name}`).join(", ")
            : "keine";
          h += `<div class="erlaeuterung" style="display:flex;gap:10px;flex-wrap:wrap;
                  padding:3px 0;border-bottom:1px solid var(--kante)">
            <span class="zahl" style="color:var(--matt);min-width:52px">Runde ${r.nummer}</span>
            <span style="flex:1 1 140px">Eigene Verluste: ${meine}</span>
            <span style="flex:1 1 140px;color:var(--signal)">Gegner: ${seine}</span>
            <span class="zahl" style="color:var(--schwach)">${r.eigenRest} : ${r.feindRest}</span>
          </div>`;
        }
        h += `</div>`;
      }
    }
  }

  // Kontertabelle als Nachschlagewerk
  const kt = ["jaeger","korvette","kreuzer"];
  h += `<div class="rubrik"><h2>Wirksamkeit</h2>
    <span class="zusatz">Zeile greift Spalte an</span></div>
    <div class="flaeche" style="overflow-x:auto">
    <table style="border-collapse:collapse;font-size:12.5px;min-width:340px">
      <tr><td></td>${kt.map(t=>`<td style="padding:4px 9px;color:var(--matt);
        font-size:11px;text-transform:uppercase;letter-spacing:.1em">${SCHIFFE[t].name}</td>`).join("")}</tr>
      ${kt.map(a=>`<tr>
        <td style="padding:4px 9px;color:var(--matt);font-size:11px;text-transform:uppercase;
            letter-spacing:.1em">${SCHIFFE[a].name}</td>
        ${kt.map(v=>{
          const w = KONTER[a][v];
          const farbe = w > 1.2 ? "var(--signal)" : w < 0.8 ? "var(--alarm)" : "var(--matt)";
          return `<td class="zahl" style="padding:4px 9px;color:${farbe}">×${w.toFixed(1)}</td>`;
        }).join("")}</tr>`).join("")}
    </table>
    <div class="erlaeuterung" style="margin-top:8px">Jäger sind zu wendig für schwere Geschütze und
      reissen Kreuzer auf. Korvetten fangen Jäger ab. Kreuzer zermalmen Korvetten.
      Es zählt also die Mischung, nicht die Menge.</div></div>`;

  h += `<div class="rubrik"><h2>Schiffe bauen</h2>
    <span class="zusatz">Es entsteht immer nur eins auf einmal</span></div>`;
  let rolle = "";
  for(const t in SCHIFFE){
    const d = SCHIFFE[t];
    if(d.rolle !== rolle){
      rolle = d.rolle;
      h += `<div class="rubrik" style="margin:16px 0 8px;border:none;padding:0">
        <h2 style="color:var(--schwach)">${rolle}</h2></div>`;
    }
    let werte = [];
    if(d.angriff)    werte.push(`Angriff ${d.angriff}`);
    if(d.panzerung)  werte.push(`Panzerung ${d.panzerung}`);
    if(d.kapazitaet) werte.push(`Ladung ${d.kapazitaet}`);
    h += `<div class="posten-zeile">
      <div class="rumpf">
        <div class="bezeichnung">${d.name} <span class="stufe">${flotteFrei(t)} bereit</span></div>
        <div class="erlaeuterung">${d.beschreibung}${werte.length?" — "+werte.join(", "):""}</div>
        <div class="werte">${kostenZeile(d.kosten, schiffBauzeit(t))}</div></div>
      <button data-schiff="${t}" ${(spiel.werftauftrag||w<1||!bezahlbar(d.kosten))?"disabled":""}>
        ${w<1?"Keine Werft":spiel.werftauftrag?"Werft belegt":"Bauen"}</button></div>`;
  }
  return h;
}

/* ------------------------------------------------------------
   Seite: Forschung
   ------------------------------------------------------------ */
function seiteForschung(g){
  let h = `<div class="rubrik"><h2>Forschung</h2>
    <span class="zusatz">${z0(spiel.forschung)} vorhanden · +${z0(g.forschung)} je Stunde</span></div>`;
  if(g.forschung <= 0)
    h += `<div class="meldung">Niemand forscht. Laborkomplex ausbauen oder ein Objekt mit
      Forschungsdistrikten besiedeln.</div>`;
  for(const id in TECHS){
    const t = TECHS[id];
    const fertig = !techVerfuegbar(id);
    const kosten = fertig ? 0 : techKosten(id);
    h += `<div class="posten-zeile ${fertig?"erschoepft":""}">
      <div class="rumpf">
        <div class="bezeichnung">${t.name}
          ${techStufe(id)?`<span class="stufe">Stufe ${techStufe(id)}</span>`:""}</div>
        <div class="erlaeuterung">${t.wirkung}${fertig?" · abgeschlossen":""}</div>
        ${fertig?"":`<div class="werte"><span class="${spiel.forschung<kosten?"fehlt":""}"
          style="color:var(--forschung)">${z0(kosten)} Forschung</span></div>`}</div>
      ${fertig?"":`<button class="forsch" data-tech="${id}" ${spiel.forschung>=kosten?"":"disabled"}>Erforschen</button>`}
    </div>`;
  }
  return h;
}

/* ============================================================
   13. START
   ============================================================ */
document.addEventListener("click", e => {
  const sysEl = e.target.closest("[data-system]");
  if(sysEl){ spiel.offenesSystem = +sysEl.dataset.system; spiel.ansicht = "system"; speichern(); zeichnen(); return; }
  const objEl = e.target.closest("[data-objekt]");
  if(objEl && !e.target.closest("button")){
    const id = +objEl.dataset.objekt;
    spiel.auswahl = id; spiel.offenesSystem = spiel.objekte[id].systemId; spiel.ansicht = "objekt";
    speichern(); zeichnen(); return;
  }
  const b = e.target.closest("button");
  if(!b) return;
  if(b.dataset.tab){ spiel.tab = b.dataset.tab; speichern(); zeichnen(); }
  else if(b.dataset.koltab){ spiel.kolonieTab = b.dataset.koltab; speichern(); zeichnen(); }
  else if(b.dataset.kolonie){ spiel.auswahl = +b.dataset.kolonie; speichern(); zeichnen(); }
  else if(b.dataset.ansicht){ spiel.ansicht = b.dataset.ansicht; speichern(); zeichnen(); }
  else if(b.dataset.sonde)        sondeSenden(+b.dataset.sonde);
  else if(b.dataset.kolonisieren) kolonisieren(+b.dataset.kolonisieren);
  else if(b.dataset.bd)           baueDistrikt(+b.dataset.id, b.dataset.bd);
  else if(b.dataset.gb)           baueGebaeude(+b.dataset.id, b.dataset.gb);
  else if(b.dataset.zu)           zuweisen(+b.dataset.id, b.dataset.zu, +b.dataset.delta);
  else if(b.dataset.tech)         erforsche(b.dataset.tech);
  else if(b.dataset.schiff)       schiffBauen(b.dataset.schiff);
  else if(b.dataset.sammeln){
    const n = flotteFrei("frachter");
    if(n > 0) starteMission("sammeln", +b.dataset.sammeln, { frachter:n });
  }
  else if(b.dataset.angriff){
    const flotte = {};
    for(const t of ["jaeger","korvette","kreuzer"]) if(flotteFrei(t)>0) flotte[t] = flotteFrei(t);
    if(Object.keys(flotte).length) starteMission("angriff", +b.dataset.angriff, flotte);
  }
});
document.getElementById("reset").addEventListener("click", () => {
  if(confirm("Spielstand wirklich löschen? Die Galaxie wird neu erzeugt.")){
    localStorage.removeItem("aussenposten8");
    spiel = neuesSpiel();
    zeichnen();
  }
});

/* ------------------------------------------------------------
   Sternenfeld — einmal erzeugt, danach reines Bild.
   Zwei Ebenen mit unterschiedlicher Dichte geben etwas Tiefe.
   ------------------------------------------------------------ */
function sternenFeld(anzahl, kachel, maxRadius, deckkraft){
  let punkte = "";
  for(let i=0;i<anzahl;i++){
    const x = (Math.random()*kachel).toFixed(1);
    const y = (Math.random()*kachel).toFixed(1);
    const r = (0.35 + Math.random()*maxRadius).toFixed(2);
    const o = (0.25 + Math.random()*deckkraft).toFixed(2);
    // wenige Sterne bekommen einen Farbstich, wie echte Sternfelder
    const w = Math.random();
    const farbe = w > 0.94 ? "#bcd4ff" : w > 0.88 ? "#ffe0bd" : "#ffffff";
    punkte += `<circle cx="${x}" cy="${y}" r="${r}" fill="${farbe}" opacity="${o}"/>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${kachel}" height="${kachel}">${punkte}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
document.getElementById("sterne").style.backgroundImage  = sternenFeld(190, 420, 0.75, 0.45);
document.getElementById("sterne2").style.backgroundImage = sternenFeld(70, 300, 1.15, 0.65);

fortschreiben(); zeichnen();
setInterval(()=>{ fortschreiben(); zeichnen(); }, 1000);
setInterval(speichern, 5000);
window.addEventListener("beforeunload", speichern);
