<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aussenposten — Etappe 28</title>
<style>
  :root{
    /* Leitstand-Palette: tiefes Vakuum, Stahlblau, Signalfarben */
    --raum:#060b13; --konsole:#0e1826; --konsole2:#152337; --kante:#23384f;
    --kante-hell:#31506f;
    --text:#dae5f1; --matt:#7b93ac; --schwach:#4d647c;
    --signal:#56d6c6; --bernstein:#f0a63c; --alarm:#e2635c;
    --energiezellen:#f0cf4a; --erz:#dd8b64; --silikat:#9fb0c2; --kupfer:#e08048;
    --nahrung:#87cf85; --wasserstoff:#77c2e8; --kohlenstoff:#93939f; --legierung:#cbaf66;
    --forschung:#b58ce8;
    --daten:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    /* Reines Schwarz — freigestellte Objekte fügen sich nahtlos ein */
    background: #000005;
    background-attachment:fixed;
    color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  .zahl,.daten{font-family:var(--daten);font-variant-numeric:tabular-nums}

  /* Sternenfeld: liegt hinter allem, bewegt sich beim Scrollen leicht mit */
  #sterne{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-repeat:repeat;
  }
  #sterne.nah{opacity:.9}
  #sterne.fern{opacity:.55}

  /* Planetenbilder bekommen einen leisen Lichtsaum statt eines Kastens */
  .weltbild{ object-fit:contain; }

  /* Schiffskachel — rechteckig mit weichem Rand statt freigestellt */
  .schiffbild{
    flex:none; width:74px; height:74px; object-fit:cover;
    border-radius:8px; border:1px solid var(--kante);
  }
  .schiffbild.klein{ width:46px; height:46px; border-radius:6px }

  /* ---------- Kopfleiste, klebt beim Scrollen ---------- */
  .kopf{
    position:sticky; top:0; z-index:30;
    background:rgba(4,8,16,.94);
    backdrop-filter:blur(9px);
    border-bottom:1px solid var(--kante);
  }
  .kopfinhalt{max-width:960px;margin:0 auto;padding:9px 12px 0}
  .marke{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .marke h1{
    font-size:16px;margin:0;letter-spacing:.28em;text-transform:uppercase;font-weight:600;
  }
  .marke .kennung{font-family:var(--daten);font-size:10.5px;color:var(--schwach);letter-spacing:.09em}

  /* Ressourcenstreifen — waagerecht scrollbar statt umbrechend */
  /* Bricht in eine zweite Reihe um, statt zu scrollen: Seit Etappe 31
     sind die Kacheln schmal genug, und auf dem Handy ist Umbruch besser
     ablesbar als Wischen. */
  .streifen{
    display:flex;flex-wrap:wrap;gap:5px;padding:9px 0 10px;
  }
  .streifen::-webkit-scrollbar{display:none}
  /* Etappe 31: Symbol statt Textetikett — dadurch passt eine Ressource in
     rund die halbe Breite, und der Streifen bleibt auch bei dreizehn
     Stoffen in einer Zeile lesbar. Der Name steht im Tooltip. */
  .posten{
    flex:0 0 auto;min-width:0;
    display:flex;align-items:center;gap:7px;
    background:var(--konsole);border:1px solid var(--kante);border-radius:6px;
    padding:5px 10px 5px 9px;position:relative;overflow:hidden;
  }
  .posten::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ton)}
  .posten .res-sym{flex:none;color:var(--ton);display:block}
  .posten .werte-block{display:flex;flex-direction:column;line-height:1.15}
  .posten .stand{font-family:var(--daten);font-size:15px;font-weight:600}
  .posten .fluss{font-family:var(--daten);font-size:10px;color:var(--signal);white-space:nowrap}
  .posten .fluss.minus{color:var(--alarm)}
  /* Symbole ausserhalb des Streifens erben die Textfarbe */
  .res-sym{vertical-align:-2px}

  /* ---------- Hauptnavigation ---------- */
  .nav{display:flex;gap:0;border-top:1px solid var(--kante);overflow-x:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{
    flex:1 0 auto;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--matt);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    font-weight:600;padding:11px 15px;border-radius:0;white-space:nowrap;
  }
  .nav button.an{color:var(--text);border-bottom-color:var(--signal)}
  .nav button .zeiger{
    display:inline-block;min-width:16px;margin-left:6px;padding:0 5px;border-radius:9px;
    background:var(--konsole2);color:var(--signal);font-family:var(--daten);font-size:10px;
    letter-spacing:0;
  }
  .nav button .zeiger.warn{background:#3a2410;color:var(--bernstein)}

  main{max-width:960px;margin:0 auto;padding:15px 12px 0}

  /* ---------- Überschriften ---------- */
  .rubrik{
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
    margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--kante);
  }
  .rubrik h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--matt);
             margin:0;font-weight:600}
  .rubrik .zusatz{font-size:12px;color:var(--schwach)}

  /* ---------- Flächen ---------- */
  .flaeche{background:var(--konsole);border:1px solid var(--kante);border-radius:9px;padding:14px 15px}
  /* Die Karte bleibt schwarz wie der Weltraum dahinter */
  .karte{background:#000005;border:1px solid var(--kante);border-radius:9px;padding:5px;
         overflow:hidden;position:relative}
  .karte svg{display:block;width:100%;height:auto;touch-action:manipulation}
  .punkt{cursor:pointer}
  .punkt:hover circle:last-of-type{filter:brightness(1.25)}

  /* Brotkrumen */
  .pfad{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px;
        font-size:12px;color:var(--schwach)}
  .pfad button{background:var(--konsole);border:1px solid var(--kante);color:var(--matt);
               font-size:12px;font-weight:400;padding:4px 10px;letter-spacing:.04em}
  .pfad button:hover{color:var(--text);border-color:var(--kante-hell)}

  /* Untergeordnete Reiter */
  .unterreiter{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0 0}
  .unterreiter button{
    background:var(--konsole);border:1px solid var(--kante);color:var(--matt);
    font-size:12.5px;font-weight:400;padding:6px 13px;letter-spacing:.04em;
  }
  .unterreiter button.an{background:var(--konsole2);border-color:var(--signal);color:var(--text)}

  /* ---------- Kolonie-Kopf mit Planetenscheibe ---------- */
  .weltkopf{display:flex;gap:15px;align-items:flex-start;flex-wrap:wrap}
  .scheibe{flex:none;width:88px;height:88px}
  .weltdaten{flex:1 1 220px;min-width:0}
  .weltdaten .name{font-size:19px;font-weight:600;letter-spacing:.02em}
  .weltdaten .gattung{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--signal)}
  .weltdaten .lage{font-size:13px;color:var(--matt);margin-top:5px}

  .messwerte{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:14px}
  .mess{border-left:2px solid var(--kante);padding-left:9px}
  .mess .k{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--matt)}
  .mess .v{font-family:var(--daten);font-size:16px;font-weight:600}
  .mess .v.warn{color:var(--bernstein)} .mess .v.rot{color:var(--alarm)}

  /* ---------- Meldungen ---------- */
  .meldung{font-size:12.5px;padding:8px 11px;border-radius:6px;margin-top:7px;
           background:#2a2110;border-left:2px solid var(--bernstein)}
  .meldung.rot{background:#2c1719;border-left-color:var(--alarm)}
  .meldung.gut{background:#0f2a2b;border-left-color:var(--signal)}

  /* ---------- Listenzeilen ---------- */
  .posten-zeile{
    background:var(--konsole);border:1px solid var(--kante);border-radius:8px;
    padding:11px 13px;margin-bottom:7px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  }
  .posten-zeile:hover{border-color:var(--kante-hell)}
  .posten-zeile.erschoepft{opacity:.45}
  .posten-zeile .rumpf{flex:1 1 230px;min-width:0}
  .bezeichnung{font-weight:600;font-size:14.5px}
  .stufe{font-family:var(--daten);color:var(--signal);font-weight:400;font-size:13px}
  .erlaeuterung{font-size:12.5px;color:var(--matt);margin-top:2px}
  .werte{font-family:var(--daten);font-size:11.5px;margin-top:5px;display:flex;gap:11px;
         flex-wrap:wrap;color:var(--schwach)}
  .werte .fehlt{color:var(--bernstein)}

  /* Balkenanzeige für Felderauslastung */
  .felder{display:flex;gap:2px;margin-top:6px}
  .felder i{flex:1;height:4px;background:var(--konsole2);border-radius:1px;max-width:16px}
  .felder i.belegt{background:var(--signal)}

  /* Zuweisungsregler */
  .regler{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--matt);
          background:var(--konsole2);border:1px solid var(--kante);border-radius:7px;padding:3px 5px}
  .regler b{font-family:var(--daten);color:var(--text);min-width:13px;text-align:center;font-size:13px}
  .regler button{padding:1px 8px;font-size:14px;background:var(--raum);color:var(--text);
                 border:1px solid var(--kante);font-weight:600;border-radius:5px;line-height:1.3}
  .regler button:disabled{opacity:.28}

  /* ---------- Knöpfe ---------- */
  button{
    font:inherit;font-size:13.5px;padding:8px 15px;border-radius:7px;cursor:pointer;border:none;
    background:var(--signal);color:#04211f;font-weight:600;letter-spacing:.04em;
    transition:filter .12s ease;
  }
  button:hover:not(:disabled){filter:brightness(1.1)}
  button:disabled{background:var(--konsole2);color:var(--schwach);cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--bernstein);outline-offset:2px}
  button.still{background:var(--konsole2);color:var(--text);border:1px solid var(--kante)}
  button.forsch{background:var(--forschung);color:#160d27}

  /* ---------- Laufende Vorgänge ---------- */
  .vorgang{background:var(--konsole2);border:1px solid var(--kante-hell);border-radius:8px;
           padding:11px 13px;margin-bottom:8px}
  .vorgang .zeile1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .vorgang .rest{font-family:var(--daten);font-size:12.5px;color:var(--signal)}
  .schiene{height:4px;background:var(--raum);border-radius:2px;overflow:hidden;margin-top:8px}
  .schiene i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--kante-hell))}

  .fuss{max-width:960px;margin:34px auto 0;padding:0 12px;font-size:11.5px;color:var(--schwach);
        display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .fuss button{background:none;border:1px solid var(--kante);color:var(--matt);font-size:11.5px;
               padding:5px 11px;font-weight:400}

  /* Fundstück-Fenster */
  #fundhuelle{position:fixed;inset:0;z-index:60;display:none;place-items:center;
    background:rgba(3,6,12,.86);backdrop-filter:blur(4px);padding:16px}
  #fundhuelle.an{display:grid}
  .fundkasten{background:var(--konsole);border:1px solid var(--kante-hell);border-radius:11px;
    padding:20px 22px;max-width:460px;width:100%}
  .fundkasten h3{margin:0 0 4px;font-size:18px;font-weight:600}
  .fundbahn{position:relative;height:38px;background:var(--raum);border:1px solid var(--kante);
    border-radius:7px;margin:16px 0 8px;overflow:hidden;cursor:pointer}
  .fundzone{position:absolute;top:0;bottom:0;background:rgba(86,214,198,.22);
    border-left:1px solid var(--signal);border-right:1px solid var(--signal)}
  .fundzeiger{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--bernstein);
    box-shadow:0 0 8px var(--bernstein)}
  .fundpunkte{display:flex;gap:5px;margin-top:10px}
  .fundpunkte i{width:100%;height:4px;border-radius:2px;background:var(--konsole2)}
  .fundpunkte i.voll{background:var(--signal)}
  .fundpunkte i.leer{background:var(--alarm);opacity:.5}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Etappe 30: schmale Zeile für seltene Stoffe unter dem Ressourcenstreifen */
.selten-zeile{ display:flex; gap:14px; align-items:center; flex-wrap:wrap;
  width:100%; padding:5px 2px 1px; margin-top:2px;
  border-top:1px solid var(--kante); }
.selten-posten{ display:flex; align-items:center; gap:5px; font-size:12px; }
.selten-posten svg{ flex:none; }
.selten-posten .zahl{ font-size:12.5px; }
</style>
</head>
<body>
<div id="sterne" class="fern"></div>
<div id="sterne2" class="nah" style="position:fixed;inset:0;z-index:-1;pointer-events:none"></div>

<header class="kopf">
  <div class="kopfinhalt">
    <div class="marke">
      <h1>Aussenposten</h1>
      <span class="kennung" id="kennung"></span>
    </div>
    <div class="streifen" id="streifen"></div>
  </div>
  <nav class="nav" id="nav"></nav>
</header>

<main id="buehne"></main>

<div id="fundhuelle"><div class="fundkasten" id="fundkasten"></div></div>

<div class="fuss">
  <span>Der Spielstand liegt im Browser dieses Geräts.</span>
  <button id="reset">Neu anfangen</button>
</div>

<script>
/* ============================================================
   0. STELLSCHRAUBEN
   ============================================================ */
const TEMPO = 1;
const TESTSTART = true;          // true = alle Gebäude auf Maximalstufe, Lager voll
const NAHRUNG_PRO_KOPF = 10;     // je Bewohner und Stunde
const BONUS_PRO_KOPF = 0.10;     // +10 % Ertrag je zugewiesener Person
const MAX_ZUWEISUNG = 5;         // höchstens 5 Personen je Distriktgruppe / Gebäude
const KOSTEN_STEIGERUNG = 1.30;  // Gebäudestufe: 30 % teurer
const ERTRAG_STEIGERUNG = 1.20;  // Gebäudestufe: 20 % mehr Ertrag
const START_MAX_PLANETEN = 5;
const START_MAX_HABITATE = 5;
const FRACHTER_KAPAZITAET = 400;   // Ladung je Frachter und Sammelmission
const KAMPF_RUNDEN = 8;            // Höchstzahl der Gefechtsrunden
/* Etappe 27 neu eingestellt: Seit Restschaden über Runden stehenbleibt
   (siehe verlusteAnwenden) kommt mehr Schaden an, deshalb ist der Faktor
   niedriger und die Streuung höher als zuvor. Ergebnis: Bei gleicher
   Stärke verliert man, bei 1,25-facher Übermacht ist der Ausgang offen
   (rund 7 von 10), ab 1,5-facher ist der Sieg sicher. */
const SCHADEN_STREUUNG = 0.28;     // Zufall auf den Rundenschaden
const SCHADEN_FAKTOR = 0.75;       // dämpft den Rundenschaden — kleiner = längere Gefechte
const PANZER_ZU_LEBEN = 7;         // wie viel Widerstandskraft ein Punkt Panzerung gibt

/* Kontertabelle: Was richtet die Zeile gegen die Spalte aus?
   Über 1 = stark dagegen, unter 1 = schwach.
   Jäger sind zu wendig für schwere Geschütze, reissen aber schwere
   Schiffe auf. Korvetten fangen Jäger ab. Kreuzer zermalmen Korvetten. */
/* Jede Konterrolle gibt es leicht und schwer: Jäger/Zerstörer kontern
   schwere Schiffe, Korvette/Fregatte kontern leichte, Kreuzer/Schlachtschiff
   kontern mittlere. Die schwere Ausführung hat dieselben Konterwerte —
   sie ist nicht besser, nur haltbarer und teurer. Die Mischung zählt
   weiterhin, es gibt nur mehr Wege zu ihr. */
const KONTER = {
  jaeger:        { jaeger:1.0, zerstoerer:1.0, korvette:0.6, fregatte:0.6, kreuzer:1.7, schlachtschiff:1.7, pirat:1.0 },
  zerstoerer:    { jaeger:1.0, zerstoerer:1.0, korvette:0.6, fregatte:0.6, kreuzer:1.7, schlachtschiff:1.7, pirat:1.0 },
  korvette:      { jaeger:1.8, zerstoerer:1.8, korvette:1.0, fregatte:1.0, kreuzer:0.7, schlachtschiff:0.7, pirat:1.1 },
  fregatte:      { jaeger:1.8, zerstoerer:1.8, korvette:1.0, fregatte:1.0, kreuzer:0.7, schlachtschiff:0.7, pirat:1.1 },
  kreuzer:       { jaeger:0.5, zerstoerer:0.5, korvette:1.6, fregatte:1.6, kreuzer:1.0, schlachtschiff:1.0, pirat:1.2 },
  schlachtschiff:{ jaeger:0.5, zerstoerer:0.5, korvette:1.6, fregatte:1.6, kreuzer:1.0, schlachtschiff:1.0, pirat:1.2 },
  pirat:         { jaeger:1.1, zerstoerer:1.1, korvette:1.0, fregatte:1.0, kreuzer:0.9, schlachtschiff:0.9, pirat:1.0, landungsschiff:1.6 },
};
/* ============================================================
   GEFECHTSZONEN  (Etappe 27)
   Der Kampf kennt keine Positionen — aber er kennt Zielanteile.
   Eine Zone ist deshalb nichts weiter als ein Gewicht darauf:
   Wer vorn steht, zieht Feuer, wer hinten steht, wird selten
   getroffen. Daraus ergibt sich von selbst, dass eine Flotte eine
   Front braucht: Eine reine Artillerieflotte hat niemanden, der
   das Feuer bindet, und wird restlos aufgerieben.
   Bewusst weich gewichtet statt harter Reihenfolge — sonst ist die
   vordere Reihe reines Verbrauchsmaterial und die hintere
   unantastbar.
   ============================================================ */
/* schutz = wie stark eine Zone von einer vollen Front gedeckt wird.
   Entscheidend ist, dass der Schutz von der TATSÄCHLICHEN Front abhängt
   und nicht bloss von den Anteilen innerhalb der eigenen Flotte:
   Sonst wäre in einer reinen Artillerieflotte "hinten" wieder gleich
   100 % des Feuers, und die fehlende Front bliebe folgenlos. */
const ZONEN = {
  front:  { name:"Vordere Linie", schutz:0.00,
            beschreibung:"Bindet das gegnerische Feuer und deckt die anderen." },
  mitte:  { name:"Mittlere Linie", schutz:0.55,
            beschreibung:"Trägt den Kampf, solange die Front hält." },
  hinten: { name:"Hintere Linie", schutz:0.90,
            beschreibung:"Wird kaum getroffen — aber nur, solange vorn jemand steht." },
};
// Wie gut ist eine Flotte gedeckt? Anteil der Frontschiffe, gesättigt bei 40 %.
const DECKUNG_SAETTIGUNG = 0.40;
function deckungsgrad(flotte){
  let vorn = 0, gesamt = 0, zusatz = 0;
  for(const t in flotte){
    const n = flotte[t]; if(!n) continue;
    gesamt += n;
    if(zoneVon(t) === "front") vorn += n;
    // Bollwerkschiffe schirmen ab: sie heben die Deckung über den reinen Anteil
    if(SCHIFFE[t] && SCHIFFE[t].deckungsbonus) zusatz += SCHIFFE[t].deckungsbonus * n;
  }
  if(!gesamt) return 0;
  return Math.min(1, (vorn/gesamt) / DECKUNG_SAETTIGUNG + Math.min(0.5, zusatz/gesamt));
}
function zoneVon(typ){
  const d = SCHIFFE[typ];
  return (d && d.zone) || "mitte";
}
/* Zielgewicht eines Schiffs: voll beschossen, wenn keine Front steht,
   und um den Zonenschutz gemindert, je besser die Front gedeckt ist. */
function zonenGewicht(typ, deckung){
  return 1 - (deckung || 0) * ZONEN[zoneVon(typ)].schutz;
}

/* Welche Konterrolle ein Schiff spielt. Beuteschiffe tragen hier ihre
   Sonderregel: mehrere Rollen, wechselnde Rolle oder gar keine. */
function konterZeile(typ){
  const d = SCHIFFE[typ];
  if(!d) return KONTER.pirat;
  if(d.konterRolle) return KONTER[d.konterRolle] || KONTER.pirat;
  return KONTER[typ] || KONTER.pirat;
}
/* --- Bodenoffensive ---
   Absichtlich dieselben Formeln wie im Raumkampf: gleiche Rundenzahl,
   gleiche Streuung, gleicher Umgang mit Verlusten. Nur die Konter und
   der Geländevorteil des Verteidigers sind eigen. */
const BODEN_RUNDEN = 8;
const TRUPPEN_JE_LANDUNGSSCHIFF = 20;  // Ladekapazität eines Landungsschiffs
const BELAGERUNG_GRUND = 4*3600;       // Sekunden Grundzeit vor dem Sturm
const BELAGERUNG_JE_KOPF = 900;        // zusätzlich je Bewohner der Zielwelt
const BELAGERUNG_ZERMUERBUNG = 0.30;   // so viel Garnison zerfällt über die volle Belagerung
/* Eigene Werte für den Boden — der Raumkampf bleibt davon unberührt.
   Niedriger Schadensfaktor und höhere Streuung ergeben längere,
   offenere Gefechte: Bei gleicher Truppenzahl gewinnt der Verteidiger,
   bei 1,25-facher Übermacht ist der Ausgang offen (etwa 6 von 10),
   ab 1,5-facher Übermacht ist der Sieg sicher. */
const BODEN_SCHADEN_FAKTOR = 0.42;
const BODEN_STREUUNG = 0.45;
const BODEN_PANZER_ZU_LEBEN = 6;

/* Konterdreieck am Boden — dieselbe Idee wie im Orbit:
   Die Mischung entscheidet, nicht die Menge.
   Infanterie überrennt ungeschützte Geschützstellungen. Panzer
   walzen Infanterie nieder. Artillerie knackt Panzer auf Distanz. */
const KONTER_BODEN = {
  infanterie: { infanterie:1.0, panzer:0.6, artillerie:1.7 },
  panzer:     { infanterie:1.8, panzer:1.0, artillerie:0.7 },
  artillerie: { infanterie:0.6, panzer:1.6, artillerie:1.0 },
};

/* Geländevorteil des Verteidigers je Weltentyp.
   Bewusst hier und nicht im Programmablauf — Zahlen gehören in Tabellen. */
const GELAENDE = {

   5. TECHNOLOGIEN — bewusst kurz gehalten

const TECHS = {
  kolonierecht:{ name:"Koloniale Ausdehnung", kosten:400, steigerung:1.8, wiederholbar:true,
                 wirkung:"+1 besiedelbarer Planet" },
  habitattechnik:{ name:"Habitattechnik", kosten:400, steigerung:1.8, wiederholbar:true,

                 wirkung:"Distrikte kosten 20 % weniger" },

/* ============================================================
   6. KARTE ERZEUGEN
   ============================================================ */
const SYSNAMEN = ["Kaldar","Veyra","Thessa","Orun","Mirak","Sevesh","Dalun","Aphex",
                  "Rhoven","Nemea","Calyx","Ostara","Tirith","Vandu","Halix","Zoran"];
const ROEM = ["I","II","III","IV","V","VI"];
function rnd(){ return Math.random(); }
function zwischen(a,b){ return a + Math.floor(rnd()*(b-a+1)); }
function waehle(liste){ return liste[Math.floor(rnd()*liste.length)]; }

function karteErzeugen(){
  const planetTypen  = Object.keys(OBJEKTE).filter(t => OBJEKTE[t].art === "planet");
  const habitatTypen = Object.keys(OBJEKTE).filter(t => OBJEKTE[t].art === "habitat");
  const systeme = [], objekte = {};
  const namen = [...SYSNAMEN];
  let objId = 0;

  for(let i=0;i<9;i++){
    const ring = i===0 ? 0 : 1 + Math.floor((i-1)/4);
    /* Position würfeln, bis der Mindestabstand zu allen bisherigen Systemen
       eingehalten ist — sonst überdecken sich Systeme samt Beschriftung
       auf der Galaxiekarte. */
    let winkel = rnd()*Math.PI*2;
    let radius = i===0 ? 0 : ring*27 + rnd()*9;
    let px = 50 + Math.cos(winkel)*radius, py = 50 + Math.sin(winkel)*radius*0.62;
    for(let v=0; v<40 && i>0; v++){
      const zuNah = systeme.some(o => Math.hypot(o.x-px, (o.y-py)/0.62) < 22);
      if(!zuNah) break;
      winkel = rnd()*Math.PI*2;
      radius = ring*27 + rnd()*9;
      px = 50 + Math.cos(winkel)*radius; py = 50 + Math.sin(winkel)*radius*0.62;
    }
    const name = namen.splice(Math.floor(rnd()*namen.length),1)[0];
    // Sterntyp: gleiche Chance für alle
    const sternTypen = Object.keys(STERNE);
    const sys = { id:i, name, x:px, y:py,
                  erkundet: i===0, objekte:[],
                  stern: sternTypen[Math.floor(rnd()*sternTypen.length)] };

    const anzahl = zwischen(3,6);
    for(let j=0;j<anzahl;j++){
      // Erstes Objekt im Heimatsystem ist immer ein Ozeanplanet — ein fairer Start
      let typ;
      if(i===0 && j===0) typ = "ozean";
      else typ = rnd() < 0.62 ? waehle(planetTypen) : waehle(habitatTypen);

      const def = OBJEKTE[typ], felder = {};
      for(const d in def.felder){
        const [min,max] = def.felder[d];
        felder[d] = zwischen(min,max);
      }
      // Ein Fünftel aller Objekte ist bereits bewohnt — ausser der Heimatwelt
      let fraktion = null;
      if(!(i === 0 && j === 0) && rnd() < BESIEDELT_ANTEIL){
        const pl = Object.keys(PARTEIEN);
        fraktion = pl[Math.floor(rnd()*pl.length)];
      }
      // Strategisches Vorkommen — Eigenschaft der Welt, kein Distrikt
      let vorkommen = null;
      const passend = Object.keys(STRATEGISCH).filter(v =>
        STRATEGISCH[v].vorkommenAuf.includes(typ));
      if(passend.length && rnd() < VORKOMMEN_CHANCE)
        vorkommen = passend[Math.floor(rnd()*passend.length)];

      objekte[objId] = { id:objId, systemId:i, typ, name:`${name} ${ROEM[j]}`,
                         felder, fraktion, vorkommen };
      // Fremde Welten bringen von Anfang an eine Garnison mit
      if(fraktion) objekte[objId].garnison = garnisonErzeugen(objekte[objId]);
      sys.objekte.push(objId);
      objId++;
    }
    // Piratenlager — blockiert Besiedlung, bis es zerschlagen ist
    if(i === 0 || rnd() < 0.45){
      sys.piraten = null;
    }else{
      const arten = Object.keys(PIRATEN_ARTEN);
      const art = arten[Math.floor(rnd()*arten.length)];
      const staerke = 8 + Math.floor(rnd()*20) + ring*7;   // Schiffe insgesamt
      sys.piraten = { art, flotte: piratenFlotte(art, staerke) };
    }
    systeme.push(sys);
  }
  return { systeme, objekte };
}

/* ============================================================
   7. SPIELSTAND
   ============================================================ */
// Habitate dürfen vorerst ausschliesslich die Lagerhalle bauen
const HABITAT_GEBAEUDE = ["lagerhalle","habitatmodul"];
function erlaubteGebaeude(objId){
  const art = OBJEKTE[spiel.objekte[objId].typ].art;
  return art === "habitat" ? HABITAT_GEBAEUDE
       : Object.keys(GEBAEUDE).filter(s => s !== "habitatmodul");
}

function neueKolonie(objId, objekteMap){
  const karte = objekteMap || (typeof spiel !== "undefined" ? spiel.objekte : null);
  const art = (objId != null && karte) ? OBJEKTE[karte[objId].typ].art : "planet";
  const erlaubt = art === "habitat" ? HABITAT_GEBAEUDE : Object.keys(GEBAEUDE);
  const g = {};
  for(const s in GEBAEUDE)
    g[s] = !erlaubt.includes(s) ? 0 : (TESTSTART ? GEBAEUDE[s].maxLevel : GEBAEUDE[s].startLevel);
  const d = {};
  for(const s in DISTRIKTE) d[s] = 0;
  return { distrikte:d, gebaeude:g, bev:0, wachstum:0, zuweisung:{}, bau:null };
}

function neuesSpiel(){
  const k = karteErzeugen();
  const res = {};
  for(const r of RES) res[r] = TESTSTART ? 50000 : 800;
  const heimatId = k.systeme[0].objekte[0];
  const heimat = neueKolonie(heimatId, k.objekte);
  heimat.bev = 5;
  // Ein paar Startdistrikte, damit sofort etwas läuft
  heimat.distrikte.solarfarm = 2;
  heimat.distrikte.eisenmine = 2;
  heimat.distrikte.silikatmine = 1;
  heimat.distrikte.landwirtschaft = 2;

  const schiffe = {};
  for(const t in SCHIFFE) schiffe[t] = TESTSTART ? 20 : 0;
  const truppen = {};
  for(const t in TRUPPEN) truppen[t] = TESTSTART ? 60 : 0;
  // Im Testmodus ist die ganze Karte offen — sonst prüft man Systemansichten
  // immer erst nach mühsamem Sondenversand
  if(TESTSTART) for(const sy of k.systeme) sy.erkundet = true;
  if(TESTSTART) k.systeme.forEach(sy => { if(sy.selten !== undefined){} });
  return { systeme:k.systeme, objekte:k.objekte, res, forschung: TESTSTART ? 2000 : 0,
           schiffe, truppen, kaserneauftrag:null, missionen:[], werftauftrag:null,
           fragmente:{}, bergemarken:0, gesehen:{}, geleit:null, geleitAb:0,
           beginn:Date.now(), ueberfall:null, ueberfallAb:0,
           ereignis:null, ereignisAb:0, ueberlauf:{},
           cluster:[], clusterAb:0, selten:{},
           kolonien:{ [heimatId]: heimat }, techs:{},
           sonde:null, kolonieflug:null,
           ansicht:"galaxie", offenesSystem:0, auswahl:heimatId,
           zuletzt:Date.now() };
}

let spiel = laden();
function laden(){
  try{
    const roh = localStorage.getItem("aussenposten8");
    if(!roh) return neuesSpiel();
    const s = JSON.parse(roh);
    if(!s.systeme || !s.objekte) return neuesSpiel();
    for(const id in s.kolonien){
      const k = s.kolonien[id];
      for(const d in DISTRIKTE) if(!(d in k.distrikte)) k.distrikte[d]=0;
      for(const g in GEBAEUDE)  if(!(g in k.gebaeude))  k.gebaeude[g]=0;
      if(!k.zuweisung) k.zuweisung = {};
    }
    if(!s.techs) s.techs = {};
    if(!Array.isArray(s.anomalien)) s.anomalien = [];
    if(!s.handel) s.handel = {};
    if(!s.diplomatie) s.diplomatie = {};
    for(const oid in s.objekte)
      if(s.objekte[oid].fraktion === undefined) s.objekte[oid].fraktion = null;
    for(const oid in s.objekte)
      if(s.objekte[oid].vorkommen === undefined) s.objekte[oid].vorkommen = null;
    if(!s.schiffe) s.schiffe = {};
    for(const t in SCHIFFE) if(!(t in s.schiffe)) s.schiffe[t] = 0;
    // --- Etappe 23: Bodenoffensive in alte Spielstände ergänzen ---
    if(!s.truppen) s.truppen = {};
    for(const t in TRUPPEN) if(!(t in s.truppen)) s.truppen[t] = 0;
    if(!("kaserneauftrag" in s)) s.kaserneauftrag = null;
    // --- Etappe 26: Blaupausen in alte Spielstände ergänzen ---
    if(!s.fragmente) s.fragmente = {};
    if(!("bergemarken" in s)) s.bergemarken = 0;
    if(!s.gesehen) s.gesehen = {};
    if(!("geleit" in s)) s.geleit = null;
    if(!("geleitAb" in s)) s.geleitAb = 0;
    // --- Etappe 28 ---
    if(!("beginn" in s)) s.beginn = Date.now();
    if(!("ueberfall" in s)) s.ueberfall = null;
    if(!("ueberfallAb" in s)) s.ueberfallAb = 0;
    if(!("ereignis" in s)) s.ereignis = null;
    if(!("ereignisAb" in s)) s.ereignisAb = 0;
    if(!s.ueberlauf) s.ueberlauf = {};
    // --- Etappe 29 ---
    if(!Array.isArray(s.cluster)) s.cluster = [];
    if(!("clusterAb" in s)) s.clusterAb = 0;
    // --- Etappe 30 ---
    if(!s.selten) s.selten = {};
    for(const t in SELTEN) if(!(t in s.selten)) s.selten[t] = 0;
    /* Bestehende Karten entzerren: Systeme, die sich überlagern, werden
       paarweise auseinandergeschoben. Wenige Durchläufe genügen, und die
       Grundanordnung bleibt erhalten. */
    for(let runde=0; runde<24; runde++){
      let bewegt = false;
      for(const a of s.systeme) for(const b of s.systeme){
        if(a.id >= b.id) continue;
        const dx = b.x-a.x, dy = (b.y-a.y)/0.62;
        const abstand = Math.hypot(dx, dy) || 0.001;
        if(abstand < 20){
          const schub = (20-abstand)/2, nx = dx/abstand, ny = dy/abstand;
          a.x -= nx*schub; a.y -= ny*schub*0.62;
          b.x += nx*schub; b.y += ny*schub*0.62;
          bewegt = true;
        }
      }
      if(!bewegt) break;
    }
    for(const sy of s.systeme){
      sy.x = Math.min(90, Math.max(10, sy.x));
      sy.y = Math.min(84, Math.max(14, sy.y));
    }

    // Alte Verbandsnamen auf die neuen vier abbilden
    const ALT = { schmuggler:"aschefahrer", freibeuter:"schwarm",
                  kriegsherr:"tiefenwache", festung:"kartell" };
    for(const sid in s.systeme){
      const sy = s.systeme[sid];
      if(sy.piraten && ALT[sy.piraten.art]) sy.piraten.art = ALT[sy.piraten.art];
    }
    for(const oid in s.objekte){
      const o = s.objekte[oid];
      if(o.fraktion && !o.garnison) o.garnison = garnisonErzeugen(o);
      if(!o.fraktion && o.garnison) delete o.garnison;
    }
    if(!Array.isArray(s.missionen)) s.missionen = [];
    for(const m of s.missionen){          // alte Spielstände ergänzen
      if(m.nachSys == null) m.nachSys = m.art === "sammeln" ? s.objekte[m.ziel].systemId : m.ziel;
      if(m.vonSys == null)  m.vonSys = 0;
      if(m.startAb == null) m.startAb = m.endeAb - m.dauer*1000/TEMPO;
    }
    if(!("werftauftrag" in s)) s.werftauftrag = null;
    for(const sy of s.systeme){
      if(!sy.stern){
        const st = Object.keys(STERNE);
        sy.stern = st[Math.floor(Math.random()*st.length)];
      }
      if(!("piraten" in sy)) sy.piraten = null;
      // Alte Spielstände hatten nur eine Zahl — in einen Verband umwandeln
      if(typeof sy.piraten === "number")
        sy.piraten = sy.piraten > 0
          ? { art:"freibeuter", flotte: piratenFlotte("freibeuter", Math.max(6, Math.round(sy.piraten/60))) }
          : null;
    }
    for(const r of RES) if(!(r in s.res)) s.res[r]=0;
    return s;
  }catch(e){ return neuesSpiel(); }
}
// Schlüssel muss mit dem in laden() übereinstimmen — sonst wird nie zurückgelesen
function speichern(){ localStorage.setItem("aussenposten8", JSON.stringify(spiel)); }

/* ============================================================
   8b. BLAUPAUSEN  (Etappe 26)
   Fragmente entstehen ausschliesslich durch Taten, nie durch Zeit.
   Man bekommt Stücke der Bauart, GEGEN DIE man gekämpft hat —
   damit wird die Wahl des Gegners zur Entscheidung.
   ============================================================ */
function fragmentStand(bauart){ return spiel.fragmente[bauart] || 0; }
function bauartFertig(bauart){ return fragmentStand(bauart) >= BAUARTEN[bauart].teile; }
function bauartBekannt(bauart){ return !!spiel.gesehen[BAUARTEN[bauart].verband]; }
// Ein Schiff ist baubar, wenn seine Blaupause vollständig ist
function schiffFreigeschaltet(typ){
  const d = SCHIFFE[typ];
  return !d.bauart || bauartFertig(d.bauart);
}

/* Ein Fragment gutschreiben. Ist die Bauart schon vollständig,
   wird daraus eine Bergemarke — kein Fund ist je verschwendet. */
function fragmentGeben(bauart){
  if(!BAUARTEN[bauart]) return null;
  if(bauartFertig(bauart)){ spiel.bergemarken++; return { bauart, marke:true }; }
  spiel.fragmente[bauart] = fragmentStand(bauart) + 1;
  return { bauart, marke:false, fertig:bauartFertig(bauart) };
}

/* Zieht ein Fragment aus den Bauarten eines Verbands.
   Bevorzugt unvollständige Bauarten, damit man vorankommt. */
function fragmentZiehen(verband){
  const alle = Object.keys(BAUARTEN).filter(b => !verband || BAUARTEN[b].verband === verband);
  if(!alle.length) return null;
  const offen = alle.filter(b => !bauartFertig(b));
  const topf = offen.length ? offen : alle;
  /* Gewichtet nach Seltenheit: Stücke grosser Bauarten tauchen seltener
     auf. Sonst wäre eine 8-Teile-Blaupause nur wenig langwieriger als
     eine 3-Teile-Blaupause, und die Staffelung liefe ins Leere. */
  const gewicht = topf.map(b => 1 / Math.pow(BAUARTEN[b].teile, 1.6));
  const summe = gewicht.reduce((a,b)=>a+b,0);
  let wurf = Math.random() * summe;
  for(let i=0;i<topf.length;i++){
    wurf -= gewicht[i];
    if(wurf <= 0) return fragmentGeben(topf[i]);
  }
  return fragmentGeben(topf[topf.length-1]);
}

/* Fundwurf nach einer Tat. anlass steuert die Wahrscheinlichkeit,
   verband die Bauartreihe. schlepper erhöht die Chance. */
function fragmentWurf(anlass, verband, schlepper){
  let p = FRAGMENT_P[anlass] || 0;
  p += (schlepper || 0) * SCHLEPPER_FRAGMENT_P;
  if(Math.random() > Math.min(0.95, p)) return null;
  return fragmentZiehen(verband);
}

// Meldungstext für einen Fund — sonst geht er im Berichtsstapel unter
function fragmentText(f){
  if(!f) return "";
  const n = BAUARTEN[f.bauart].name;
  if(f.marke) return `Ein weiteres Bruchstück der Bauart „${n}" — als Bergemarke verbucht.`;
  if(f.fertig) return `Blaupause „${n}" vollständig! Die Bauart lässt sich jetzt in der Werft bauen.`;
  return `Fragment geborgen: „${n}" (${fragmentStand(f.bauart)} von ${BAUARTEN[f.bauart].teile}).`;
}

// Fehlendes Fragment gegen Bergemarken kaufen
function fragmentKaufen(bauart){
  const preis = markenPreis(bauart);
  if(spiel.bergemarken < preis || bauartFertig(bauart)) return;
  spiel.bergemarken -= preis;
  spiel.fragmente[bauart] = fragmentStand(bauart) + 1;
  speichern(); zeichnen();
}

// Wie viele Schiffe einer Bauart sind im Verband? (für Sonderregeln)
function anzahlIm(schiffe, typ){ return (schiffe && schiffe[typ]) || 0; }

/* ============================================================
   8c. ABWESENHEIT: ÜBERFÄLLE, EREIGNISSE, LAGERÜBERLAUF
   Alle drei folgen demselben Grundsatz: Sie kosten Gelegenheiten
   und Vorräte, niemals Aufgebautes.
   ============================================================ */
function zufallsPartei(){
  const p = Object.keys(PARTEIEN);
  return p[Math.floor(Math.random()*p.length)];
}

/* --- Überfälle ---------------------------------------------
   Werden IMMER angekündigt und laufen erst nach der Vorwarnzeit ab.
   Wer sie sieht, kann die Flotte heimholen und Vorräte verbauen.
   Wer nicht da war, verliert Rohstoffe und einen Teil der Flotte —
   aber keine Kolonie, kein Gebäude, keinen Distrikt.
   ------------------------------------------------------------ */
function groessteKolonie(){
  let best = null, gross = 0;
  for(const id in spiel.kolonien){
    const k = spiel.kolonien[id];
    let n = k.bev || 0;
    for(const d in k.distrikte) n += k.distrikte[d];
    if(n > gross){ gross = n; best = id; }
  }
  return best ? { id:best, groesse:gross } : null;
}

function ueberfallPruefen(jetzt){
  if(spiel.ueberfall) return;                                  // einer läuft bereits
  if(jetzt - (spiel.beginn||jetzt) < UEBERFALL_SCHONFRIST*1000/TEMPO) return;
  if(jetzt < (spiel.ueberfallAb||0)) return;
  if(!spiel.gesehen || !spiel.gesehen.tiefenwache) return;     // erst nach Begegnung
  const k = groessteKolonie();
  if(!k || k.groesse < UEBERFALL_MINDESTGROESSE) return;       // kleine Reiche bleiben in Ruhe

  spiel.ueberfall = {
    ziel: +k.id,
    verband: "tiefenwache",
    faelligAb: jetzt + UEBERFALL_VORWARNUNG*1000/TEMPO,
    staerke: Math.round(k.groesse * 1.2),
  };
  spiel.ueberfallAb = jetzt + (UEBERFALL_VORWARNUNG + UEBERFALL_ABSTAND)*1000/TEMPO;
  meldung(`Die Tiefenwache kündigt einen Zugriff auf ${spiel.objekte[k.id].name} an. `
        + `Frist: ${zeitText(UEBERFALL_VORWARNUNG)}.`, "warnung");
}

/* Wehrt der Bestand ab? Verglichen wird die daheim gebliebene Flotte
   plus die Garnison der Kolonie gegen die Stärke des Überfalls. */
function ueberfallAusfuehren(u){
  const obj = spiel.objekte[u.ziel];
  if(!obj || !spiel.kolonien[u.ziel]){ spiel.ueberfall = null; return; }

  let abwehr = eigeneGarnison(u.ziel) * 12;
  for(const t in spiel.schiffe) abwehr += flotteFrei(t) * ((SCHIFFE[t].angriff||0) + (SCHIFFE[t].panzerung||0)*0.5);
  const gegner = u.staerke * PIRAT_STAERKE_JE_PUNKT;

  if(abwehr >= gegner){
    meldung(`Der Zugriff auf ${obj.name} wurde abgewehrt — die Verteidigung stand bereit.`, "gut");
    spiel.ueberfall = null;
    return;
  }

  // Rohstoffe: gedeckelter Anteil, niemals mehr
  const schwaeche = Math.min(1, 1 - abwehr/Math.max(1,gegner));
  const anteil = UEBERFALL_ANTEIL * schwaeche;
  const weg = {};
  for(const r in spiel.res){
    const n = Math.floor((spiel.res[r]||0) * anteil);
    if(n > 0){ spiel.res[r] -= n; weg[r] = n; }
  }
  // Flotte: ein Teil fällt bei der Abwehr — Kolonie und Gebäude bleiben unangetastet
  let schiffeWeg = 0;
  for(const t in spiel.schiffe){
    const n = Math.floor(flotteFrei(t) * UEBERFALL_SCHIFFE * schwaeche);
    if(n > 0){ spiel.schiffe[t] -= n; schiffeWeg += n; }
  }

  // Nur die drei grössten Posten nennen — acht Zahlen liest niemand
  const posten = Object.keys(weg).sort((a,b)=>weg[b]-weg[a]);
  const liste = posten.slice(0,3).map(r=>`${z0(weg[r])} ${RES_NAMEN[r]}`).join(", ")
    + (posten.length>3 ? ` und ${posten.length-3} weitere Posten` : "");
  meldung(`Zugriff auf ${obj.name}: ${liste} geplündert`
        + (schiffeWeg ? `, ${schiffeWeg} Schiffe verloren` : "")
        + `. Anlagen und Bevölkerung blieben unversehrt.`, "alarm");
  spiel.ueberfall = null;
}

/* --- Ressourcencluster ---------------------------------------
   Erscheinen in erkundeten Systemen. Höchstens vier gleichzeitig; ein neuer
   kommt erst nach Ablauf des Nachschubabstands. Damit ist nichts verpassbar,
   was nicht ohnehin nachwächst — der Vorteil des aktiven Spielers liegt darin,
   Förderflotten umzuschichten, nicht darin, im richtigen Moment da zu sein.
   ------------------------------------------------------------ */
function clusterPruefen(jetzt){
  spiel.cluster = spiel.cluster || [];
  // Verfallene Cluster entfernen; laufende Förderungen kehren dabei heim
  spiel.cluster = spiel.cluster.filter(c => {
    if(jetzt < c.bisAb) return true;
    if(c.vorrat > 0) meldung(`${CLUSTER_ARTEN[c.art].name} bei ${spiel.systeme[c.systemId].name} `
      + `hat sich aufgelöst. Der Rest bleibt ungehoben.`, "");
    return false;
  });

  if(spiel.cluster.length >= CLUSTER_HOECHSTZAHL) return;
  if(jetzt < (spiel.clusterAb||0)) return;
  spiel.clusterAb = jetzt + CLUSTER_NACHSCHUB*1000/TEMPO;
  if(Math.random() > CLUSTER_CHANCE) return;

  const erkundet = spiel.systeme.filter(sy => sy.erkundet);
  if(!erkundet.length) return;
  const sy = erkundet[Math.floor(Math.random()*erkundet.length)];

  /* Welche Cluster hier entstehen können, bestimmt der Sterntyp.
     Der seltene Stoff erscheint deutlich seltener als die gewöhnlichen
     Arten — er ist der Grund, dieses System überhaupt aufzusuchen. */
  const w = STERNE[sy.stern]?.wirkung || {};
  const moeglich = (w.cluster || Object.keys(CLUSTER_ARTEN).filter(a => !CLUSTER_ARTEN[a].selten)).slice();
  if(w.selten && Math.random() < 0.30) moeglich.push(w.selten, w.selten);
  const art = moeglich[Math.floor(Math.random()*moeglich.length)];
  const d = CLUSTER_ARTEN[art];
  if(!d) return;
  const vorrat = Math.round(d.vorrat[0] + Math.random()*(d.vorrat[1]-d.vorrat[0]));

  spiel.cluster.push({
    id: Date.now()+Math.floor(Math.random()*1000),
    art, systemId: sy.id, vorrat, anfangsvorrat: vorrat,
    bisAb: jetzt + d.standzeit*1000/TEMPO,
  });
  meldung(`${d.name} bei ${sy.name} entdeckt — Förderschiffe können abbauen.`, "gut");
}

function clusterVon(id){ return (spiel.cluster||[]).find(c => c.id === id); }
function clusterImSystem(sysId){ return (spiel.cluster||[]).filter(c => c.systemId === sysId); }

/* Fördert für eine Zeitspanne und gibt die Ausbeute zurück.
   Der Vorrat des Clusters sinkt entsprechend — er erschöpft sich also durch
   Abbau, nicht durch Zeit. */
function foerdern(m, sekunden){
  const c = clusterVon(m.ziel);
  if(!c || c.vorrat <= 0) return false;
  const d0 = CLUSTER_ARTEN[c.art];
  let rate = (m.schiffe.foerderschiff||0) * SCHIFFE.foerderschiff.foerderrate;
  if(d0.selten) rate /= SELTEN_FOERDER_TEILER;
  const menge = Math.min(c.vorrat, rate * sekunden/3600);
  if(menge <= 0) return c.vorrat > 0;
  c.vorrat -= menge;

  const d = CLUSTER_ARTEN[c.art];
  m.ladung = m.ladung || {};
  for(const r in d.gibt) m.ladung[r] = (m.ladung[r]||0) + menge * d.gibt[r];
  if(d.gibtSelten){
    m.ladungSelten = m.ladungSelten || {};
    for(const t in d.gibtSelten) m.ladungSelten[t] = (m.ladungSelten[t]||0) + menge * d.gibtSelten[t];
  }
  return c.vorrat > 0;
}

/* --- Ereignisse --------------------------------------------- */
function ereignisPruefen(jetzt){
  if(spiel.ereignis) return;
  if(jetzt < (spiel.ereignisAb||0)) return;
  if(!Object.keys(spiel.kolonien).length) return;
  spiel.ereignisAb = jetzt + EREIGNIS_ABSTAND*1000/TEMPO;
  if(Math.random() > EREIGNIS_CHANCE) return;

  const arten = Object.keys(EREIGNISSE);
  spiel.ereignis = {
    art: arten[Math.floor(Math.random()*arten.length)],
    offenBis: jetzt + EREIGNIS_FRIST*1000/TEMPO,
  };
}

// Läuft die Frist ab, greift die folgenlose Möglichkeit von selbst
function ereignisFristPruefen(jetzt){
  const e = spiel.ereignis;
  if(!e || jetzt < e.offenBis) return;
  const d = EREIGNISSE[e.art];
  const i = d.wahl.findIndex(w => w.nichtstun);
  ereignisWaehlen(i >= 0 ? i : d.wahl.length-1, true);
}

function ereignisWaehlen(index, automatisch){
  const e = spiel.ereignis; if(!e) return;
  const d = EREIGNISSE[e.art], w = d.wahl[index]; if(!w) return;
  if(w.kosten && !bezahlbar(w.kosten)) return;
  if(w.kosten) abbuchen(w.kosten);
  const text = w.wirkung() || "";
  spiel.ereignis = null;
  meldung((automatisch ? `${d.name} — Frist abgelaufen. ` : `${d.name}: `) + text,
          automatisch ? "" : "gut");
  if(!automatisch){ speichern(); zeichnen(); }
}

/* --- Lagerüberlauf ------------------------------------------
   Das Lager begrenzt schon immer; neu ist nur, dass sichtbar wird,
   wie viel dadurch verfällt. Das macht den Lagerausbau zu einer
   Entscheidung statt zu einer Randnotiz.
   ------------------------------------------------------------ */
function ueberlaufMelden(){
  const v = spiel.ueberlauf || {};
  const gesamt = Object.keys(v).reduce((a,r)=>a+v[r],0);
  if(gesamt < 1) return;
  const liste = Object.keys(v).filter(r=>v[r]>=1)
    .sort((a,b)=>v[b]-v[a]).slice(0,3)
    .map(r=>`${z0(v[r])} ${RES_NAMEN[r]}`).join(", ");
  meldung(`Lager voll — ${liste} sind verfallen. Ein Ausbau der Lagerhallen würde das verhindern.`,
          "warnung");
  spiel.ueberlauf = {};
}

// Einheitliche Meldung in den Berichtsstapel
function meldung(text, art){
  spiel.berichte = spiel.berichte || [];
  spiel.berichte.unshift({ text, art:"lage", stil:art||"", ziel:"", zeit:Date.now(), gelesen:false });
  spiel.berichte = spiel.berichte.slice(0,25);
}

/* ------------------------------------------------------------
   Garnison einer fremden Welt
   Stärke leitet sich aus der Grösse der Welt ab (Summe ihrer
   Distriktfelder), damit ergiebige Welten auch teurer zu nehmen sind.
   Die Mischung wird gewürfelt — deshalb lohnt es sich, vorher
   nachzusehen, statt blind eine Standardarmee zu schicken.
   ------------------------------------------------------------ */
function garnisonErzeugen(obj){
  let felder = 0;
  for(const d in (obj.felder||{})) felder += obj.felder[d];
  const gesamt = Math.max(12, Math.round(felder * (1.1 + Math.random()*0.8)));
  const g = {}, arten = Object.keys(TRUPPEN);
  let anteile = arten.map(()=> 0.5 + Math.random());
  const summe = anteile.reduce((a,b)=>a+b,0);
  arten.forEach((t,i)=>{
    const n = Math.round(gesamt * anteile[i]/summe);
    if(n > 0) g[t] = n;
  });
  if(!Object.keys(g).length) g.infanterie = 12;
  return g;
}
function truppenAnzahl(t){ let n=0; for(const k in (t||{})) n += t[k]||0; return n; }
function truppenStaerke(t){
  let s = 0;
  for(const k in (t||{})) s += t[k] * ((TRUPPEN[k].angriff||0) + (TRUPPEN[k].panzerung||0)*0.5);
  return Math.floor(s);
}
function truppenFrei(typ){ return spiel.truppen[typ] || 0; }
// Eigene Garnison einer Kolonie — Grundlage für spätere Verteidigungsgefechte
function eigeneGarnison(objId){
  const k = spiel.kolonien[objId]; if(!k) return 0;
  const st = k.gebaeude.kaserne || 0;
  return st ? Math.round(GEBAEUDE.kaserne.garnison * st * Math.pow(ERTRAG_STEIGERUNG, st-1)) : 0;
}

/* ============================================================
   8. FORMELN
   ============================================================ */
function techStufe(id){ return spiel.techs[id] || 0; }
function techKosten(id){
  const t = TECHS[id];
  return Math.floor(t.kosten * Math.pow(t.steigerung, techStufe(id)));
}
function techVerfuegbar(id){
  const t = TECHS[id];
  return t.wiederholbar || techStufe(id) === 0;
}
function maxPlaneten(){ return START_MAX_PLANETEN + techStufe("kolonierecht"); }
function maxHabitate(){ return START_MAX_HABITATE + techStufe("habitattechnik"); }

// Gebäudewerte auf einer bestimmten Stufe
function gebaeudeErtrag(basis, level){
  return level <= 0 ? 0 : basis * Math.pow(ERTRAG_STEIGERUNG, level-1);
}
function gebaeudeKosten(s, zielLevel){
  const k = {}, basis = GEBAEUDE[s].kosten;
  for(const r in basis) k[r] = Math.floor(basis[r] * Math.pow(KOSTEN_STEIGERUNG, Math.max(0,zielLevel-1)));
  return k;
}
function distriktKosten(s, objId){
  let f = techStufe("distriktbau") ? 0.8 : 1;
  // Manche Welten erschweren das Bauen — der Dschungel muss erst gerodet werden
  if(objId != null && spiel.objekte[objId]){
    const typ = OBJEKTE[spiel.objekte[objId].typ];
    if(typ && typ.distriktKosten) f *= typ.distriktKosten;
  }
  const k = {};
  for(const r in DISTRIKTE[s].kosten) k[r] = Math.floor(DISTRIKTE[s].kosten[r]*f);
  return k;
}
function bauzeit(kosten){
  let s=0; for(const r in kosten) s += kosten[r];
  return Math.max(5, Math.floor(s/20));
}
/* Kosten können Grundstoffe und seltene Stoffe mischen. Seltene stehen
   in einem eigenen Feld, damit sie nicht im Hauptstreifen auftauchen. */
function bezahlbar(k, selten){
  for(const r in k) if((spiel.res[r]||0) < k[r]) return false;
  for(const t in (selten||{})) if((spiel.selten?.[t]||0) < selten[t]) return false;
  return true;
}
function abbuchen(k, selten){
  for(const r in k) spiel.res[r] -= k[r];
  for(const t in (selten||{})) spiel.selten[t] -= selten[t];
}

function zaehleKolonien(){
  let planeten=0, habitate=0, frei=0;
  for(const id in spiel.kolonien){
    const t = OBJEKTE[spiel.objekte[id].typ];
    if(t.zaehltNicht) frei++;                  // Monde belegen keinen Platz
    else if(t.art === "planet") planeten++;
    else habitate++;
  }
  return { planeten, habitate, frei };
}

/* ============================================================
   9. EINE KOLONIE DURCHRECHNEN
   Gebäude und Distrikte produzieren von sich aus.
   Zugewiesene Bevölkerung gibt +10 % je Person auf diese Gruppe.
   ============================================================ */
function berechneKolonie(id){
  const k = spiel.kolonien[id], obj = spiel.objekte[id];
  const typ = OBJEKTE[obj.typ];
  const ein = {}; for(const r of RES) ein[r] = 0;
  let forschung = 0, wohnraum = 0, lager = 0;

  const beitrag = [];   // für die Anzeige

  for(const s in DISTRIKTE){
    const n = k.distrikte[s]; if(!n) continue;
    const zug = k.zuweisung["d:"+s] || 0;
    const f = 1 + zug*BONUS_PRO_KOPF;
    const posten = { schluessel:"d:"+s, name:DISTRIKTE[s].name, anzahl:n, zug, faktor:f, ertrag:{} };
    for(const r in DISTRIKTE[s].produziert){
      const menge = DISTRIKTE[s].produziert[r]*n*f;
      posten.ertrag[r] = menge;
      if(r === "forschung") forschung += menge; else ein[r] += menge;
    }
    beitrag.push(posten);
  }

  const erlaubt = erlaubteGebaeude(id);
  for(const s in GEBAEUDE){
    if(!erlaubt.includes(s)) continue;
    const lvl = k.gebaeude[s]; if(!lvl) continue;
    const g = GEBAEUDE[s];
    const zug = k.zuweisung["g:"+s] || 0;
    const f = 1 + zug*BONUS_PRO_KOPF;
    if(g.wohnraum) wohnraum += gebaeudeErtrag(g.wohnraum, lvl);
    if(g.lager)    lager    += gebaeudeErtrag(g.lager, lvl);
    if(g.produziert){
      const posten = { schluessel:"g:"+s, name:g.name, anzahl:lvl, zug, faktor:f, ertrag:{} };
      for(const r in g.produziert){
        const menge = gebaeudeErtrag(g.produziert[r], lvl)*f;
        posten.ertrag[r] = menge;
        if(r === "forschung") forschung += menge; else ein[r] += menge;
      }
      beitrag.push(posten);
    }
  }

  if(typ.ohneBevoelkerung) wohnraum = 0;   // Gasriesen laufen automatisch
  wohnraum = Math.floor(wohnraum);
  const bev = Math.floor(k.bev);
  ein.nahrung -= bev * NAHRUNG_PRO_KOPF * strategieBoni().nahrungBedarf;

  let zugewiesen = 0;
  for(const s in k.zuweisung) zugewiesen += k.zuweisung[s];
  const frei = Math.max(0, bev - zugewiesen);

  const sb = strategieBoni();
  const bewohnbar = typ.ohneBevoelkerung ? 0
    : (typ.bewohnbarkeit != null ? typ.bewohnbarkeit : 1);
  const platzAnteil = wohnraum > 0 ? Math.max(0, 1 - bev/wohnraum) : 0;
  const wachstumProStunde = 2500 * platzAnteil * bewohnbar * sb.wachstum;
  const wachstumsziel = 100 + 40*bev;

  return { obj, typ, bewohnbar, ein, forschung, wohnraum, lager, bev, frei,
           zugewiesen, beitrag, wachstumProStunde, wachstumsziel };
}

function berechneReich(){
  const ein = {}; for(const r of RES) ein[r] = 0;
  let forschung = 0, lager = 0, bev = 0;
  const je = {};
  for(const id in spiel.kolonien){
    const z = berechneKolonie(id);
    je[id] = z;
    for(const r of RES) ein[r] += z.ein[r];
    forschung += z.forschung; lager += z.lager; bev += z.bev;
  }
  const sbr = strategieBoni();
  forschung = forschung * sbr.forschung + sbr.forschungFest;   // Kryokristalle, Artefakte
  const hunger = spiel.res.nahrung <= 0 && ein.nahrung < 0;
  return { ein, forschung, lagergrenze:Math.floor(lager), bev, je, hunger };
}

/* ============================================================
   10. ZEIT VERRECHNEN
   ============================================================ */
function fortschreiben(){
  const jetzt = Date.now();
  let sek = (jetzt - spiel.zuletzt)/1000 * TEMPO;
  spiel.zuletzt = jetzt;
  if(sek <= 0) return;

  while(sek > 0){
    const schritt = Math.min(sek, 60);
    sek -= schritt;
    const g = berechneReich();

    for(const r of RES){
      const roh = spiel.res[r] + g.ein[r]*schritt/3600;
      const neu = Math.max(0, Math.min(g.lagergrenze, roh));
      // Was über die Lagergrenze hinaus produziert wurde, wird mitgezählt,
      // damit der Spieler es erfährt statt es still zu verlieren
      if(roh > g.lagergrenze){
        spiel.ueberlauf = spiel.ueberlauf || {};
        spiel.ueberlauf[r] = (spiel.ueberlauf[r]||0) + (roh - g.lagergrenze);
      }
      spiel.res[r] = neu;
    }
    spiel.forschung += g.forschung*schritt/3600;

    for(const id in spiel.kolonien){
      const k = spiel.kolonien[id], z = g.je[id];
      let rate = z.wachstumProStunde;
      if(g.hunger) rate = -2500;
      k.wachstum += rate*schritt/3600;
      while(k.wachstum >= z.wachstumsziel){ k.wachstum -= z.wachstumsziel; k.bev += 1; }
      if(k.wachstum < 0){
        if(k.bev > 0){ k.bev -= 1; k.wachstum += z.wachstumsziel; entzieheZuweisung(id); }
        else k.wachstum = 0;
      }
      if(k.bau && jetzt >= k.bau.fertigAb){
        if(k.bau.art === "distrikt") k.distrikte[k.bau.schluessel] += 1;
        else k.gebaeude[k.bau.schluessel] += 1;
        k.bau = null;
      }
    }
    if(spiel.werftauftrag && jetzt >= spiel.werftauftrag.fertigAb){
      const t = spiel.werftauftrag.typ;
      spiel.schiffe[t] = (spiel.schiffe[t]||0) + 1;
      spiel.werftauftrag = null;
    }
    if(spiel.kaserneauftrag && jetzt >= spiel.kaserneauftrag.fertigAb){
      const t = spiel.kaserneauftrag.typ;
      spiel.truppen[t] = (spiel.truppen[t]||0) + 1;
      spiel.kaserneauftrag = null;
    }
    for(let i = spiel.missionen.length-1; i >= 0; i--){
      const m = spiel.missionen[i];

      /* Förderung läuft in jedem Zeitschritt weiter, nicht nur an einem
         Stichtag. Sie endet, wenn der Vorrat erschöpft ist oder der Cluster
         sich aufgelöst hat — die Flotte kehrt dann mit der bis dahin
         geförderten Ladung heim und geht nie verloren. */
      if(m.phase === "foerdern"){
        const c = clusterVon(m.ziel);
        const weiter = c ? foerdern(m, schritt) : false;
        if(!weiter){
          m.bericht = c
            ? `Vorrat erschöpft — die Förderflotte kehrt zurück.`
            : `Der Cluster hat sich aufgelöst — die Förderflotte kehrt mit der bisherigen Ladung zurück.`;
          if(c && c.vorrat <= 0) spiel.cluster = spiel.cluster.filter(x => x.id !== c.id);
          m.phase = "rueck";
          m.startAb = jetzt;
          m.endeAb = jetzt + m.dauer*1000/TEMPO;
        }
        continue;
      }

      if(jetzt < m.endeAb) continue;
      if(m.phase === "hin"){
        missionAuswerten(m);
        // Förderung: läuft, bis der Vorrat erschöpft oder der Cluster weg ist
        if(m.art === "foerdern" && !m.abgebrochen && clusterVon(m.ziel)){
          m.phase = "foerdern";
          m.startAb = jetzt;
          m.endeAb = 0;              // kein fester Endzeitpunkt
          continue;
        }
        // Invasion: nach gesichertem Orbit folgt die Belagerung vor dem Sturm
        if(m.art === "invasion" && m.belagerungBis && !m.abgebrochen){
          m.phase = "belagerung";
          m.startAb = jetzt;
          m.endeAb = m.belagerungBis;
          continue;
        }
        const uebrig = Object.values(m.schiffe).reduce((a,b)=>a+b,0);
        if(uebrig === 0 && !m.ladung){
          missionHeimkehr(m); spiel.missionen.splice(i,1);
        }else{
          m.phase = "rueck";
          m.startAb = jetzt;
          m.endeAb = jetzt + m.dauer*1000/TEMPO;
        }
      }else if(m.phase === "belagerung"){
        invasionSturm(m);
        m.phase = "rueck";
        m.startAb = jetzt;
        m.endeAb = jetzt + m.dauer*1000/TEMPO;
      }else{
        missionHeimkehr(m);
        spiel.missionen.splice(i,1);
      }
    }
    if(spiel.sonde && jetzt >= spiel.sonde.fertigAb){
      spiel.systeme[spiel.sonde.zielId].erkundet = true;
      spiel.sonde = null;
    }
    if(spiel.kolonieflug && jetzt >= spiel.kolonieflug.fertigAb){
      const zielId = spiel.kolonieflug.zielId;
      spiel.kolonien[zielId] = neueKolonie(zielId);
      spiel.auswahl = zielId;
      spiel.ansicht = "objekt";
      spiel.kolonieflug = null;
    }
  }
  /* --- Etappe 28: einmal je Durchlauf, nicht je 60-Sekunden-Schritt ---
     Reihenfolge: Erst prüfen, ob ein angekündigter Überfall fällig ist,
     dann einen neuen ankündigen. Sonst könnte beides im selben Durchlauf
     geschehen und die Vorwarnzeit wäre wirkungslos. */
  if(spiel.ueberfall && jetzt >= spiel.ueberfall.faelligAb) ueberfallAusfuehren(spiel.ueberfall);
  ueberfallPruefen(jetzt);
  ereignisFristPruefen(jetzt);
  ereignisPruefen(jetzt);
  clusterPruefen(jetzt);
  ueberlaufMelden();

  aufgabenPruefen();     // nach jedem Zeitschritt neue Erfolge erfassen
  handelPruefen();       // Sortimente erneuern, wenn sie abgelaufen sind
}
// Schrumpft die Bevölkerung, müssen Zuweisungen nachgeben
function entzieheZuweisung(id){
  const k = spiel.kolonien[id];
  let zug = 0; for(const s in k.zuweisung) zug += k.zuweisung[s];
  while(zug > Math.floor(k.bev)){
    const s = Object.keys(k.zuweisung).find(x => k.zuweisung[x] > 0);
    if(!s) break;
    k.zuweisung[s] -= 1; zug -= 1;
  }
}

/* ============================================================
   10z. HANDEL MIT NEUTRALEN PARTEIEN
   ============================================================ */
// Grobe Wertigkeit der Ressourcen — bestimmt die Tauschverhältnisse
const RES_WERT = {
  energiezellen:1, nahrung:1.2, erz:1.5, silikat:2.2, kohlenstoff:2.6,
  wasserstoff:2.8, kupfer:5, legierung:9, forschung:14,
};

function diploStand(partei){
  const w = Math.max(BEZIEHUNG_MIN, Math.min(BEZIEHUNG_MAX,
    (spiel.diplomatie && spiel.diplomatie[partei]) || 0));
  let stufe = DIPLO_STUFEN[0], naechst = null;
  for(let i=0;i<DIPLO_STUFEN.length;i++){
    if(w >= DIPLO_STUFEN[i].ab){ stufe = DIPLO_STUFEN[i]; naechst = DIPLO_STUFEN[i+1] || null; }
  }
  return { wert:w, stufe, naechst };
}
function diploAendern(partei, delta){
  spiel.diplomatie = spiel.diplomatie || {};
  const alt = spiel.diplomatie[partei] || 0;
  spiel.diplomatie[partei] = Math.max(BEZIEHUNG_MIN, Math.min(BEZIEHUNG_MAX, alt + delta));
}

// Alle Objekte, die einer Partei gehören
function fremdeWelten(nurErkundet){
  const out = [];
  for(const id in spiel.objekte){
    const o = spiel.objekte[id];
    if(!o.fraktion) continue;
    if(nurErkundet && !spiel.systeme[o.systemId].erkundet) continue;
    out.push(o);
  }
  return out;
}

// Jede bewohnte Welt führt ihr eigenes Sortiment
function angeboteWuerfeln(objId){
  const o = spiel.objekte[objId];
  const d = PARTEIEN[o.fraktion];
  const bonus = diploStand(o.fraktion).stufe.bonus;
  const liste = [];

  // Was eine Welt anbietet, hängt auch von ihren eigenen Vorkommen ab
  const eigene = [];
  for(const dist in o.felder)
    for(const r in DISTRIKTE[dist].produziert)
      if(r !== "forschung" && !eigene.includes(r)) eigene.push(r);
  const topf = [...d.verkauft, ...eigene.filter(r => Math.random() < 0.5)];

  for(let i=0;i<ANGEBOTE_JE_WELT;i++){
    const gibt = topf[Math.floor(Math.random()*topf.length)];
    let will = d.verlangt[Math.floor(Math.random()*d.verlangt.length)];
    if(will === gibt) will = d.verlangt[(d.verlangt.indexOf(will)+1) % d.verlangt.length];

    const menge = Math.max(1, Math.round((260 / RES_WERT[gibt]) * (0.6 + Math.random()*0.9)));
    // Geleitschutz der Kartellflotte verbessert die Kurse spürbar
    const geleit = geleitAktiv() ? (1 + GELEIT_KURSBONUS) : 1;
    const preis = Math.max(1, Math.round(
      menge * RES_WERT[gibt] / RES_WERT[will] / (d.grundkurs * bonus * geleit)));
    liste.push({ gibt, menge, will, preis, weg:false });
  }
  return liste;
}

/* ------------------------------------------------------------
   Geleitschutz der Kartellflotte  (Etappe 24)
   Ein Angebot, keine Erpressung: Wer nicht zahlt, verliert nichts.
   Damit bleibt es dauerhaft eine Abwägung, statt nach kurzer Zeit
   zur Routine zu werden — und es bestraft niemanden, der weg war.
   ------------------------------------------------------------ */
function geleitAktiv(){ return !!(spiel.geleit && spiel.geleit.bisAb > Date.now()); }

function geleitPreis(){
  // Richtet sich nach der Reichsgrösse, damit es lange eine Frage bleibt
  const kolonien = Object.keys(spiel.kolonien).length || 1;
  const f = 1 + kolonien * 0.6;
  return { energiezellen: Math.round(2200*f), erz: Math.round(1800*f),
           kupfer: Math.round(400*f), legierung: Math.round(600*f) };
}

/* Erzeugt ein Angebot, wenn gerade keines offen oder aktiv ist und
   die Pause vorbei ist. Das Angebot läuft von selbst aus. */
function geleitPruefen(){
  const jetzt = Date.now();
  if(geleitAktiv()) return;
  if(spiel.geleit && spiel.geleit.offenBis > jetzt) return;    // Angebot liegt noch
  if(jetzt < spiel.geleitAb) return;                            // Pause läuft
  if(!spiel.gesehen.kartell) return;                            // erst nach Begegnung
  spiel.geleit = { preis: geleitPreis(), offenBis: jetzt + 3*24*3600*1000/TEMPO, bisAb:0 };
  spiel.geleitAb = jetzt + GELEIT_PAUSE*1000/TEMPO;
}

function geleitAnnehmen(){
  if(!spiel.geleit || geleitAktiv()) return;
  const preis = spiel.geleit.preis;
  if(!bezahlbar(preis)) return;
  abbuchen(preis);
  spiel.geleit = { preis, bisAb: Date.now() + GELEIT_LAUFZEIT*1000/TEMPO, offenBis:0 };
  spiel.berichte = spiel.berichte || [];
  spiel.berichte.unshift({ text:"Geleitschutz der Kartellflotte vereinbart. "
    +"Bessere Kurse und sichere Konvois für die Laufzeit.",
    art:"handel", ziel:"Kartellflotte", zeit:Date.now(), gelesen:false });
  speichern(); zeichnen();
}

function handelPruefen(){
  geleitPruefen();
  spiel.handel = spiel.handel || {};
  spiel.diplomatie = spiel.diplomatie || {};
  for(const pid in PARTEIEN) if(spiel.diplomatie[pid] == null) spiel.diplomatie[pid] = 0;

  const jetzt = Date.now();
  for(const o of fremdeWelten(false)){
    const h = spiel.handel[o.id];
    if(!h || jetzt >= h.bisAb){
      spiel.handel[o.id] = {
        angebote: angeboteWuerfeln(o.id),
        bisAb: jetzt + ANGEBOT_DAUER*1000/TEMPO,
      };
    }
  }
}

function handeln(objId, index){
  handelPruefen();
  const o = spiel.objekte[objId];
  if(!o || !o.fraktion) return;
  const d = PARTEIEN[o.fraktion];
  const h = spiel.handel[objId];
  const a = h && h.angebote[index];
  if(!a || a.weg) return;
  if((spiel.res[a.will] || 0) < a.preis) return;

  // Verfeindete Parteien handeln nicht mehr
  if(diploStand(o.fraktion).wert <= -60) return;

  spiel.res[a.will] -= a.preis;

  // Geleitschutz macht Konvois sicher — das ist sein sichtbarster Nutzen
  if(d.risiko && !geleitAktiv() && Math.random() < d.risiko){
    a.weg = true;
    spiel.berichte = spiel.berichte || [];
    spiel.berichte.unshift({
      text:`Lieferung ausgeblieben — ${o.name} meldet einen Zwischenfall.`,
      art:"handel", ziel:o.name, zeit:Date.now(), gelesen:false,
    });
    spiel.berichte = spiel.berichte.slice(0,25);
    speichern(); zeichnen();
    return;
  }

  if(a.gibt === "forschung") spiel.forschung += a.menge;
  else spiel.res[a.gibt] = (spiel.res[a.gibt] || 0) + a.menge;

  // Handel verbessert die Beziehung — mit abnehmender Wirkung nach oben
  const jetztW = diploStand(o.fraktion).wert;
  const schritt = jetztW < 40 ? 2 : jetztW < 70 ? 1 : 0.5;
  diploAendern(o.fraktion, schritt);

  /* Unter Geleitschutz fallen gelegentlich Kartell-Baupläne ab.
     Das ist der Weg an Blockadebrecher-Fragmente für Spieler,
     die wenig kämpfen. */
  if(geleitAktiv() && Math.random() < GELEIT_FRAGMENT_P){
    spiel.gesehen.kartell = true;
    const f = fragmentGeben("blockadebrecher");
    if(f){
      spiel.berichte = spiel.berichte || [];
      spiel.berichte.unshift({ text:"Aus Kartellbeständen: "+fragmentText(f),
        art:"handel", ziel:"Kartellflotte", zeit:Date.now(), gelesen:false });
    }
  }

  a.weg = true;
  speichern(); zeichnen();
}

/* ============================================================
   9b. STRATEGISCHE VORKOMMEN AUSWERTEN
   Gezählt wird nur, was auch besiedelt ist. Mehrfachbesitz wirkt
   gestaffelt bis zur Obergrenze der jeweiligen Ressource.
   ============================================================ */
function vorkommenBesitz(){
  const zahl = {};
  for(const v in STRATEGISCH) zahl[v] = 0;
  for(const id in spiel.kolonien){
    const o = spiel.objekte[id];
    if(o && o.vorkommen) zahl[o.vorkommen]++;
  }
  // auf die jeweilige Obergrenze deckeln
  const wirksam = {};
  for(const v in zahl) wirksam[v] = Math.min(zahl[v], STRATEGISCH[v].maxStufen);
  return { zahl, wirksam };
}

function strategieBoni(){
  const w = vorkommenBesitz().wirksam;
  return {
    angriff:      1 + 0.12 * w.iridium,
    flugTempo:    1 + 0.18 * w.deuterium,
    wachstum:     1 + 0.25 * w.xenoflora,
    nahrungBedarf:1 - 0.10 * Math.min(1, w.xenoflora),
    forschung:    1 + 0.15 * w.kryokristalle,
    forschungFest: 40 * w.artefakte,
  };
}

/* ============================================================
   9c. FUNDSTÜCKE ÖFFNEN
   Ein Balken, über den ein Zeiger läuft; man hält ihn im Feld an.
   Drei Versuche, das Feld wird jedes Mal schmaler. Je mehr Treffer,
   desto grösser die Ausbeute — ein Fehlgriff kostet nur Anteile,
   nie den ganzen Fund.
   ============================================================ */
let fundLauf = null;     // läuft nur, solange das Fenster offen ist

function anomalieOeffnen(id){
  const a = (spiel.anomalien||[]).find(x => x.id === id);
  if(!a || a.erledigt) return;
  fundLauf = {
    anomalieId: id,
    runde: 1,
    treffer: 0,
    zeigerAb: performance.now(),
    laufzeit: 1500,                       // Millisekunden für einen Durchlauf
    zone: 0.26,                           // Breite des Trefferfeldes
    zonenMitte: 0.3 + Math.random()*0.4,
    ergebnis: null,
  };
  zeichnenFund();
}

// Position des Zeigers von 0 bis 1, hin und her
function zeigerStand(){
  if(!fundLauf) return 0;
  const t = ((performance.now() - fundLauf.zeigerAb) % (fundLauf.laufzeit*2)) / fundLauf.laufzeit;
  return t <= 1 ? t : 2 - t;
}

function fundKlick(){
  if(!fundLauf || fundLauf.ergebnis) return;
  const pos = zeigerStand();
  const halb = fundLauf.zone / 2;
  if(Math.abs(pos - fundLauf.zonenMitte) <= halb) fundLauf.treffer++;

  if(fundLauf.runde >= ANOMALIE_RUNDEN){
    fundAbschliessen();
  }else{
    fundLauf.runde++;
    fundLauf.zone *= 0.72;                // wird enger
    fundLauf.laufzeit *= 0.88;            // und schneller
    fundLauf.zonenMitte = 0.25 + Math.random()*0.5;
    fundLauf.zeigerAb = performance.now();
  }
  zeichnenFund();
}

function fundAbschliessen(){
  const a = (spiel.anomalien||[]).find(x => x.id === fundLauf.anomalieId);
  if(!a) { fundLauf = null; return; }
  const d = ANOMALIEN[a.art];

  // Anteil der Ausbeute nach Treffern: 30 % Grundstock, Rest über Können
  const anteil = 0.30 + 0.70 * (fundLauf.treffer / ANOMALIE_RUNDEN);
  const beute = {};
  for(const r in d.beute) beute[r] = Math.round(d.beute[r] * anteil);

  for(const r in beute){
    if(r === "forschung") spiel.forschung += beute[r];
    else spiel.res[r] = (spiel.res[r]||0) + beute[r];
  }
  a.erledigt = true;
  a.treffer = fundLauf.treffer;
  a.beute = beute;

  /* Geschicklichkeit bleibt Zugabe: Die Treffer bestimmen die Ausbeute,
     aber NICHT, ob ein Fragment dabei ist. Wer schlecht zielt, bekommt
     weniger Rohstoffe — die Blaupause hängt nie an einem Treffer. */
  const f = fragmentWurf("anomalie", null, 0);
  if(f) a.fragmentText = fragmentText(f);

  spiel.berichte = spiel.berichte || [];
  spiel.berichte.unshift({
    text:`${d.name} geborgen — ${fundLauf.treffer} von ${ANOMALIE_RUNDEN} Kopplungen sassen.`
       + (f ? " " + fragmentText(f) : ""),
    art:"erkunden", ziel:spiel.systeme[a.systemId].name,
    ladung:beute, zeit:Date.now(), gelesen:false,
  });
  spiel.berichte = spiel.berichte.slice(0,25);

  fundLauf.ergebnis = { treffer:fundLauf.treffer, beute, anteil };
  speichern();
}

function fundSchliessen(){ fundLauf = null; zeichnenFund(); zeichnen(); }

/* ============================================================
   10a. AUFGABEN AUSWERTEN
   ============================================================ */
function aufgabenStand(){
  const liste = [];
  let punkte = 0;
  for(const id in AUFGABEN){
    const a = AUFGABEN[id];
    let wert = 0;
    try { wert = a.pruef() || 0; } catch(e) { wert = 0; }
    const erfuellt = wert >= a.ziel;
    if(erfuellt) punkte += a.punkte;
    liste.push({ id, ...a, wert: Math.min(wert, a.ziel), erfuellt });
  }
  return { liste, punkte };
}

function rangZu(punkte){
  let jetzt = RAENGE[0], naechst = null;
  for(let i = 0; i < RAENGE.length; i++){
    if(punkte >= RAENGE[i].punkte){ jetzt = RAENGE[i]; naechst = RAENGE[i+1] || null; }
  }
  return { jetzt, naechst, stufe: RAENGE.indexOf(jetzt) + 1 };
}

// Neu erfüllte Aufträge merken, damit der Reiter darauf hinweisen kann
function aufgabenPruefen(){
  const st = aufgabenStand();
  spiel.erledigt = spiel.erledigt || [];
  for(const a of st.liste){
    if(a.erfuellt && !spiel.erledigt.includes(a.id)){
      spiel.erledigt.push(a.id);
      spiel.neueAufgaben = (spiel.neueAufgaben || 0) + 1;
    }
  }
}

/* ============================================================
   10b. WERFT UND FLOTTE
   ============================================================ */
function werftStufe(){
  let max = 0;
  for(const id in spiel.kolonien) max = Math.max(max, spiel.kolonien[id].gebaeude.werft || 0);
  return max;
}
function schiffBauzeit(typ){
  const w = werftStufe();
  return Math.max(3, Math.floor(SCHIFFE[typ].bauzeit / (1 + 0.25*Math.max(0, w-1))));
}
// Wie viele Schiffe eines Typs existieren — Bestand, Auftrag und unterwegs
function schiffGesamt(typ){
  let n = flotteFrei(typ);
  if(spiel.werftauftrag && spiel.werftauftrag.typ === typ) n++;
  for(const m of spiel.missionen) n += (m.schiffe && m.schiffe[typ]) || 0;
  return n;
}
function schiffBauen(typ){
  if(spiel.werftauftrag || werftStufe() < 1) return;
  if(!schiffFreigeschaltet(typ)) return;          // Blaupause unvollständig
  const grenze = SCHIFFE[typ].hoechstzahl;
  if(grenze && schiffGesamt(typ) >= grenze) return;
  const kosten = SCHIFFE[typ].kosten;
  const selten = SCHIFFE[typ].seltenKosten;
  if(!bezahlbar(kosten, selten)) return;
  abbuchen(kosten, selten);
  const dauer = schiffBauzeit(typ);
  spiel.werftauftrag = { typ, dauer, fertigAb: Date.now()+dauer*1000/TEMPO };
  speichern(); zeichnen();
}

/* ------------------------------------------------------------
   Kaserne — bildet Bodentruppen aus.
   Eigener Auftragsplatz neben der Werft: Schiffe und Truppen
   entstehen parallel, sonst würde eine Invasion doppelt so lange
   blockieren wie sie ohnehin schon dauert.
   ------------------------------------------------------------ */
function kaserneStufe(){
  let max = 0;
  for(const id in spiel.kolonien) max = Math.max(max, spiel.kolonien[id].gebaeude.kaserne || 0);
  return max;
}
function truppeBauzeit(typ){
  const k = kaserneStufe();
  return Math.max(3, Math.floor(TRUPPEN[typ].bauzeit / (1 + 0.25*Math.max(0, k-1))));
}
function truppeBauen(typ){
  if(spiel.kaserneauftrag || kaserneStufe() < 1) return;
  const kosten = TRUPPEN[typ].kosten;
  if(!bezahlbar(kosten)) return;
  abbuchen(kosten);
  const dauer = truppeBauzeit(typ);
  spiel.kaserneauftrag = { typ, dauer, fertigAb: Date.now()+dauer*1000/TEMPO };
  speichern(); zeichnen();
}

// Flugdauer zwischen dem nächsten eigenen System und einem Ziel
function flugdauer(sysId, faktor){
  const d = naechstesEigenesSystem(spiel.systeme[sysId]);
  return Math.max(6, Math.floor(d * faktor / strategieBoni().flugTempo));
}
function flotteFrei(typ){ return spiel.schiffe[typ] || 0; }

// Von welchem eigenen System startet ein Flug? Vom nächstgelegenen.
function startSystem(zielSysId){
  const ziel = spiel.systeme[zielSysId];
  let best = 0, bestD = Infinity;
  for(const id in spiel.kolonien){
    const sid = spiel.objekte[id].systemId;
    const d = entfernungSys(ziel, spiel.systeme[sid]);
    if(d < bestD){ bestD = d; best = sid; }
  }
  return best;
}

function starteMission(art, ziel, schiffe, truppen){
  for(const t in schiffe) if(flotteFrei(t) < schiffe[t]) return false;
  for(const t in (truppen||{})) if(truppenFrei(t) < truppen[t]) return false;
  for(const t in schiffe) spiel.schiffe[t] -= schiffe[t];
  for(const t in (truppen||{})) spiel.truppen[t] -= truppen[t];
  const zielIstObjekt = (art === "sammeln" || art === "invasion");
  const sysId = art === "foerdern" ? (clusterVon(ziel)||{}).systemId
              : zielIstObjekt ? spiel.objekte[ziel].systemId : ziel;
  let dauer = flugdauer(sysId, art === "sammeln" ? 1.8 : art === "invasion" ? 2.0 : 1.5);
  /* Der Gitterträger verkürzt die Flugzeit des ganzen Verbands, die
     Wachfregatte bremst ihn aus. Beides wirkt auf den gesamten Flug,
     nicht auf einzelne Schiffe — der Verband fliegt zusammen. */
  if(art === "foerdern"){
    const cc = clusterVon(ziel);
    if(cc && CLUSTER_ARTEN[cc.art].anfahrt) dauer *= CLUSTER_ARTEN[cc.art].anfahrt;
  }
  if(anzahlIm(schiffe, "gittertraeger") > 0) dauer *= (1 - GITTER_FLUGBONUS);
  if(anzahlIm(schiffe, "wachfregatte") > 0)  dauer *= SCHIFFE.wachfregatte.langsam;
  dauer = Math.max(30, Math.round(dauer));
  spiel.missionen.push({
    id: Date.now()+Math.floor(Math.random()*1000),
    art, ziel, schiffe, truppen: truppen||{}, dauer, phase:"hin",
    clusterArt: art === "foerdern" ? (clusterVon(ziel)||{}).art : null,
    truppenAus: { ...(truppen||{}) },
    vonSys: startSystem(sysId), nachSys: sysId,
    ausgesandt: { ...schiffe },
    startAb: Date.now(),
    endeAb: Date.now()+dauer*1000/TEMPO, bericht:null, ladung:null
  });
  speichern(); zeichnen();
  return true;
}

// Was ein Objekt beim Sammeln hergibt — abgeleitet aus seinen Feldern
function sammelErtrag(objId, frachter, brecher){
  const obj = spiel.objekte[objId];
  const quellen = {};
  for(const d in obj.felder){
    for(const r in DISTRIKTE[d].produziert){
      if(r === "forschung") continue;
      quellen[r] = (quellen[r]||0) + obj.felder[d];
    }
  }
  const summe = Object.values(quellen).reduce((a,b)=>a+b,0) || 1;
  // Blockadebrecher tragen mehr und handeln besser
  const gesamt = frachter * FRACHTER_KAPAZITAET
               + (brecher||0) * SCHIFFE.blockadebrecher.kapazitaet * (1 + BLOCKADE_BONUS);
  const ladung = {};
  for(const r in quellen) ladung[r] = Math.floor(gesamt * quellen[r]/summe);
  return ladung;
}

/* ------------------------------------------------------------
   Rundenkampf
   Beide Seiten feuern gleichzeitig. Wieviel Schaden ein Typ
   anrichtet, hängt davon ab, auf wen er trifft — siehe KONTER.
   Verluste einer Runde wirken sich erst in der nächsten aus,
   deshalb wird ein früher Vorteil im Verlauf immer grösser.
   ------------------------------------------------------------ */
function flottenStaerke(flotte){
  let n = 0; for(const t in flotte) n += flotte[t] || 0; return n;
}
function lebenspunkte(typ){
  return (SCHIFFE[typ].panzerung || 0) * PANZER_ZU_LEBEN + 40;
}

// Schaden, den eine Flotte in einer Runde austeilt, aufgeteilt nach Zieltyp
function schadenAusteilen(angreifer, verteidiger, bonus, eigen, rollen, umkehren, runde, extra){
  const zielAnteile = {};
  const gesamt = flottenStaerke(verteidiger);
  if(!gesamt) return {};
  /* Zielgewichtung nach Zone. Ein Schiff, das umkehrt (Bohrer,
     Enterfahrzeuge), dreht die Gewichtung um und geht zuerst auf
     das Hinterland los. */
  const deckung = deckungsgrad(verteidiger);
  let summe = 0;
  for(const t in verteidiger){
    if(!verteidiger[t]) continue;
    const d = SCHIFFE[t] || {};
    // Getarnte Schiffe werden in den ersten Runden gar nicht erfasst
    if(d.tarnungBis && runde && runde <= d.tarnungBis){ zielAnteile[t] = 0; continue; }
    // Ausscherer suchen sich das Hinterland: sie kehren den Schutz um
    let g = umkehren ? (1 + deckung * ZONEN[zoneVon(t)].schutz)
                     : zonenGewicht(t, deckung);
    if(d.koeder) g *= d.koeder;          // zieht Feuer auf sich
    zielAnteile[t] = verteidiger[t] * g;
    summe += zielAnteile[t];
  }
  // Sind nur getarnte Schiffe übrig, werden auch sie beschossen
  if(summe <= 0){
    for(const t in verteidiger){ if(verteidiger[t]){ zielAnteile[t] = verteidiger[t]; summe += verteidiger[t]; } }
  }
  if(summe <= 0) return {};
  for(const t in zielAnteile) zielAnteile[t] /= summe;

  const schaden = {};
  for(const zt in zielAnteile) schaden[zt] = 0;

  const feindMenge = Object.values(verteidiger).reduce((a,b)=>a+b,0);
  // bonus = 0 wird nur zur Ermittlung der Zielverteilung benutzt (Reflexion)
  if(bonus === 0){
    const v = {};
    for(const t in zielAnteile) v[t] = zielAnteile[t];
    return v;
  }
  for(const at in angreifer){
    const n = angreifer[at]; if(!n) continue;
    const ad = SCHIFFE[at] || {};
    const iridium = eigen ? strategieBoni().angriff : 1;   // nur die eigene Flotte
    let eigenschaft = 1;
    // Der Bohrer frisst sich fest: mehr Schaden mit jeder Runde
    if(ad.aufbau && runde) eigenschaft *= 1 + ad.aufbau * (runde - 1);
    // Drohnen richten mehr an, je dichter der Gegner steht
    if(ad.massenBonus) eigenschaft *= 1 + ad.massenBonus * feindMenge;
    let roh = n * (SCHIFFE[at].angriff || 0) * bonus * SCHADEN_FAKTOR * iridium * eigenschaft;
    // Trägerstaffeln fliegen mit, gelten aber selbst nicht als Ziel
    if(ad.welle) roh += n * ad.welle * bonus * SCHADEN_FAKTOR * iridium;
    if(extra && extra.flottenBonus) roh *= (1 + extra.flottenBonus);
    // Beuteschiffe können eine andere, mehrere oder eine gewürfelte Rolle haben
    const zeile = rollen && rollen[at] ? rollen[at] : konterZeile(at);
    const zweite = ad.doppelrolle ? KONTER[ad.doppelrolle] : null;
    // Feuer verteilt sich auf die Zieltypen nach ihrem Anteil an der Flotte
    for(const zt in zielAnteile){
      // Der Schrottjäger steht auf zwei Seiten: es zählt der bessere Wert
      // Lenkraketen sind vom Konterdreieck unberührt
      let konter = ad.konterImmun ? 1 : ((zeile && zeile[zt]) || 1);
      if(!ad.konterImmun && zweite && (zweite[zt]||1) > konter) konter = zweite[zt];
      const streuung = 1 + (Math.random()*2 - 1) * SCHADEN_STREUUNG;
      schaden[zt] += roh * zielAnteile[zt] * konter * streuung;
    }
  }
  return schaden;
}

/* Rechnet Schaden in Schiffsverluste um.
   Wichtig ist das Schadenskonto: Was in einer Runde nicht für ein
   ganzes Schiff reicht, bleibt stehen und zählt in der nächsten Runde
   mit. Ohne das verpufft jeder Treffer unterhalb eines vollen
   Schiffslebens — bei wenigen, sehr dicken Schiffen (schwere
   Piratenverbände) nahm der Gegner dadurch praktisch nie Schaden. */
function verlusteAnwenden(flotte, schaden, konto){
  const verluste = {};
  for(const t in flotte){
    if(!flotte[t]) continue;
    konto[t] = (konto[t] || 0) + (schaden[t] || 0);
    const leben = lebenspunkte(t);
    const gefallen = Math.min(flotte[t], Math.floor(konto[t] / leben));
    if(gefallen > 0){
      konto[t] -= gefallen * leben;
      flotte[t] -= gefallen;
      verluste[t] = gefallen;
      if(flotte[t] <= 0){ delete flotte[t]; delete konto[t]; }
    }
  }
  return verluste;
}

function kampf(sysId, schiffe){
  const sys = spiel.systeme[sysId];
  const art = PIRATEN_ARTEN[sys.piraten.art];
  const eigen = { ...schiffe };
  const feind = { ...sys.piraten.flotte };
  const feindStart = flottenStaerke(feind);
  const panzerbonus = art.panzerbonus || 1;
  // Man kennt eine Bauart erst, wenn man ihrem Verband begegnet ist
  const verband = sys.piraten.art;
  spiel.gesehen[verband] = true;

  /* Wandelrümpfe würfeln ihre Konterrolle zu Beginn jedes Gefechts.
     Deshalb gleicht sich der Zufall bei vielen aus, während wenige
     ein echtes Risiko sind. */
  const rollen = {};
  let gewuerfelt = null;
  for(const t in eigen){
    if(SCHIFFE[t] && SCHIFFE[t].wechselrolle){
      const wahl = ["jaeger","korvette","kreuzer"][Math.floor(Math.random()*3)];
      rollen[t] = KONTER[wahl];
      gewuerfelt = SCHIFFE[wahl].name;
    }
  }

  /* Flottenweite Wirkungen einmal bestimmen — sie hängen an der
     Zusammensetzung, nicht an der einzelnen Runde. */
  function flottenwerte(f){
    let bonus = 0, abschlag = 0, reflex = 0, siphon = 0, menge = 0;
    for(const t in f){
      const n = f[t]; if(!n) continue;
      const d = SCHIFFE[t] || {};
      menge += n;
      if(d.flottenBonus) bonus = Math.max(bonus, d.flottenBonus);  // wirkt nicht kumulativ
      if(d.feindAbschlag) abschlag += d.feindAbschlag * n;
    }
    return { flottenBonus:bonus, abschlag:Math.min(0.55, abschlag) };
  }
  const wEigen = flottenwerte(eigen), wFeind = flottenwerte(feind);

  // Angesammelter, noch nicht tödlicher Schaden je Schiffstyp
  const kontoEigen = {}, kontoFeind = {};
  const runden = [];
  for(let r = 1; r <= KAMPF_RUNDEN; r++){
