<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aussenposten — Etappe 3</title>
<style>
  :root{
    --tief:#0a1622; --panel:#122234; --panel2:#18293c; --linie:#27435f;
    --text:#dbe7f2; --gedaempft:#7d97ae; --signal:#5ad1c8; --warn:#e8a33d; --rot:#e0605a;
    --erz:#d98b6a; --kristall:#8fb8e8; --energie:#e8d24a; --nahrung:#8fd18a;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:20px 14px 70px;
    background:radial-gradient(900px 500px at 20% -10%, #16304a 0%, transparent 60%), var(--tief);
    color:var(--text); font-family:"Segoe UI",system-ui,-apple-system,sans-serif; line-height:1.5;
  }
  .huelle{max-width:920px;margin:0 auto}
  h1{font-size:clamp(20px,5vw,28px);margin:0 0 2px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .unterzeile{color:var(--gedaempft);font-size:13px;margin-bottom:18px}
  h2{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gedaempft);
     border-bottom:1px solid var(--linie);padding-bottom:7px;margin:24px 0 11px;
     display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .beiheft{text-transform:none;letter-spacing:0;font-size:12px;font-weight:400;color:var(--gedaempft)}

  .leiste{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
  .res{background:var(--panel);border:1px solid var(--linie);border-radius:8px;padding:9px 11px;
       border-left:3px solid var(--rand,var(--linie));display:flex;gap:9px;align-items:center}
  .res svg{flex:none}
  .res .name{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gedaempft)}
  .res .wert{font-size:18px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.2}
  .res .rate{font-size:12px;font-variant-numeric:tabular-nums;color:var(--signal)}
  .res .rate.minus{color:var(--rot)}

  /* Sternenkarte */
  .karte{background:var(--panel);border:1px solid var(--linie);border-radius:8px;margin-top:14px;
         padding:6px;position:relative}
  .karte svg{display:block;width:100%;height:auto;touch-action:manipulation}
  .karte .punkt{cursor:pointer}
  .karte .punkt:focus-visible circle{outline:2px solid var(--warn)}

  .reiter{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .reiter button{background:var(--panel);border:1px solid var(--linie);color:var(--gedaempft);
                 font-size:13px;font-weight:400;padding:6px 12px}
  .reiter button.aktiv{background:var(--panel2);border-color:var(--signal);color:var(--text)}

  .tafel{background:var(--panel);border:1px solid var(--linie);border-radius:8px;padding:14px 16px;margin-top:12px}
  .kennzahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
  .kz .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gedaempft)}
  .kz .v{font-size:16px;font-variant-numeric:tabular-nums;font-weight:600}
  .kz .v.warn{color:var(--warn)} .kz .v.rot{color:var(--rot)}
  .hinweise{margin-top:11px;display:flex;flex-direction:column;gap:5px}
  .hinweis{font-size:13px;padding:7px 10px;border-radius:5px;background:#241d12;border-left:3px solid var(--warn)}
  .hinweis.rot{background:#2a1618;border-left-color:var(--rot)}
  .hinweis.gut{background:#12262a;border-left-color:var(--signal)}

  .job{background:var(--panel);border:1px solid var(--linie);border-radius:7px;padding:8px 10px;
       margin-bottom:6px;display:flex;gap:10px;align-items:center}
  .job.leer{opacity:.5}
  .job.bonus{border-color:var(--signal)}
  .job .rang{font-variant-numeric:tabular-nums;color:var(--gedaempft);font-size:13px;width:14px;text-align:center}
  .job .titel{font-size:14px}
  .job .ertrag{font-size:11.5px;color:var(--gedaempft)}
  .job .marke{font-size:11px;color:var(--signal)}
  .job .zahl{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;margin-left:auto;white-space:nowrap}
  .pfeile{display:flex;flex-direction:column;gap:2px}
  .pfeile button{padding:0 7px;font-size:11px;line-height:1.5;background:var(--panel2);color:var(--gedaempft);
                 border:1px solid var(--linie);font-weight:400;border-radius:4px}
  .pfeile button:disabled{opacity:.3}

  .zeile{background:var(--panel);border:1px solid var(--linie);border-radius:8px;padding:11px 13px;
         margin-bottom:8px;display:flex;flex-wrap:wrap;gap:11px;align-items:center}
  .zeile.voll{opacity:.55}
  .ikon{flex:none;width:36px;height:36px;display:grid;place-items:center;background:var(--panel2);
        border-radius:7px;border:1px solid var(--linie)}
  .info{flex:1 1 240px;min-width:0}
  .titel{font-weight:600}
  .anzahl{color:var(--signal);font-variant-numeric:tabular-nums;font-weight:400}
  .beschreibung{font-size:13px;color:var(--gedaempft);margin-top:1px}
  .kosten{font-size:12px;font-variant-numeric:tabular-nums;margin-top:5px;display:flex;gap:12px;flex-wrap:wrap;color:var(--gedaempft)}
  .kosten .fehlt{color:var(--warn)}
  button{font:inherit;font-size:14px;padding:8px 15px;border-radius:6px;cursor:pointer;border:none;
         background:var(--signal);color:#06202a;font-weight:600;letter-spacing:.03em}
  button:disabled{background:var(--panel2);color:var(--gedaempft);cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
  select{font:inherit;font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--linie);
         border-radius:6px;padding:7px 9px}

  .bau{background:var(--panel2);border:1px solid var(--signal);border-radius:8px;padding:12px 14px;margin-top:11px}
  .balken{height:5px;background:var(--tief);border-radius:3px;overflow:hidden;margin-top:8px}
  .balken i{display:block;height:100%;background:var(--signal)}
  .fuss{margin-top:28px;font-size:12px;color:var(--gedaempft);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .fuss button{background:none;border:1px solid var(--linie);color:var(--gedaempft);font-size:12px;padding:5px 11px;font-weight:400}
</style>
</head>
<body>
<div class="huelle">
  <h1>Aussenposten</h1>
  <div class="unterzeile">Etappe 3 — Ein Sternsystem, viele Welten. Ressourcen teilt sich das Reich, Bewohner bleiben, wo sie sind.</div>

  <div class="leiste" id="leiste"></div>

  <h2>Sternenkarte <span class="beiheft" id="karteninfo"></span></h2>
  <div class="karte" id="karte"></div>
  <div id="unterwegs"></div>

  <div class="reiter" id="reiter"></div>
  <div id="tafel"></div>

  <div class="fuss">
    <span>Spielstand wird im Browser gespeichert.</span>
    <button id="reset">Neu anfangen</button>
  </div>
</div>

<script>
/* ============================================================
   0. STELLSCHRAUBEN
   ============================================================ */
const TEMPO = 1;
const NAHRUNG_PRO_KOPF = 15;
const ENERGIE_PRO_KOPF = 3;
const VOLLBELEGUNG_BONUS = 0.20;
const SONDE_KOSTEN = { energie: 60 };
const KOLONIE_KOSTEN = { erz: 400, kristall: 80 };   // steigt mit jeder Kolonie
const KOLONIE_STEIGERUNG = 1.6;

/* ============================================================
   1. SYMBOLE
   ============================================================ */
const SVG = {
  erz: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--erz)" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3l7 5-2.5 11h-9L5 8z"/><path d="M5 8h14M9.5 19L12 3l4.5 16"/></svg>`,
  kristall: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--kristall)" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2l5 7-5 13-5-13z"/><path d="M7 9h10"/></svg>`,
  energie: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--energie)" stroke-width="1.6" stroke-linejoin="round"><path d="M13 2L5 13h6l-1 9 9-12h-7z"/></svg>`,
  nahrung: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--nahrung)" stroke-width="1.6" stroke-linecap="round"><path d="M12 21V9"/><path d="M12 9C12 5 9 3 6 3c0 4 3 6 6 6z"/><path d="M12 12c0-4 3-6 6-6 0 4-3 6-6 6z"/></svg>`,
  stadt: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--signal)" stroke-width="1.5" stroke-linejoin="round"><path d="M3 21V10l5-3v14"/><path d="M8 21V5l7-3v19"/><path d="M15 21V11l6 3v7"/><path d="M2 21h20"/></svg>`,
  bergbau: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--erz)" stroke-width="1.5" stroke-linejoin="round"><path d="M3 20h18"/><path d="M6 20l5-11 5 11"/><path d="M8.5 14h5"/><path d="M11 9l1-5"/></svg>`,
  generator: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--energie)" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="8" width="18" height="10" rx="1.5"/><path d="M7 8V5m10 3V5M3 13h18"/></svg>`,
  agrar: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--nahrung)" stroke-width="1.5" stroke-linecap="round"><path d="M3 20h18"/><path d="M7 20V9m0 0c-2 0-3-1.5-3-3.5C6 5.5 7 7 7 9zm0 0c2 0 3-1.5 3-3.5C8 5.5 7 7 7 9z"/><path d="M15 20V7m0 0c-2 0-3-1.5-3-3.5C14 3.5 15 5 15 7zm0 0c2 0 3-1.5 3-3.5C16 3.5 15 5 15 7z"/></svg>`,
  hauptquartier: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--signal)" stroke-width="1.5" stroke-linejoin="round"><path d="M4 21V9l8-6 8 6v12z"/><path d="M10 21v-6h4v6"/></svg>`,
  raffinerie: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--kristall)" stroke-width="1.5" stroke-linejoin="round"><path d="M3 21V11l5 3V11l5 3V8l3-5 3 5v13z"/><path d="M3 21h18"/></svg>`,
  wohnkomplex: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--signal)" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/></svg>`,
  lager: s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="var(--gedaempft)" stroke-width="1.5" stroke-linejoin="round"><path d="M3 10l9-5 9 5v11H3z"/><path d="M8 21v-7h8v7"/></svg>`,
};

/* ============================================================
   2. WELTENTYPEN — jede Welt hat ein eigenes Profil
   ============================================================ */
const TYPEN = {
  gemaessigt: { name:"Gemäßigte Welt", farbe:"#5fa85f", plaetze:16, bewohnbarkeit:1.0,
                felder:{bergbau:4, generator:4, agrar:6},
                beschreibung:"Ausgewogen und leicht zu besiedeln." },
  fels:       { name:"Felswelt",       farbe:"#a8845f", plaetze:13, bewohnbarkeit:0.6,
                felder:{bergbau:8, generator:3, agrar:1},
                beschreibung:"Reich an Erz, kaum Boden zum Anbauen." },
  vulkan:     { name:"Vulkanwelt",     farbe:"#c25f47", plaetze:12, bewohnbarkeit:0.5,
                felder:{bergbau:5, generator:7, agrar:0},
                beschreibung:"Endlose Hitze — hervorragend für Kraftwerke, nichts wächst." },
  ozean:      { name:"Ozeanwelt",      farbe:"#4f8fc0", plaetze:14, bewohnbarkeit:0.9,
                felder:{bergbau:2, generator:3, agrar:8},
                beschreibung:"Die Kornkammer eines Reiches." },
  eis:        { name:"Eiswelt",        farbe:"#8fb8c8", plaetze:10, bewohnbarkeit:0.4,
                felder:{bergbau:5, generator:2, agrar:2},
                beschreibung:"Karg und feindselig. Wächst langsam." },
  wueste:     { name:"Wüstenwelt",     farbe:"#c9a95f", plaetze:14, bewohnbarkeit:0.7,
                felder:{bergbau:5, generator:6, agrar:2},
                beschreibung:"Viel Sonne, wenig Wasser." },
};

/* ============================================================
   3. ARBEITSPLÄTZE, DISTRIKTE, GEBÄUDE
   ============================================================ */
const JOBS = {
  bergarbeiter:{ name:"Bergarbeiter", kategorie:"bergbau",    produziert:{erz:60} },
  techniker:   { name:"Techniker",    kategorie:"generator",  produziert:{energie:60} },
  farmer:      { name:"Farmer",       kategorie:"agrar",      produziert:{nahrung:60} },
  raffineur:   { name:"Raffineur",    kategorie:"raffinerie", produziert:{kristall:25},
                 verbraucht:{erz:50, energie:10} },
};
const KATEGORIEN = { bergbau:"Bergbau", generator:"Kraftwerke", agrar:"Landwirtschaft", raffinerie:"Raffinerien" };

const DISTRIKTE = {
  stadt:     { name:"Stadtdistrikt", ikon:"stadt", beschreibung:"Wohnraum und Platz für Gebäude.",
               kosten:{erz:90}, wohnraum:5, jobs:{} },
  bergbau:   { name:"Bergbaudistrikt", ikon:"bergbau", beschreibung:"Stellen für Bergarbeiter.",
               kosten:{erz:70}, wohnraum:2, jobs:{bergarbeiter:2} },
  generator: { name:"Kraftwerksdistrikt", ikon:"generator", beschreibung:"Stellen für Techniker.",
               kosten:{erz:70}, wohnraum:2, jobs:{techniker:2} },
  agrar:     { name:"Agrardistrikt", ikon:"agrar", beschreibung:"Stellen für Farmer.",
               kosten:{erz:70}, wohnraum:2, jobs:{farmer:2} },
};

const GEBAEUDE = {
  hauptquartier:{ name:"Verwaltungssitz", ikon:"hauptquartier", baubar:false,
                  beschreibung:"Der Kern jeder Kolonie.", wohnraum:5, lager:1000 },
  raffinerie:   { name:"Raffinerie", ikon:"raffinerie", baubar:true,
                  beschreibung:"Veredelt Erz zu Kristall.", kosten:{erz:200}, jobs:{raffineur:2} },
  wohnkomplex:  { name:"Wohnkomplex", ikon:"wohnkomplex", baubar:true,
                  beschreibung:"Wohnraum ohne neue Arbeitsplätze.",
                  kosten:{erz:160, kristall:20}, wohnraum:8 },
  lager:        { name:"Lagerhalle", ikon:"lager", baubar:true,
                  beschreibung:"Hebt die Speichergrenze des ganzen Reiches.",
                  kosten:{erz:180, kristall:15}, lager:4000 },
};

const RES = ["erz","kristall","energie","nahrung"];
const RES_NAMEN = { erz:"Erz", kristall:"Kristall", energie:"Energie", nahrung:"Nahrung" };

/* ============================================================
   4. STERNENKARTE ERZEUGEN
   ============================================================ */
const NAMEN = ["Kaldar","Veyra","Thessa","Orun","Mirak","Sevesh","Dalun","Aphex",
               "Rhoven","Nemea","Calyx","Ostara","Tirith","Vandu","Halix"];
const ROEMISCH = ["I","II","III","IV","V"];

function zufall(seed){                    // einfacher, reproduzierbarer Zufall
  let x = seed;
  return () => { x = (x*1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; };
}

function karteErzeugen(seed){
  const r = zufall(seed);
  const typen = Object.keys(TYPEN);
  const welten = [];
  const genutzteNamen = [];

  for(let i=0; i<11; i++){
    // Positionen ringförmig um das Zentrum verteilen
    const ring = i === 0 ? 0 : 1 + Math.floor((i-1)/5);
    const winkel = r() * Math.PI * 2;
    const radius = i === 0 ? 0 : ring * 26 + r()*10;
    let stamm;
    do { stamm = NAMEN[Math.floor(r()*NAMEN.length)]; } while(genutzteNamen.includes(stamm));
    genutzteNamen.push(stamm);

    welten.push({
      id: i,
      name: `${stamm} ${ROEMISCH[Math.floor(r()*ROEMISCH.length)]}`,
      typ: i === 0 ? "gemaessigt" : typen[Math.floor(r()*typen.length)],
      x: 50 + Math.cos(winkel)*radius,
      y: 50 + Math.sin(winkel)*radius * 0.62,
      erkundet: i === 0,
    });
  }
  return welten;
}

function entfernung(a, b){
  return Math.hypot(a.x-b.x, a.y-b.y);
}
// Entfernung zur nächstgelegenen eigenen Kolonie
function naechsteKolonie(welt){
  let best = null, bestD = Infinity;
  for(const id in spiel.kolonien){
    const w = spiel.karte[id];
    const d = entfernung(welt, w);
    if(d < bestD){ bestD = d; best = w; }
  }
  return { welt: best, distanz: bestD };
}

/* ============================================================
   5. SPIELSTAND
   ============================================================ */
function neueKolonie(){
  return {
    bevoelkerung: 2, wachstum: 0,
    reihenfolge: ["farmer","techniker","bergarbeiter","raffineur"],
    distrikte: { stadt:1, bergbau:0, generator:0, agrar:0 },
    gebaeude:  { hauptquartier:1, raffinerie:0, wohnkomplex:0, lager:0 },
    bau: null,
  };
}

function neuesSpiel(){
  const seed = Math.floor(Math.random()*1e9);
  const heimat = neueKolonie();
  heimat.bevoelkerung = 4;
  heimat.distrikte = { stadt:1, bergbau:1, generator:1, agrar:1 };
  return {
    seed,
    karte: karteErzeugen(seed),
    res: { erz:600, kristall:60, energie:300, nahrung:400 },
    kolonien: { 0: heimat },
    sonde: null,          // { zielId, fertigAb, dauer }
    kolonieflug: null,    // { zielId, quelleId, fertigAb, dauer }
    auswahl: 0,
    zuletzt: Date.now(),
  };
}

let spiel = laden();

function laden(){
  try{
    const roh = localStorage.getItem("aussenposten4");
    if(!roh) return neuesSpiel();
    const s = JSON.parse(roh);
    if(!s.karte || !s.kolonien) return neuesSpiel();
    for(const id in s.kolonien){
      const k = s.kolonien[id];
      for(const d in DISTRIKTE) if(!(d in k.distrikte)) k.distrikte[d]=0;
      for(const g in GEBAEUDE)  if(!(g in k.gebaeude))  k.gebaeude[g]=0;
      if(!Array.isArray(k.reihenfolge)) k.reihenfolge = Object.keys(JOBS);
      for(const j in JOBS) if(!k.reihenfolge.includes(j)) k.reihenfolge.push(j);
      k.reihenfolge = k.reihenfolge.filter(j => j in JOBS);
    }
    return s;
  }catch(e){ return neuesSpiel(); }
}
function speichern(){ localStorage.setItem("aussenposten4", JSON.stringify(spiel)); }

/* ============================================================
   6. EINE KOLONIE DURCHRECHNEN
   ============================================================ */
function berechneKolonie(id){
  const k = spiel.kolonien[id];
  const welt = spiel.karte[id];
  const typ = TYPEN[welt.typ];

  let wohnraum = 0, lager = 0;
  const stellen = {};
  for(const j in JOBS) stellen[j] = 0;

  for(const s in DISTRIKTE){
    const n = k.distrikte[s], d = DISTRIKTE[s];
    wohnraum += d.wohnraum * n;
    for(const j in d.jobs) stellen[j] += d.jobs[j] * n;
  }
  for(const s in GEBAEUDE){
    const n = k.gebaeude[s], g = GEBAEUDE[s];
    wohnraum += (g.wohnraum||0) * n;
    lager    += (g.lager||0) * n;
    for(const j in (g.jobs||{})) stellen[j] += g.jobs[j] * n;
  }

  const bev = Math.floor(k.bevoelkerung);
  let frei = bev;
  const besetzt = {};
  for(const j in JOBS) besetzt[j] = 0;
  for(const j of k.reihenfolge){
    const n = Math.min(frei, stellen[j]);
    besetzt[j] = n; frei -= n;
  }
  const arbeitslose = frei;

  const katStellen = {}, katBesetzt = {};
  for(const c in KATEGORIEN){ katStellen[c]=0; katBesetzt[c]=0; }
  for(const j in JOBS){
    katStellen[JOBS[j].kategorie] += stellen[j];
    katBesetzt[JOBS[j].kategorie] += besetzt[j];
  }
  const bonus = {};
  for(const c in KATEGORIEN) bonus[c] = katStellen[c] > 0 && katBesetzt[c] === katStellen[c];

  const ein = { erz:0, kristall:0, energie:0, nahrung:0 };
  for(const j in JOBS){
    const n = besetzt[j]; if(!n) continue;
    const f = bonus[JOBS[j].kategorie] ? 1 + VOLLBELEGUNG_BONUS : 1;
    for(const r in (JOBS[j].produziert||{})) ein[r] += JOBS[j].produziert[r]*n*f;
    for(const r in (JOBS[j].verbraucht||{})) ein[r] -= JOBS[j].verbraucht[r]*n;
  }
  ein.nahrung -= bev * NAHRUNG_PRO_KOPF;
  ein.energie -= bev * ENERGIE_PRO_KOPF;

  const platzAnteil = wohnraum > 0 ? Math.max(0, 1 - bev/wohnraum) : 0;
  const wachstumProStunde = 3500 * platzAnteil * typ.bewohnbarkeit;
  const wachstumsziel = 100 + 45*bev;

  return { welt, typ, wohnraum, lager, stellen, besetzt, arbeitslose, bev, ein, bonus,
           katStellen, katBesetzt, wachstumProStunde, wachstumsziel };
}

// Reichsweite Summe
function berechneReich(){
  const ein = { erz:0, kristall:0, energie:0, nahrung:0 };
  let lagergrenze = 4000, bev = 0, arbeitslose = 0;
  const je = {};
  for(const id in spiel.kolonien){
    const z = berechneKolonie(id);
    je[id] = z;
    for(const r of RES) ein[r] += z.ein[r];
    lagergrenze += z.lager;
    bev += z.bev; arbeitslose += z.arbeitslose;
  }
  const stromausfall = spiel.res.energie <= 0 && ein.energie < 0;
  if(stromausfall) for(const r of RES) if(ein[r] > 0) ein[r] *= 0.5;
  const hunger = spiel.res.nahrung <= 0 && ein.nahrung < 0;
  return { ein, lagergrenze, bev, arbeitslose, je, stromausfall, hunger };
}

/* ============================================================
   7. ZEIT VERRECHNEN
   ============================================================ */
function fortschreiben(){
  const jetzt = Date.now();
  let sek = (jetzt - spiel.zuletzt)/1000 * TEMPO;
  spiel.zuletzt = jetzt;
  if(sek <= 0) return;

  while(sek > 0){
    const schritt = Math.min(sek, 60);
    sek -= schritt;
    const g = berechneReich();

    for(const r of RES)
      spiel.res[r] = Math.max(0, Math.min(g.lagergrenze, spiel.res[r] + g.ein[r]*schritt/3600));

    for(const id in spiel.kolonien){
      const k = spiel.kolonien[id], z = g.je[id];
      let rate = z.wachstumProStunde;
      if(g.hunger) rate = -3000;
      k.wachstum += rate * schritt/3600;
      while(k.wachstum >= z.wachstumsziel){ k.wachstum -= z.wachstumsziel; k.bevoelkerung += 1; }
      if(k.wachstum < 0){
        if(k.bevoelkerung > 1){ k.bevoelkerung -= 1; k.wachstum += z.wachstumsziel; }
        else k.wachstum = 0;
      }
      if(k.bau && jetzt >= k.bau.fertigAb){
        if(k.bau.art === "distrikt") k.distrikte[k.bau.schluessel] += 1;
        else k.gebaeude[k.bau.schluessel] += 1;
        k.bau = null;
      }
    }

    if(spiel.sonde && jetzt >= spiel.sonde.fertigAb){
      spiel.karte[spiel.sonde.zielId].erkundet = true;
      spiel.auswahl = spiel.sonde.zielId;
      spiel.sonde = null;
    }
    if(spiel.kolonieflug && jetzt >= spiel.kolonieflug.fertigAb){
      const zielId = spiel.kolonieflug.zielId;
      spiel.kolonien[zielId] = neueKolonie();
      spiel.auswahl = zielId;
      spiel.kolonieflug = null;
    }
  }
}

/* ============================================================
   8. AKTIONEN
   ============================================================ */
function bezahlbar(kosten){ for(const r in kosten) if(spiel.res[r] < kosten[r]) return false; return true; }
function abbuchen(kosten){ for(const r in kosten) spiel.res[r] -= kosten[r]; }
function bauzeit(kosten){ let s=0; for(const r in kosten) s+=kosten[r]; return Math.max(5, Math.floor(s/12)); }

function kolonieKosten(){
  const n = Object.keys(spiel.kolonien).length;
  const k = {};
  for(const r in KOLONIE_KOSTEN) k[r] = Math.floor(KOLONIE_KOSTEN[r] * Math.pow(KOLONIE_STEIGERUNG, n-1));
  return k;
}

function gebaeudeplaetze(id){ return 2 + Math.floor(spiel.kolonien[id].distrikte.stadt/2); }
function gebaeudeBelegt(id){
  let n=0; for(const s in GEBAEUDE) if(GEBAEUDE[s].baubar) n += spiel.kolonien[id].gebaeude[s]; return n;
}
function distrikteBelegt(id){ let n=0; for(const s in DISTRIKTE) n += spiel.kolonien[id].distrikte[s]; return n; }
function distriktLimit(id, s){
  const typ = TYPEN[spiel.karte[id].typ];
  return s === "stadt" ? typ.plaetze : typ.felder[s];
}
function kannDistrikt(id, s){
  const k = spiel.kolonien[id], typ = TYPEN[spiel.karte[id].typ];
  return !k.bau && distrikteBelegt(id) < typ.plaetze
      && k.distrikte[s] < distriktLimit(id, s) && bezahlbar(DISTRIKTE[s].kosten);
}
function kannGebaeude(id, s){
  const k = spiel.kolonien[id], g = GEBAEUDE[s];
  return g.baubar && !k.bau && gebaeudeBelegt(id) < gebaeudeplaetze(id) && bezahlbar(g.kosten);
}
function baue(id, art, s){
  const def = art === "distrikt" ? DISTRIKTE[s] : GEBAEUDE[s];
  if(art === "distrikt" ? !kannDistrikt(id,s) : !kannGebaeude(id,s)) return;
  abbuchen(def.kosten);
  const dauer = bauzeit(def.kosten);
  spiel.kolonien[id].bau = { art, schluessel:s, dauer, fertigAb: Date.now() + dauer*1000/TEMPO };
  speichern(); zeichnen();
}
function verschiebe(id, job, richtung){
  const r = spiel.kolonien[id].reihenfolge;
  const i = r.indexOf(job), n = i + richtung;
  if(i<0 || n<0 || n>=r.length) return;
  [r[i], r[n]] = [r[n], r[i]];
  speichern(); zeichnen();
}
function sondeSenden(zielId){
  if(spiel.sonde || spiel.karte[zielId].erkundet || !bezahlbar(SONDE_KOSTEN)) return;
  abbuchen(SONDE_KOSTEN);
  const d = naechsteKolonie(spiel.karte[zielId]).distanz;
  const dauer = Math.max(10, Math.floor(d * 1.2));
  spiel.sonde = { zielId, dauer, fertigAb: Date.now() + dauer*1000/TEMPO };
  speichern(); zeichnen();
}
function kolonisieren(zielId, quelleId){
  const kosten = kolonieKosten();
  const quelle = spiel.kolonien[quelleId];
  if(spiel.kolonieflug || !bezahlbar(kosten) || !quelle || quelle.bevoelkerung < 3) return;
  abbuchen(kosten);
  quelle.bevoelkerung -= 2;                     // die Siedler kommen von irgendwoher
  const d = entfernung(spiel.karte[zielId], spiel.karte[quelleId]);
  const dauer = Math.max(20, Math.floor(d*2.2));
  spiel.kolonieflug = { zielId, quelleId, dauer, fertigAb: Date.now() + dauer*1000/TEMPO };
  speichern(); zeichnen();
}

/* ============================================================
   9. ANZEIGE
   ============================================================ */
const nf = new Intl.NumberFormat("de-DE");
const z0 = n => nf.format(Math.round(n));
function zeitText(s){
  s = Math.max(0, Math.ceil(s));
  const h=Math.floor(s/3600), m=Math.floor(s%3600/60), r=s%60;
  if(h) return `${h} h ${String(m).padStart(2,"0")} min`;
  if(m) return `${m} min ${String(r).padStart(2,"0")} s`;
  return `${r} s`;
}
function kostenZeile(kosten, dauer){
  let h="";
  for(const r in kosten)
    h += `<span class="${spiel.res[r]<kosten[r]?"fehlt":""}">${RES_NAMEN[r]} ${z0(kosten[r])}</span>`;
  if(dauer != null) h += `<span>${zeitText(dauer)}</span>`;
  return h;
}
function istKolonie(id){ return id in spiel.kolonien; }

function zeichnen(){
  const g = berechneReich();

  // Ressourcen
  let h = "";
  for(const r of RES){
    const rate = g.ein[r];
    h += `<div class="res" style="--rand:var(--${r})">${SVG[r](21)}
      <div><div class="name">${RES_NAMEN[r]}</div>
      <div class="wert">${z0(spiel.res[r])}</div>
      <div class="rate ${rate<0?"minus":""}">${rate>=0?"+":""}${z0(rate)} / h</div></div></div>`;
  }
  document.getElementById("leiste").innerHTML = h;

  // Sternenkarte
  const anzKol = Object.keys(spiel.kolonien).length;
  const anzErk = spiel.karte.filter(w=>w.erkundet).length;
  document.getElementById("karteninfo").textContent =
    `${anzKol} Kolonien · ${anzErk} von ${spiel.karte.length} Welten erkundet · ${g.bev} Bewohner`;

  let punkte = "", linien = "";
  for(const w of spiel.karte){
    if(istKolonie(w.id)){
      const n = naechsteKolonie(w);
      // Verbindungslinien zwischen Kolonien nur zur Heimat, hält die Karte ruhig
      if(w.id !== 0)
        linien += `<line x1="${w.x}" y1="${w.y}" x2="${spiel.karte[0].x}" y2="${spiel.karte[0].y}"
                    stroke="var(--linie)" stroke-width="0.4" stroke-dasharray="1.5 1.5"/>`;
    }
  }
  for(const w of spiel.karte){
    const typ = TYPEN[w.typ];
    const kolonie = istKolonie(w.id);
    const gewaehlt = spiel.auswahl === w.id;
    const farbe = w.erkundet ? typ.farbe : "#3b5470";
    punkte += `<g class="punkt" data-welt="${w.id}" tabindex="0">
      ${gewaehlt?`<circle cx="${w.x}" cy="${w.y}" r="5.6" fill="none" stroke="var(--signal)" stroke-width="0.7"/>`:""}
      ${kolonie?`<circle cx="${w.x}" cy="${w.y}" r="4.4" fill="none" stroke="var(--signal)" stroke-width="0.6"/>`:""}
      <circle cx="${w.x}" cy="${w.y}" r="3" fill="${farbe}"/>
      <text x="${w.x}" y="${w.y+7.4}" text-anchor="middle" font-size="3.1"
            fill="${w.erkundet?"var(--text)":"var(--gedaempft)"}">${w.erkundet?w.name:"?"}</text>
    </g>`;
  }
  document.getElementById("karte").innerHTML =
    `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${linien}${punkte}</svg>`;

  // Sonde / Kolonieflug unterwegs
  let unterwegs = "";
  if(spiel.sonde){
    const rest = (spiel.sonde.fertigAb - Date.now())/1000;
    unterwegs += `<div class="bau"><strong>Sonde unterwegs</strong> zu ${spiel.karte[spiel.sonde.zielId].name}
      <span style="float:right;font-variant-numeric:tabular-nums">${zeitText(rest*TEMPO)}</span>
      <div class="balken"><i style="width:${Math.min(100,(1-rest/(spiel.sonde.dauer/TEMPO))*100)}%"></i></div></div>`;
  }
  if(spiel.kolonieflug){
    const rest = (spiel.kolonieflug.fertigAb - Date.now())/1000;
    unterwegs += `<div class="bau"><strong>Siedlerschiff unterwegs</strong> nach ${spiel.karte[spiel.kolonieflug.zielId].name}
      <span style="float:right;font-variant-numeric:tabular-nums">${zeitText(rest*TEMPO)}</span>
      <div class="balken"><i style="width:${Math.min(100,(1-rest/(spiel.kolonieflug.dauer/TEMPO))*100)}%"></i></div></div>`;
  }
  document.getElementById("unterwegs").innerHTML = unterwegs;

  // Reiter für schnellen Wechsel
  h = "";
  for(const id in spiel.kolonien){
    h += `<button data-welt="${id}" class="${+spiel.auswahl===+id?"aktiv":""}">${spiel.karte[id].name}</button>`;
  }
  document.getElementById("reiter").innerHTML = h;

  // Tafel: je nach Auswahl
  const welt = spiel.karte[spiel.auswahl];
  document.getElementById("tafel").innerHTML =
    istKolonie(welt.id) ? kolonieTafel(welt.id, g) : weltTafel(welt);
}

function weltTafel(welt){
  const typ = TYPEN[welt.typ];
  if(!welt.erkundet){
    const d = naechsteKolonie(welt).distanz;
    const dauer = Math.max(10, Math.floor(d*1.2));
    return `<div class="tafel">
      <div class="titel">${welt.name} — unerkundet</div>
      <div class="beschreibung">Was dort liegt, weiß niemand. Eine Sonde bringt Klarheit.</div>
      <div class="kosten" style="margin-bottom:11px">${kostenZeile(SONDE_KOSTEN, dauer)}</div>
      <button data-sonde="${welt.id}" ${spiel.sonde||!bezahlbar(SONDE_KOSTEN)?"disabled":""}>
        ${spiel.sonde?"Sonde bereits unterwegs":"Sonde senden"}</button></div>`;
  }
  const kosten = kolonieKosten();
  const kandidaten = Object.keys(spiel.kolonien).filter(id => spiel.kolonien[id].bevoelkerung >= 3);
  let auswahlHtml = kandidaten.map(id =>
    `<option value="${id}">${spiel.karte[id].name} (${Math.floor(spiel.kolonien[id].bevoelkerung)} Bewohner)</option>`).join("");
  const d = kandidaten.length ? entfernung(welt, spiel.karte[kandidaten[0]]) : 0;
  const dauer = Math.max(20, Math.floor(d*2.2));

  return `<div class="tafel">
    <div class="titel">${welt.name} <span class="anzahl">${typ.name}</span></div>
    <div class="beschreibung">${typ.beschreibung}</div>
    <div class="kennzahlen" style="margin-top:12px">
      <div class="kz"><div class="k">Distriktplätze</div><div class="v">${typ.plaetze}</div></div>
      <div class="kz"><div class="k">Bergbaufelder</div><div class="v">${typ.felder.bergbau}</div></div>
      <div class="kz"><div class="k">Kraftwerksfelder</div><div class="v">${typ.felder.generator}</div></div>
      <div class="kz"><div class="k">Agrarfelder</div><div class="v">${typ.felder.agrar}</div></div>
      <div class="kz"><div class="k">Bewohnbarkeit</div><div class="v">${Math.round(typ.bewohnbarkeit*100)} %</div></div>
    </div>
    <div class="kosten" style="margin:12px 0">${kostenZeile(kosten, dauer)}
      <span>2 Siedler aus der Herkunftskolonie</span></div>
    ${kandidaten.length ? `
      <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
        <select id="quelle">${auswahlHtml}</select>
        <button data-kolonisieren="${welt.id}" ${spiel.kolonieflug||!bezahlbar(kosten)?"disabled":""}>
          ${spiel.kolonieflug?"Siedlerschiff unterwegs":"Besiedeln"}</button>
      </div>`
      : `<div class="hinweis">Keine Kolonie hat genug Bewohner. Es braucht mindestens 3, um 2 Siedler abzugeben.</div>`}
  </div>`;
}

function kolonieTafel(id, g){
  const k = spiel.kolonien[id], z = g.je[id], typ = z.typ;
  const bisPop = z.wachstumProStunde > 0
    ? zeitText((z.wachstumsziel - k.wachstum)/z.wachstumProStunde*3600/TEMPO) : "—";
  const stellenGesamt = Object.values(z.stellen).reduce((a,b)=>a+b,0);

  let hinweise = "";
  if(g.hunger) hinweise += `<div class="hinweis rot">Hungersnot im ganzen Reich — überall schrumpft die Bevölkerung.</div>`;
  if(g.stromausfall) hinweise += `<div class="hinweis rot">Stromausfall im ganzen Reich — alle Erträge halbiert.</div>`;
  if(z.arbeitslose > 0) hinweise += `<div class="hinweis">${z.arbeitslose} Bewohner ohne Arbeit.</div>`;
  if(z.bev >= z.wohnraum) hinweise += `<div class="hinweis">Wohnraum erschöpft — hier wächst niemand mehr nach.</div>`;
  const offen = Object.keys(KATEGORIEN).filter(c => z.katStellen[c]>0 && !z.bonus[c]);
  if(!hinweise && offen.length)
    hinweise += `<div class="hinweis">Nicht voll besetzt: ${offen.map(c=>KATEGORIEN[c]).join(", ")}. Vollbelegung gibt je +20 %.</div>`;
  if(!hinweise) hinweise += `<div class="hinweis gut">Alles besetzt — überall +20 % Ertrag.</div>`;

  let h = `<div class="tafel">
    <div class="titel">${z.welt.name} <span class="anzahl">${typ.name} · Bewohnbarkeit ${Math.round(typ.bewohnbarkeit*100)} %</span></div>
    <div class="kennzahlen" style="margin-top:11px">
      <div class="kz"><div class="k">Bewohner</div>
        <div class="v ${z.bev>=z.wohnraum?"warn":""}">${z.bev} / ${z.wohnraum}</div></div>
      <div class="kz"><div class="k">In Arbeit</div>
        <div class="v ${z.arbeitslose>0?"warn":""}">${z.bev - z.arbeitslose} / ${stellenGesamt}</div></div>
      <div class="kz"><div class="k">Nächster Zuwachs</div><div class="v">${bisPop}</div></div>
      <div class="kz"><div class="k">Beitrag Erz</div><div class="v">${z0(z.ein.erz)} / h</div></div>
      <div class="kz"><div class="k">Beitrag Nahrung</div><div class="v">${z0(z.ein.nahrung)} / h</div></div>
    </div>
    <div class="hinweise">${hinweise}</div></div>`;

  if(k.bau){
    const def = k.bau.art === "distrikt" ? DISTRIKTE[k.bau.schluessel] : GEBAEUDE[k.bau.schluessel];
    const rest = (k.bau.fertigAb - Date.now())/1000;
    h += `<div class="bau"><strong>Im Bau:</strong> ${def.name}
      <span style="float:right;font-variant-numeric:tabular-nums">${zeitText(rest*TEMPO)}</span>
      <div class="balken"><i style="width:${Math.min(100,(1-rest/(k.bau.dauer/TEMPO))*100)}%"></i></div></div>`;
  }

  // Arbeitsplätze
  h += `<h2>Arbeitsplätze <span class="beiheft">Von oben nach unten besetzt</span></h2>`;
  k.reihenfolge.forEach((j, i) => {
    const d = JOBS[j], b = z.besetzt[j], s = z.stellen[j];
    const voll = z.bonus[d.kategorie];
    const f = voll ? 1 + VOLLBELEGUNG_BONUS : 1;
    let ertrag = [];
    for(const r in (d.produziert||{})) ertrag.push(`+${z0(d.produziert[r]*b*f)} ${RES_NAMEN[r]}`);
    for(const r in (d.verbraucht||{})) ertrag.push(`−${z0(d.verbraucht[r]*b)} ${RES_NAMEN[r]}`);
    h += `<div class="job ${s===0?"leer":""} ${voll&&s>0?"bonus":""}">
      <div class="pfeile">
        <button data-hoch="${j}" data-id="${id}" ${i===0?"disabled":""}>▲</button>
        <button data-runter="${j}" data-id="${id}" ${i===k.reihenfolge.length-1?"disabled":""}>▼</button>
      </div>
      <div class="rang">${i+1}</div>
      <div><div class="titel">${d.name}
        ${voll&&s>0?`<span class="marke">· ${KATEGORIEN[d.kategorie]} voll: +20 %</span>`:""}</div>
        <div class="ertrag">${ertrag.join(" · ") || "keine Stellen"} ${ertrag.length?"/ h":""}</div></div>
      <div class="zahl">${b} / ${s}</div></div>`;
  });

  // Distrikte
  h += `<h2>Distrikte <span class="beiheft">${distrikteBelegt(id)} von ${typ.plaetze} Plätzen belegt</span></h2>`;
  for(const s in DISTRIKTE){
    const d = DISTRIKTE[s], n = k.distrikte[s], limit = distriktLimit(id, s);
    const voll = n >= limit || distrikteBelegt(id) >= typ.plaetze;
    let ertrag = `+${d.wohnraum} Wohnraum`;
    for(const j in d.jobs) ertrag += ` · +${d.jobs[j]} ${JOBS[j].name}`;
    h += `<div class="zeile ${voll?"voll":""}">
      <div class="ikon">${SVG[d.ikon](21)}</div>
      <div class="info">
        <div class="titel">${d.name} <span class="anzahl">${n}${s!=="stadt"?" / "+limit:""}</span></div>
        <div class="beschreibung">${d.beschreibung} ${ertrag}</div>
        <div class="kosten">${kostenZeile(d.kosten, bauzeit(d.kosten))}</div></div>
      <button data-bau="distrikt" data-s="${s}" data-id="${id}" ${kannDistrikt(id,s)?"":"disabled"}>
        ${n>=limit?"Kein Feld frei":distrikteBelegt(id)>=typ.plaetze?"Welt voll":k.bau?"Bauplatz belegt":"Bauen"}</button>
    </div>`;
  }

  // Gebäude
  h += `<h2>Gebäude <span class="beiheft">${gebaeudeBelegt(id)} von ${gebaeudeplaetze(id)} Plätzen · je 2 Stadtdistrikte 1 Platz</span></h2>`;
  for(const s in GEBAEUDE){
    const gb = GEBAEUDE[s], n = k.gebaeude[s];
    let ertrag = [];
    if(gb.wohnraum) ertrag.push(`+${gb.wohnraum} Wohnraum`);
    if(gb.lager) ertrag.push(`+${z0(gb.lager)} Lager`);
    for(const j in (gb.jobs||{})) ertrag.push(`+${gb.jobs[j]} ${JOBS[j].name}`);
    h += `<div class="zeile ${gb.baubar?"":"voll"}">
      <div class="ikon">${SVG[gb.ikon](21)}</div>
      <div class="info">
        <div class="titel">${gb.name} <span class="anzahl">${n}</span></div>
        <div class="beschreibung">${gb.beschreibung} ${ertrag.join(" · ")}</div>
        ${gb.baubar?`<div class="kosten">${kostenZeile(gb.kosten, bauzeit(gb.kosten))}</div>`:""}</div>
      ${gb.baubar?`<button data-bau="gebaeude" data-s="${s}" data-id="${id}" ${kannGebaeude(id,s)?"":"disabled"}>
        ${gebaeudeBelegt(id)>=gebaeudeplaetze(id)?"Kein Platz":k.bau?"Bauplatz belegt":"Bauen"}</button>`:""}
    </div>`;
  }
  return h;
}

/* ============================================================
   10. START
   ============================================================ */
document.addEventListener("click", e => {
  const welt = e.target.closest("[data-welt]");
  if(welt){ spiel.auswahl = +welt.dataset.welt; speichern(); zeichnen(); return; }
  const b = e.target.closest("button");
  if(!b) return;
  if(b.dataset.bau)        baue(+b.dataset.id, b.dataset.bau, b.dataset.s);
  else if(b.dataset.hoch)  verschiebe(+b.dataset.id, b.dataset.hoch, -1);
  else if(b.dataset.runter)verschiebe(+b.dataset.id, b.dataset.runter, 1);
  else if(b.dataset.sonde) sondeSenden(+b.dataset.sonde);
  else if(b.dataset.kolonisieren){
    const sel = document.getElementById("quelle");
    if(sel) kolonisieren(+b.dataset.kolonisieren, +sel.value);
  }
});
document.addEventListener("keydown", e => {
  if(e.key !== "Enter" && e.key !== " ") return;
  const welt = e.target.closest?.("[data-welt]");
  if(welt){ e.preventDefault(); spiel.auswahl = +welt.dataset.welt; speichern(); zeichnen(); }
});
document.getElementById("reset").addEventListener("click", () => {
  if(confirm("Spielstand wirklich löschen? Auch die Sternenkarte wird neu erzeugt.")){
    localStorage.removeItem("aussenposten4");
    spiel = neuesSpiel();
    zeichnen();
  }
});
